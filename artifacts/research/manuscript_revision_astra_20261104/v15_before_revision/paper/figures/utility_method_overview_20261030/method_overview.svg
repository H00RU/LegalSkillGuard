<svg xmlns="http://www.w3.org/2000/svg" width="8in" height="4.632in" viewBox="0 0 1140 660">
  <title>Evidence-guided procedural skill evolution with a frozen legal executor</title>
  <desc>All new-source forecasts precede training-target release. The teacher updates EC then EV, preserving the other task. Whole and dependency-consistent proposals are assessed on all seen training sources under native and complete-output utility. The selected library serves the next batch, while bounded failed-proposal evidence returns to teaching. The fixed first-batch reference is evaluation-only.</desc>
  <metadata>{"classification":"Implemented method schematic, not empirical results","config_sha256":"5e0486a5352d2e534b50265e3b902ac3aaa0c7d2c5107dd2b904f20a3191e894","frozen_sha256":"182e6cbf98e6ee7da8801ad7874554da50a071a91a8a4297e20d87b4fbea30ef","font":"DejaVu Serif; Georgia unavailable","test_feedback_enters_learning":false}</metadata>
