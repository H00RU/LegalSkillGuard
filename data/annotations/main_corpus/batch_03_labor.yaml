    expected_inquiries:
      - 请提供劳动合同、不参保约定、工资和所谓社保补助的逐月支付记录。
      - 社保个人权益记录能否证明整个在职期间各险种均未缴纳？
      - 约定由谁提供、签署时如何说明，你是否被告知不参保的后果或有协商空间？
      - 补助逐月金额、发放期间、工资条或转账备注如何记载，公司是否已经书面要求返还或抵扣已领取部分？
      - 解除通知准备在何时以何种方式送达，通知文本记载的解除原因、未参保期间和送达对象分别是什么？
      - 工作年限、解除前工资基数和其他可能影响经济补偿计算的事实是什么？
    memo_expectations:
      - 说明社会保险缴费属于法定义务，个人签字和补助安排不能当然排除参保责任。
      - 认定不参保约定无效，并区分条款效力、补助返还或抵扣与社保补缴情形。
      - 将公司持续未参保与劳动者解除原因建立清晰因果，强调解除通知的内容和送达证据。
      - 分析请求经济补偿的成立条件、工作年限和工资基数，避免与其他待遇重复计算。
      - 提示通过社保征缴渠道和劳动争议程序分别处理补缴与经济补偿请求的程序边界。
