annotations:
  - id: lsg_cn_0011
    source_line: 15
    source_case_sha256: 93074da29a5a4f18e9d9cbcdc64f60fb1efc4df7adf9001fcbdb6346fa3d7f89
    split: train
    legal_domain: labor_employment
    client_role: 被个人包工人招用并已获工伤认定的建筑工人张某
    consultation_stage: 工伤认定和劳动能力鉴定完成后、申请待遇仲裁前
    opening: 我在工地受伤并被认定工伤，但用工和承包关系复杂，建筑公司以双方不存在劳动关系为由拒绝承担待遇。我想确认责任主体和可主张项目。
    admission_reason: 转包链条、招用主体、事故、工伤认定、鉴定和无劳动关系判决完整，存在自然的责任主体误解。
    facts:
      - client_belief: 建筑公司把承包工程转包给刘某，实际是刘某招我进场工作。
        court_record: 某建筑公司将工程转包给刘某，刘某于2021年8月招用张某到工地工作。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某建筑公司将所承包工程转包给刘某"}
          - {section: basic_facts, quote: "刘某招用张某到工地工作"}
      - client_belief: 我在施工时从高处坠落，医院诊断为腰椎骨折。
        court_record: 张某于2021年10月10日作业时高坠受伤并被诊断腰椎骨折。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "张某在作业时从高处坠落受伤，诊断为腰椎骨折"}
      - client_belief: 既然生效判决确认我与建筑公司没有劳动关系，我担心公司就完全不负工伤保险责任。
        court_record: 建筑工程转包给个人时，工伤保险责任不必以存在劳动关系为前提，具备用工主体资格的承包人仍可能担责。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "生效判决已确认某建筑公司与张某之间不存在劳动关系"}
          - {section: adjudication, quote: "工伤保险责任的承担并非必须以存在劳动关系作为前提条件"}
      - client_belief: 因为是刘某直接招用我，我原以为只能找刘某个人承担，不能向建筑公司主张。
        court_record: 个人转包人招用的劳动者发生工伤时，具备用工主体资格的承包人应承担工伤保险责任。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在建筑工程转包给个人的情况下，一旦发生工伤事故，具备用工主体资格的承包人应当承担工伤保险责任"}
      - client_belief: 人社部门已经认定事故伤害为工伤，并明确建筑公司承担工伤保险责任。
        court_record: 工伤决定书认定张某为工伤并由某建筑公司承担工伤保险责任。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "认定张某受到的事故伤害为工伤，某建筑公司对张某受到的事故伤害承担工伤保险责任"}
      - client_belief: 我的劳动功能障碍是八级，停工留薪期六个月，生活自理障碍未达级。
        court_record: 劳动能力鉴定委员会确定张某劳动功能障碍等级为八级、生活自理障碍等级未达级、停工留薪期六个月。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "确定张某劳动功能障碍等级为八级，生活自理障碍等级未达级，停工留薪期6个月"}
      - client_belief: 建筑公司没有为我缴纳工伤保险费，我担心因此没有保险基金可以支付就拿不到相应待遇。
        court_record: 某建筑公司未为张某缴纳工伤保险费，依法应由某建筑公司直接承担并支付张某相应的工伤保险待遇。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在某建筑公司未为张某缴纳工伤保险费的情况下，审理法院判令其向张某支付相应的工伤保险待遇"}
    expected_inquiries:
      - 请提供建筑公司的总承包或承包资料、转包协议以及刘某招用你的证明。
      - 事故发生的时间、地点、作业安排和现场管理人是谁，考勤、工资流水及同事证言分别记录了什么？
      - 工伤认定决定、送达和是否被复议诉讼的状态如何，是否已经生效？
      - 请提供劳动能力鉴定、病历、医疗费、停工期间工资和护理支出材料。
      - 建筑公司是否为你参保或支付过任何待遇，刘某是否已垫付、赔偿或签署协议？
      - 此前确认不存在劳动关系的判决具体处理了什么请求，是否涉及工伤保险责任？
    memo_expectations:
      - 区分劳动关系确认与特殊转包情形下的工伤保险责任，避免把前案判决扩大为全面免责。
      - 沿转包链条识别具备用工主体资格的承包人及个人招用事实，分析责任主体。
      - 说明工伤决定和劳动能力鉴定对待遇请求的基础作用，并核对其生效状态。
      - 按八级伤残、停工留薪和实际支出梳理待遇项目，同时扣除已支付款项避免重复。
      - 设计仲裁请求、责任主体和证据清单，提示与刘某之间其他赔付的衔接风险。
      - 区分参保基金支付与未参保责任主体直接支付，不能因公司未参保而把劳动者应有待遇落空。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 工人如实知道招用人、事故和鉴定；差异是“无劳动关系”和“个人招用”是否排除承包人工伤责任，符合取得工伤决定后的自然咨询。

  - id: lsg_cn_0012
    source_line: 16
    source_case_sha256: e167156bde743d0111f48d0a5a62bd1e0ce54f77a666ce2311fd904486184c2c
    split: train
    legal_domain: labor_employment
    client_role: 在两家关联企业混同环境中工作的劳动者王某
    consultation_stage: 离职且欠薪争议发生后、申请劳动仲裁前
    opening: 我入职时接触的是一家科技公司，实际工作中又长期使用另一家公司的场所和名义。现在被欠工资且没有书面合同，我想确认实际用人单位。
    admission_reason: 招聘、场所、业务、控制人、工资和手续均呈混同状态，客户无法识别实际用人单位具有真实性。
    facts:
      - client_belief: 我最初是看到某科技公司发布的招聘信息后应聘入职的。
        court_record: 某科技公司发布招聘启事，王某应聘后于2022年8月1日入职。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某科技公司发布招聘启事，王某应聘后于2022年8月1日入职"}
      - client_belief: 既然招聘主体是科技公司，我担心只能认定与科技公司有关系，不能选择数字公司。
        court_record: 在关联企业混同用工下，招聘名义不是唯一标准，还要综合实际工作场所、业务和劳动者合理认识。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "王某虽通过某科技公司名义应聘入职"}
          - {section: adjudication, quote: "其有理由相信是为某数字公司提供劳动"}
      - client_belief: 工作地点挂着数字公司的名牌，微信和QQ沟通也带有数字公司字样。
        court_record: 王某工作场所悬挂某数字公司名牌，日常工作使用的微信、QQ聊天软件也冠有某数字公司名称。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "王某的工作地点悬挂有“某数字公司”名牌"}
          - {section: basic_facts, quote: "微信、QQ聊天软件有“某数字公司”字样"}
      - client_belief: 两家公司经营业务重合，又都由梁某担任法定代表人并参与持股，我作为普通员工无法准确判断哪家才是实际用人单位。
        court_record: 某数字公司与某科技公司属于关联企业、经营业务重合，梁某同时担任两公司的法定代表人并持有两公司股权，王某难以确定实际用人单位。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某数字公司系一人公司，其法定代表人、股东均为梁某。某科技公司的法定代表人为梁某，股东为梁某（持股比例60%）、胡某（持股比例40%）"}
          - {section: adjudication, quote: "某数字公司、某科技公司属关联企业，经营业务存在重合"}
          - {section: adjudication, quote: "王某难以确定实际用人单位"}
      - client_belief: 没有书面合同，工资又由老板个人账户支付，我担心无法证明与任何一家公司存在劳动关系。
        court_record: 王某虽未签订书面劳动合同且工资由梁某个人账户发放，仍可结合实际管理、工作内容、场所标识和劳动给付对象认定劳动关系。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "两公司均未与王某订立书面劳动合同、亦未缴纳社会保险费与办理招退工手续，王某工资系通过梁某个人账户发放"}
          - {section: adjudication, quote: "王某的工作内容包含某数字公司经营业务"}
      - client_belief: 我从2022年8月1日工作到2023年2月22日，两家公司均未为我办社保和招退工手续。
        court_record: 王某自2022年8月1日工作至2023年2月22日，某数字公司与某科技公司均未与其订立书面劳动合同、缴纳社会保险费或办理招退工手续。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "于2022年8月1日入职并工作至2023年2月22日"}
          - {section: basic_facts, quote: "亦未缴纳社会保险费与办理招退工手续"}
      - client_belief: 我日常完成的工作中包含数字公司的经营业务，并不只是借用了带有其名称的办公场所和聊天工具。
        court_record: 王某的实际工作内容包含某数字公司的经营业务，这是认定劳动给付对象的重要事实。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "王某的工作内容包含某数字公司经营业务"}
    expected_inquiries:
      - 请保留招聘页面、入职通知和最初联系人的身份及其代表哪家公司作出的说明。
      - 谁安排考勤、任务、请假和绩效，相关人员使用哪家公司名义？
      - 工作成果最终用于哪家公司的客户、合同或产品，能否提供不涉密的业务记录？
      - 办公场所名牌、工位、工作证、邮箱、微信和QQ群原始记录目前由谁保管，分别显示哪家公司名称？
      - 工资由梁某个人账户支付的流水、备注、工资表和欠薪金额如何对应？
      - 两家公司的工商登记、股东、法定代表人、经营范围和实际办公是否存在重合？
    memo_expectations:
      - 说明关联企业混同用工时不能只看招聘名义，应综合从属性、实际管理和劳动给付对象。
      - 分析场所标识、通讯名称、工作内容和控制人重合如何支持劳动者对数字公司的合理信赖。
      - 处理个人账户发薪、无合同和无社保所带来的举证困难，而非据此否定劳动关系。
      - 论证劳动者在难以识别实际用人单位时择一主张的事实基础，并防止重复主张。
      - 明确劳动关系期间、欠薪计算及社保等请求所需材料和仲裁程序安排。
    editorial_review: *full_review
    editorial_note: 客户不被迫选定一个其无法知道的内部主体；以经营业务重合、共同控制人、场所通讯标识和实际工作内容表达关联企业交叉，避免把来源未证明的一般员工队伍写成“人员混同”。

  - id: lsg_cn_0013
    source_line: 17
    source_case_sha256: d1d03c72bd9ff75a34ac54c6055fed051ee8394a50e26602ea7252b013281e55
    split: train
    legal_domain: labor_employment
    client_role: 被前员工请求未续签书面合同二倍工资的原用人单位承继者某宾馆
    consultation_stage: 收到劳动者仲裁请求后、进入实体审理前
    opening: 一名员工劳动合同到期后继续工作，后来双方解除关系。他现在向承继原公司义务的我们主张未签合同责任，我想核清续签经过和法律后果。
    admission_reason: 原合同、续签通知、劳动者明确拒绝、继续履行和解除协议均有来源，可评估用人单位是否存在过错。
    facts:
      - client_belief: 原劳动合同期限从2018年12月11日至2023年12月10日，员工担任财务负责人。
        court_record: 冉某与某康旅公司订立书面劳动合同，合同期限为2018年12月11日至2023年12月10日，冉某担任财务部负责人。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "约定合同期限为2018年12月11日至2023年12月10日，职务为财务部负责人"}
      - client_belief: 合同到期后公司多次通过口头和微信通知他续签，但他主动拒绝。
        court_record: 某康旅公司多次通知续订，冉某以不签可以拿二倍工资为由拒绝。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某康旅公司多次通过口头及微信方式通知冉某续订劳动合同"}
          - {section: basic_facts, quote: "冉某以“公司要解散，不签合同可以拿二倍工资”为由拒绝续订"}
      - client_belief: 只要到期后继续用工却没有新书面合同，用人单位无论原因都必须支付二倍工资。
        court_record: 未签书面合同系劳动者故意拒绝续订时，用人单位不因此承担二倍工资责任。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在冉某故意不订立书面劳动合同的情况下，某康旅公司无需承担支付二倍工资的责任"}
      - client_belief: 合同到期后，公司仍按原约定付薪并缴纳社会保险到解除之日。
        court_record: 某康旅公司在原劳动合同到期后继续向冉某支付劳动报酬并缴纳社会保险费，社会保险费缴至2024年4月。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "某康旅公司仍按照原劳动合同约定支付劳动报酬并为冉某缴纳社会保险费"}
          - {section: basic_facts, quote: "某康旅公司为冉某缴纳社会保险费至2024年4月"}
      - client_belief: 原公司已经注销，我担心即使未签合同是员工故意造成，我们作为权利义务承继者仍要替原公司支付二倍工资。
        court_record: 冉某故意拒绝与某康旅公司续签书面劳动合同时，某康旅公司不承担二倍工资责任；该责任不会仅因某康旅公司注销并由某宾馆承继权利义务而产生。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "某康旅公司无需承担支付二倍工资的责任，承继其权利义务的某宾馆及其股东某农旅公司亦不承担责任"}
      - client_belief: 原公司注销后，其权利义务由我们宾馆承继。
        court_record: 2024年5月某康旅公司注销，权利义务由某宾馆承继。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某康旅公司注销登记，其权利义务由某宾馆承继"}
      - client_belief: 员工与原公司签过解除协议，确认解除日前的工资和其他报酬没有拖欠，但协议是否涵盖他后来主张的二倍工资还需审查文本和协商过程。
        court_record: 冉某与某康旅公司于2024年4月30日签订解除劳动合同协议，并确认某康旅公司不拖欠冉某截至2024年4月30日的工资及其他报酬。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "双方同意解除劳动合同，并确认某康旅公司不拖欠冉某2024年4月30日前的工资及其他报酬"}
      - client_belief: 某农旅公司是原公司某康旅公司的股东，员工在仲裁中同时请求我们宾馆和该农旅公司承担二倍工资等责任。
        court_record: 某农旅公司系某康旅公司股东；冉某申请仲裁时同时请求某宾馆、某农旅公司支付未订立书面劳动合同二倍工资等。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某农旅公司系某康旅公司股东。"}
          - {section: basic_facts, quote: "冉某向某劳动人事争议仲裁委员会申请仲裁，提出某宾馆、某农旅公司支付未订立书面劳动合同二倍工资等请求。"}
    expected_inquiries:
      - 请提供原劳动合同、到期时间和劳动者到期后继续工作的安排。
      - 续签通知分别在何时、由谁、以何种方式发出，微信原始记录能否证明送达和具体条件？
      - 劳动者拒签时的原话、理由和在场人员是什么，是否有其他书面确认？
      - 到期后工资、社保、岗位和管理是否延续，双方是否就续签条件发生实质分歧？
      - 解除协议的起草、协商和签署过程如何，是否明确提到二倍工资权利？
      - 仲裁申请列明了哪些被申请人、对每一主体分别提出哪些请求，宾馆承继文件及某农旅公司的股东登记如何记载？
    memo_expectations:
      - 识别二倍工资制度针对用人单位未履行书面化义务的功能，评价未签原因和双方过错。
      - 以多次续签通知和劳动者谋求二倍工资而拒签的证据，论证用人单位不存在应受惩罚的过错。
      - 区分继续付薪参保形成的劳动关系延续与二倍工资责任，两者不能混同。
      - 说明原公司无二倍工资责任时，注销和权利义务承继本身不会凭空产生该项责任。
      - 明确注销后的义务承继主体，并分别分析股东是否需要承担责任，避免主体混乱。
      - 审查解除协议中“工资及其他报酬”的具体范围和真实协商过程，不将其未经解释直接扩大为对法定请求的概括放弃。
    editorial_review: *full_review
    editorial_note: 采用被请求承担责任的承继单位视角，完整保留续签通知和拒签事实；差异分别检验拒签原因和注销承继是否会凭空产生二倍工资责任。

  - id: lsg_cn_0014
    source_line: 138
    source_case_sha256: ba97e3ef21e868078ae00f166e01b88ef235ca8c27e869bb2d88f755c540bc17
    split: train
    legal_domain: labor_employment
    client_role: 连续订立两次固定期限合同后收到到期终止通知的公交公司职工张某
    consultation_stage: 第二份合同届满并收到经济补偿后、申请劳动仲裁前
    opening: 我在公交公司工作，最近公司通知劳动合同到期后不再续签。我此前签过不止一份固定期限合同，也向公司提过续签要求，想确认公司能否直接终止。
    admission_reason: 两次固定期限合同、续签通知、投诉与终止通知的紧邻时间、劳动者续签选择和公司付款均有来源，可检验无固定期限合同强制缔约条件及法定例外。
    facts:
      - client_belief: 我和公交公司连续签过两份固定期限劳动合同，第二份在2020年7月31日到期。
        court_record: 张某与某公交公司连续订立两次固定期限劳动合同，第二次订立的劳动合同期限至2020年7月31日。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "张某与某公交公司连续订立二次固定期限劳动合同，其中第二次订立的劳动合同期限至2020年7月31日止"}
      - client_belief: 公司在2020年6月10日曾通知包括我在内的员工续订合同，但我认为是否改签无固定期限合同仍只能由公司决定。
        court_record: 某公交公司在2020年6月10日通知张某等人续订劳动合同；张某满足连续订立两次固定期限合同等条件并提出续订时，是否订立无固定期限合同由张某依法选择，公司不能单方拒绝。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "2020年6月10日，某公交公司通知张某等人续订劳动合同"}
          - {section: adjudication, quote: "张某提出与某公交公司订立无固定期限劳动合同符合法定条件"}
      - client_belief: 2020年6月12日我在平台实名投诉公司没有按规定配发口罩，公司在同一天通知合同到期终止并要求我离职交接。
        court_record: 张某于2020年6月12日实名投诉某公交公司不按规定配发口罩，某公交公司同日通知张某劳动合同到期终止并要求办理离职和工作交接。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2020年6月12日，张某在某平台实名投诉公司不按规定配发口罩"}
          - {section: basic_facts, quote: "同日，某公交公司通知张某劳动合同到期终止，办理离职手续并交接工作"}
      - client_belief: 固定期限届满属于自然终止，公司不需要核对我是否存在严重违纪、医疗期满不能工作或者经培训调整仍不能胜任等法定例外。
        court_record: 张某不存在劳动合同法第三十九条规定的过失性辞退情形，也不存在医疗期满后不能从事原工作或另行安排工作、以及不能胜任且经培训或调岗仍不能胜任的情形，公司不能绕开这些法定例外审查而拒绝续订。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "张某不存在劳动合同法第三十九条规定的过失性辞退情形"}
          - {section: adjudication, quote: "亦不存在第四十条第一项规定的“因劳动者患病或者非因工负伤，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作”及第二项规定的“劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作”的情形"}
      - client_belief: 收到终止通知后，我不止一次要求公司与我订立无固定期限劳动合同。
        court_record: 某公交公司通知合同到期终止后，张某多次要求某公交公司与其订立无固定期限劳动合同。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "此后，张某多次要求某公交公司与其订立无固定期限劳动合同"}
      - client_belief: 公司在2020年7月再次通知7月31日终止合同，并转账支付了终止合同的经济补偿；我担心收款就意味着终止已经合法完成。
        court_record: 某公交公司通知张某双方于2020年7月31日终止劳动合同并转账支付经济补偿，但支付经济补偿不能替代其在张某符合法定条件并选择续订时依法订立无固定期限劳动合同的义务。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "2020年7月，某公交公司通知张某，双方于2020年7月31日终止劳动合同，并通过转账方式向张某支付终止劳动合同的经济补偿"}
          - {section: adjudication, quote: "某公交公司单方作出终止劳动合同通知不符合法律规定"}
      - client_belief: 我一直在公司工作到第二份合同于2020年7月31日届满。
        court_record: 张某在某公交公司持续工作至2020年7月31日。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "张某在某公交公司工作至2020年7月31日"}
    expected_inquiries:
      - 请提供连续两份固定期限劳动合同，分别说明签订和届满日期以及中间是否连续履行。
      - 2020年6月10日公司是否已经通知包括你在内的员工续订劳动合同，现有通知能否确认这一时间和对象？
      - 收到终止通知后，你是否多次要求公司订立无固定期限合同，相关申请或沟通记录能否证明这一经过？
      - 实名投诉和公司终止通知各自的准确时间、内容与送达记录是什么，二者是否发生在同一天？
      - 公司是否曾主张你存在严重违纪、医疗期满不能工作或不能胜任且经培训调岗仍不能胜任，并有何材料？
      - 请提供7月终止通知、经济补偿流水、截至7月31日的考勤工资及离职交接材料。
    memo_expectations:
      - 先核实连续订立两次固定期限合同及劳动者提出续订的事实，判断是否进入无固定期限合同强制缔约条件。
      - 区分劳动者对合同类型的单方选择与用人单位一般续签决定，不能把公司意愿当作唯一标准。
      - 逐项核对过失性辞退、医疗期满不能工作和不能胜任等法定例外，不能用“自然到期”代替例外审查。
      - 将续订通知、劳动保护投诉、同日终止通知和多次续签请求排成证据时间线，但不在证据不足时武断推定报复动机。
      - 说明支付或收取终止经济补偿不当然使不符合法定条件的终止合法，并分析款项性质及后续处理。
      - 设计仲裁请求、劳动关系延续或其他救济方案及合同、通知、投诉、考勤和付款证据清单。
    editorial_review: *full_review
    editorial_note: 咨询固定在合同届满、仲裁申请前；客户知道合同和通知等亲历事实，但不知道后续仲裁及法院结果。认知差异集中在合同类型选择、法定例外和补偿付款效力，不把投诉与终止的时间邻近直接写成已证明的报复。

  - id: lsg_cn_0015
    source_line: 139
    source_case_sha256: 9d6201d3c912672bc7790a00caca536c7f631b3dac53dd403bf0b0142b8a3749
    split: train
    legal_domain: labor_employment
    client_role: 被原公司起诉要求支付竞业限制违约金的离职推拿师李某
    consultation_stage: 原公司不服仲裁结果提起诉讼后、法院实体审理前
    opening: 原公司说我离职后去了别的单位，违反了以前签过的保密和竞业约定，现在起诉要求我支付违约金。我原来主要做推拿，想核清自己接触的信息是否真的让我成为竞业限制人员。
    admission_reason: 普通服务岗位、保密协议、客户资料、公开报价、培训课件、行业技能和新岗位均有来源，可逐项区分一般经营信息与竞业限制所保护的核心保密事项。
    facts:
      - client_belief: 我在2017年1月10日入职原公司，主要从事推拿师工作。
        court_record: 李某于2017年1月10日入职某公司从事推拿师工作，不属于该公司的高级管理人员或高级技术人员。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2017年1月10日，李某入职某公司从事推拿师工作"}
          - {section: adjudication, quote: "李某系某公司的推拿师及培训师，不属于公司的高级管理人员及高级技术人员"}
      - client_belief: 入职时双方签过员工保密协议，写明离职后两年不能从事同类产品或同类企业的相关服务，违反要支付至少5万元。
        court_record: 李某与某公司订立员工保密协议，约定离职后两年内不得从事同类产品或同类企业的相关服务，否则一次性支付不低于50000元的违约金。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "双方签订员工保密协议，约定李某离职后两年内不得从事同类产品或同类企业的相关服务，否则应当一次性向某公司支付不低于50000元的违约金"}
      - client_belief: 我在2017年11月取得高级小儿推拿职业培训师证书，后来也做过培训工作。
        court_record: 李某于2017年11月取得高级小儿推拿职业培训师证书，并在某公司担任推拿师及培训师。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2017年11月，李某取得高级小儿推拿职业培训师证书"}
          - {section: adjudication, quote: "李某系某公司的推拿师及培训师"}
      - client_belief: 我在2021年5月离职，7月进入某社区卫生服务中心的中药房工作。
        court_record: 李某于2021年5月离开某公司，并于同年7月入职某社区卫生服务中心中药房。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2021年5月，李某从该公司离职，7月入职某社区卫生服务中心中药房工作"}
      - client_belief: 既然我亲自签过带有两年期限和5万元违约金的协议，只要去了另一家单位，就当然要承担竞业限制责任。
        court_record: 签署竞业限制文字不能替代适格主体审查；正常履职期间仅接触一般经营信息的普通推拿师及培训师，不当然属于负有保密义务的竞业限制人员。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在正常履职期间仅接触用人单位一般经营信息的劳动者不属于劳动合同法第二十四条第一款规定的其他负有保密义务的人员"}
      - client_belief: 我服务客户时会知道客户姓名和联系方式，原公司说掌握这些资料就足以证明我负有竞业限制义务。
        court_record: 李某掌握的客户名称、联系方式等，是提供推拿服务过程中必然接触到的基本信息，仅能证明其接触一般经营信息，不能据此认定其掌握核心经营信息。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "李某掌握的客户资料是提供服务过程中必然接触到的基本信息，例如客户名称、联系方式等"}
          - {section: adjudication, quote: "某公司提供的证据仅能证明李某在日常工作中接触到该公司的一般经营信息，而非核心经营信息"}
      - client_belief: 我接触过公司的产品报价，原公司把报价也作为保密信息；但这些报价本来就会向服务客户展示，潜在客户咨询也能获得。
        court_record: 李某接触的产品报价方案向服务客户公开，潜在客户经咨询即可获得，不属于仅凭接触即可使李某承担竞业限制义务的核心经营信息。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "李某接触到的产品报价方案对服务的客户公开，潜在的客户经过咨询即可获得"}
      - client_belief: 公司自制过培训课件，我也从工作培训中学到按摩推拿知识和技能，所以这些内容可能全部属于公司的专有秘密。
        court_record: 某公司自制课件中的知识多为中医小儿推拿行业常识，李某经培训获得的按摩推拿知识和技能也是行业通用专业知识与技能，不能整体作为核心保密事项限制其择业。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "课件内的知识多为行业内中医小儿推拿的常识性内容"}
          - {section: adjudication, quote: "按摩推拿知识及技能也是该行业通用的专业知识及技能"}
    expected_inquiries:
      - 请提供劳动合同、员工保密协议和原公司的诉讼材料，核对两年限制及5万元违约金的完整文字。
      - 你作为推拿师和培训师的日常职责、管理权限、技术决策权限分别是什么，是否担任过高管或高级技术岗位？
      - 你接触的客户资料是否主要是服务中必然知悉的姓名、联系方式等基本信息，原公司还指控了哪些更核心的信息？
      - 产品报价是否向接受服务的客户公开，普通潜在客户能否通过咨询获得？
      - 公司课件主要包含哪些内容，你通过培训取得的知识和技能中哪些属于小儿推拿行业常识和通用职业技能？
      - 你在2021年何时离开原公司、何时进入社区卫生服务中心，入职的具体部门是否为中药房？
    memo_expectations:
      - 先按高级管理人员、高级技术人员和其他负有保密义务人员审查竞业限制适格主体，不能以签字直接替代主体判断。
      - 根据客户资料的字段、取得方式和保密措施，区分服务过程中必然接触的基本信息与受保护的核心经营信息。
      - 审查产品报价是否已向现实或潜在客户公开，不能把公开可得信息笼统包装成商业秘密。
      - 区分公司自制课件的具体表达与行业常识、劳动者通用职业知识技能，避免以竞业限制垄断一般技能。
      - 在主体和保密事项审查之后，再比较新旧岗位与业务是否具体竞争，并分别评价违约金请求的合同与证据基础。
      - 围绕岗位权限、信息秘密性、保密措施、公开渠道和新岗位职责形成答辩与举证清单。
    editorial_review: *full_review
    editorial_note: 客户承认协议、职业证书和离职后新工作，不否认亲历事实；差异落在普通服务人员是否适格，以及客户信息、公开报价、课件和通用技能能否逐项达到核心保密事项标准，不泄露法院裁判结果。

  - id: lsg_cn_0016
    source_line: 20
    source_case_sha256: 4bc986384bd6fa0865edec45cbea000927f06c0b7109ee65b08c92152af21c2c
    split: train
    legal_domain: labor_employment
    client_role: 与公司约定以补助替代社保、拟解除劳动合同的保安朱某
    consultation_stage: 公司持续未参保后、劳动者通知解除并申请仲裁前
    opening: 我在保安公司工作期间与公司发生社会保险安排争议，公司称我已签字同意改领补助。我准备解除劳动关系，想判断约定效力和经济补偿问题。
    admission_reason: 不参保约定、格式条款、实际未缴费和劳动者解除目标明确，形成法定义务不可处分的真实咨询。
    facts:
      - client_belief: 我在2022年7月入职保安公司，双方约定不缴社保而将相关费用作为补助发放。
        court_record: 朱某于2022年7月入职某保安公司，双方约定公司不为朱某缴纳社会保险费，而将相关费用以补助形式直接发放给朱某。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2022年7月，朱某入职某保安公司"}
          - {section: basic_facts, quote: "双方约定某保安公司不为朱某缴纳社会保险费，而是将相关费用以补助形式直接发放给朱某"}
      - client_belief: 我本人在约定上签了字并领取补助，可能就已经有效放弃了要求公司参保的权利。
        court_record: 缴纳社会保险费是双方的法定义务，除法定事由外不因双方约定而免除，该约定无效。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "缴纳社会保险费是用人单位和劳动者的法定义务，除法律规定的事由外，不因双方约定而免除"}
          - {section: adjudication, quote: "双方有关不缴纳社会保险费的约定无效"}
      - client_belief: 这份不缴社保约定是公司事先打印好的，并不是我主动起草提出的条件。
        court_record: 朱某主张不缴纳社会保险费的约定由某保安公司预先打印，属于剥夺劳动者法定社会保险权利的格式条款。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "有关不缴纳社会保险费的约定是某保安公司事先打印好的格式条款"}
      - client_belief: 公司入职后确实没有为我缴纳社会保险费。
        court_record: 某保安公司此后未为朱某缴纳社会保险费。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "此后，某保安公司未为朱某缴纳社会保险费"}
      - client_belief: 因为我曾同意拿补助，哪怕不参保约定无效，我也可能不能以未缴社保为由解除并要求经济补偿。
        court_record: 某保安公司未依法为朱某缴纳社会保险费，朱某据此解除劳动合同符合用人单位应支付经济补偿的法定情形。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "朱某以此为由解除劳动合同，符合用人单位应当支付经济补偿的法定情形"}
