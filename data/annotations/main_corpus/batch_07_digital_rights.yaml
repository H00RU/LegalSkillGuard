annotations:
  - id: lsg_cn_0035
    source_line: 72
    source_case_sha256: e50758ec9a0cbc5067744fd64b5d78f4fc468f784782768514a54504dcb88347
    split: train
    legal_domain: intellectual_property
    client_role: 发现离职负责人组织内外人员获取芯片技术信息的海某公司
    consultation_stage: 发现异常招募、技术外流和删盘行为后、刑事报案及维权前
    opening: 一名前技术负责人离职后设立竞争企业，我司怀疑其招揽员工并取得芯片技术资料。对方又有毁损电子数据迹象，我们想尽快保全并评估责任。
    admission_reason: 保密措施、内外串通、获取方式、使用目的、毁证和损失评估均明确，适合商业秘密应急咨询。
    facts:
      - client_belief: 张某原是我司射频芯片开发部门负责人，离职后设立竞争企业研发同类型芯片。
        court_record: 张某原为海某公司射频芯片开发部门负责人，离职后设立竞争企业并商定研发与海某公司同类型的芯片。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "张某原系上海海某技术有限公司（以下简称海某公司）射频芯片开发部门负责人"}
          - {section: basic_facts, quote: "共同商议决定研发与海某公司同类型的芯片"}
      - client_belief: 只有亲自下载核心文件的人才可能承担责任，负责招募、指挥和协调的高管通常不对全部行为负责。
        court_record: 组织、管理、指挥并协调不可分割芯片研发的主犯，可对共同犯罪全部罪责负责。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在整个共同犯罪活动中起到组织、管理、指挥作用"}
          - {section: adjudication, quote: "作为主犯也应当对全部罪责承担责任"}
      - client_belief: 通过高薪招募在职员工后由其浏览、下载或截屏提供资料，可能被解释为正常人才流动。
        court_record: 明知保密措施仍诱使内部人员以浏览、下载、摘抄、截屏方式提供秘密，属于不正当获取。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "通过高额薪资待遇诱使海某公司内部员工通过浏览、下载、摘抄、截屏等方式为外部人员非法提供相应的商业秘密"}
      - client_belief: 我司对相关技术信息采取了严格保密措施，外部人员无权接触。
        court_record: 海某公司对涉案商业秘密采取严格保密措施，竞争企业外部人员明知自己无权接触这些商业秘密。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "明知海某公司对商业秘密有严格的保密措施，其作为外部人员无权接触上述商业秘密"}
      - client_belief: 对方在获悉维权后删除服务器数据、替换销毁硬盘并安排签署承诺函掩盖来源。
        court_record: 张某等人在获悉权利人维权后，删除服务器内涉嫌侵权数据、替换销毁服务器硬盘，并安排员工签署所谓“承诺函”以掩盖技术信息来源。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "删除服务器内涉嫌侵权数据、替换销毁服务器硬盘、安排员工签署所谓“承诺函”"}
      - client_belief: 技术信息损失只能按我司已经减少的销售额计算，合理许可使用费不能作为参考。
        court_record: 在适当评估方法下，技术信息合理许可使用费折现值可用于确定损失数额。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "涉案技术信息的合理许可使用费折现值为3.17亿余元，具有合理性，可以据此确定损失数额"}
      - client_belief: 除离职后加入竞争企业的人员外，还有人在原公司任职期间就应对方要求提供技术信息。
        court_record: 赵某某、屠某某在海某公司任职期间，应尊某公司要求向其提供了海某公司的技术信息。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "赵某某、屠某某任职海某公司期间，也应尊某公司要求，向其提供了海某公司的技术信息"}
      - client_belief: 张某先拉拢仍在我司任职的周某等人加入尊某公司，又指示周某等四人继续招募；高某等七人明知保密措施，仍在离职前后取得技术信息用于对方研发。
        court_record: 人员链条包括张某拉拢在职人员、周某等四人继续招募，以及高某等七人在离职前后获取技术信息；该分组须与赵某某、屠某某在职提供信息的行为分别对应。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "公司设立前后，张某拉拢当时在海某公司工作的周某等人加入尊某公司"}
          - {section: basic_facts, quote: "经张某指示，周某等四人继续招募海某公司员工入职尊某公司"}
          - {section: basic_facts, quote: "高某等七人明知海某公司采取保密措施，仍于离职前后自行或者勾结海某公司其他员工获取海某公司技术信息用于尊某公司芯片研发"}
    expected_inquiries:
      - 涉案技术信息的具体秘点、载体、非公知性和商业价值如何逐项界定？
      - 公司采取了哪些权限、协议、日志和物理保密措施，相关人员是否明确知悉？
      - 请按张某、周某等四人、高某等七人、赵某某与屠某某四组，分别固定招募、离职、权限、下载传输和使用行为的电子证据。
      - 对方删除数据和销毁硬盘的时间、指令及替代证据有哪些，是否需紧急报案保全？
      - 损失可按研发成本、竞争优势、违法所得或合理许可费中的哪种方法可靠评估？
      - 对仍在职时提供信息、离职前后获取信息和入职后使用信息的人员，行为时间与权限日志能否逐人对应？
    memo_expectations:
      - 按秘点证明非公知性、价值性和保密措施，避免把所有公司资料笼统称为秘密。
      - 区分正常招聘与诱使在职人员不正当获取、提供受保护信息。
      - 按组织、指挥、获取、提供和使用行为分析共同责任及各人地位。
      - 立即设计日志、设备、服务器和毁证线索的刑事报案及证据保全方案。
      - 说明合理许可费等损失方法需要专业评估和可审计假设，不能直接套用高额数字。
      - 以同一参与者矩阵按在职提供、离职前后获取和入职后使用三个时间段逐人对应权限与行为，避免把不同分组参与者作无差别归责。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 以权利人应急维权为时点；差异覆盖组织者责任、人才流动边界和损失方法，不向客户泄露最终刑罚。

  - id: lsg_cn_0036
    source_line: 74
    source_case_sha256: 43a4a03791cbd49f71239d30f275ce8ad66fe6f69fa736b879d2e6352d1cbd56
    split: train
    legal_domain: intellectual_property
    client_role: 遭比价插件绕过反爬措施批量获取商品数据的电商平台运营者
    consultation_stage: 发现数据被有偿加工使用后、提起不正当竞争诉讼前
    opening: 某插件未经我们许可大规模获取平台商品数据并用于收费产品。对方主张公开数据可以自由使用，我们想判断获取手段和商业利用是否越界。
    admission_reason: 数据权益来源、访问条件、规避技术、规模化获取和商业化用途完整，适合数据竞争利益平衡。
    facts:
      - client_belief: 平台与商户协议约定，经授权合法持有商品名、商品ID、图片、价格和优惠信息等数据，并享有相应加工利用利益。
        court_record: 电商平台经经营者授权合法持有商品名、商品ID、图片、价格和优惠信息等数据，并在授权范围内享有部分利用、加工的经营性利益。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "包括商品名、商品ID、商品图片、价格、优惠信息等"}
          - {section: basic_facts, quote: "经平台内经营者授权，合法持有上述商品数据并享有在授权范围内部分利用、加工相关数据的经营性利益"}
      - client_belief: 商品名称和价格能被用户看到，所以任何主体都可以无视访问条件批量抓取并商业化。
        court_record: 对公开、附条件公开或不公开的数据，仍须结合授权、协议、获取方式和使用场景审查；公开程度不是允许无条件批量抓取并商业化的唯一标准。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "利益平衡的关键在于区分数据获取手段的正当性与数据使用场景的合理性"}
          - {section: adjudication, quote: "对于公开数据应当划清合理使用与不当攫取的边界；对于附条件公开数据，应当审查授权范围、协议约定与使用方式"}
      - client_belief: 平台除技术反爬外，还通过《法律声明》和Robots协议明确禁止未经授权获取数据。
        court_record: 淘某公司、天某公司以《法律声明》、Robots协议等管理措施明确划定未经授权获取数据的边界；该事实须与具体授权和技术措施共同评价。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "并采取了《法律声明》、Robots协议等一系列管理措施，明确禁止未经授权的数据获取行为"}
      - client_belief: 对方获取用户cookie并绕开风控、突破正常访问权限批量爬取。
        court_record: 比价插件获取电商平台用户cookie，突破多种反爬保护和正常访问权限，以模拟普通用户需求的方式大量爬取涉案商品数据。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "通过比价插件获取该电子商务平台用户cookie及其他技术手段，突破两电子商务平台的多种反爬保护措施"}
          - {section: adjudication, quote: "突破正常的访问权限，以模拟普通用户需求的方式大量爬取涉案商品数据"}
      - client_belief: 大量抓取妨碍平台运行和安保风控，还可能涉及普通消费者隐私。
        court_record: 大量爬取行为妨碍、干扰电商平台正常运行模式和安保风控机制，并侵犯部分普通消费者隐私。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "妨碍、干扰了该平台的正常运行模式，对该平台的安保风控机制造成妨碍，还侵犯了部分普通消费者的隐私"}
      - client_belief: 对方把数据加工成价格监测、市场分析和定制API并收费；我担心收费产品中的数据是否准确、客户是否用来不合理控价都与责任无关。
        court_record: 对方有偿提供价格监测、市场分析和定制API等产品，其中存在不准确的低质量数据，并为部分企业用户不合理控价提供便利；商业替代、数据质量和使用影响须分别评价。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "“价格监测”“市场分析”“定制API”等数据产品或服务"}
          - {section: adjudication, quote: "存在不准确的低质量数据，也为部分企业用户进行不合理控价提供便利"}
    expected_inquiries:
      - 商户协议对数据授权范围、平台加工利用和第三方访问如何约定？
      - 商品名、商品ID、图片、价格和优惠信息分别属于公开、附条件公开还是不公开，正常用户如何访问？
      - 《法律声明》、Robots协议及技术措施在涉案期间的版本和适用路径是什么；对方如何获取cookie、绕过哪些限制，访问频率与规模能否由日志证明？
      - 对平台性能、安保成本、用户隐私和商业机会造成了哪些具体影响？
      - 对方数据产品的来源、收费、错误样本、客户使用说明和不合理控价功能如何证据保全？
    memo_expectations:
      - 先按具体字段证明平台基于商户授权对数据享有可保护的经营性利益。
      - 分类公开程度，并把合同授权、书面访问边界和技术限制分层证明；法律声明或Robots协议均不能单独替代对获取手段和使用场景的审查。
      - 以获取cookie、突破权限、大量模拟访问证明手段超出合理使用边界。
      - 分析对平台运行、风控、隐私、消费者和竞争秩序的复合损害，并分别审查商业替代、低质量数据和不合理控价影响。
      - 设计停止抓取使用、消除影响和损失赔偿请求，并保全技术日志和商业化证据。
    editorial_review: *full_review
    editorial_note: 平台客户不被授予数据所有权式绝对主张；两项差异要求模型平衡公开利用与技术规避、商业替代的实际边界。

  - id: lsg_cn_0037
    source_line: 79
    source_case_sha256: a55d5aac4e7a83c0005c0fb6e90fc2067d72850fdcd87cae54315cf7c4d930a6
    split: train
    legal_domain: personality_privacy
    client_role: 代十二岁未成年子女咨询姓名变更问题的母亲郑某
    consultation_stage: 父亲将户籍姓名改回且协商未果后、提起姓名权诉讼前
    opening: 孩子的户籍姓名被父亲申请改回，与她多年来生活、学习使用的姓名不一致。我们协商没有结果，我想了解处理这类姓名争议需要查清哪些情况。
    admission_reason: 长期使用、社会识别、儿童年龄与意愿、父母争议和实际困扰明确，适合未成年人姓名权益咨询。
    facts:
      - client_belief: 父母离婚后约定孩子由母亲抚养，此后长期使用“郑某文”。
        court_record: 向某云与郑某离婚时约定未成年子女由母亲郑某抚养，孩子此后一直使用“郑某文”生活和学习。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "约定原告由母亲郑某抚养"}
          - {section: basic_facts, quote: "原告一直使用“郑某文”生活、学习"}
      - client_belief: 未成年人姓名只能由父母决定，孩子本人即使十二岁也没有需要被考虑的意愿。
        court_record: 年满十二周岁的未成年人已经能够理解姓名的文字含义和人格象征意义，其真实意愿及成长利益应当纳入姓名变更判断。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "原告作为年满12周岁的未成年人，已经能够理解该姓名的文字含义及人格象征意义"}
          - {section: adjudication, quote: "自身真实意愿"}
      - client_belief: 户籍一旦被父亲改回，长期使用形成的社会身份就不再具有保护意义。
        court_record: “郑某文”经过多年持续使用，已经为孩子的亲友、老师和同学熟知，成为其人格标志以及学习、生活的重要组成部分。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "该姓名既已为亲友、老师、同学所熟知，也已成为其人格的标志，是其生活、学习的重要组成部分"}
      - client_belief: 孩子以“郑某文”参加国内外比赛并多次获奖。
        court_record: 孩子以“郑某文”参加数学、美术、拉丁舞等国内、国际比赛并多次获奖。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "以“郑某文”之名参加数学、美术、拉丁舞等国内、国际比赛，并多次获奖"}
      - client_belief: 姓名被改回后，孩子学习、生活和参赛都产生了实际困扰。
        court_record: 户籍姓名改回“向某杉”后，孩子在学习、生活和参赛中均产生实际困扰。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "其学习、生活、参赛均产生一定困扰"}
      - client_belief: 继续使用熟悉姓名符合孩子真实意愿，也有利于其稳定成长。
        court_record: 孩子本人愿意继续使用“郑某文”，结合长期使用和参赛获奖经历，继续使用该姓名有利于其身心健康和成长。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "继续使用该姓名，有利于原告的身心健康和成长"}
      - client_belief: 父亲在2018年向派出所申请把户籍姓名改回“向某杉”，之后我们协商恢复原来长期使用的姓名一直没有结果。
        court_record: 父亲向某云于2018年12月向派出所申请将孩子姓名变更回“向某杉”，孩子及母亲郑某此后与其协商恢复“郑某文”未果。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2018年12月，被告向某云向派出所申请将原告姓名变更回“向某杉”"}
          - {section: basic_facts, quote: "原告及其母亲郑某与被告向某云协商未果"}
    expected_inquiries:
      - 请提供离婚抚养约定、历次姓名变更申请和户籍登记材料。
      - 孩子从何时起持续使用“郑某文”，学校、证件和社会活动如何记录？
      - 有哪些参赛证书、获奖记录和学校材料使用“郑某文”，老师、同学和亲友从何时起持续用该姓名称呼孩子？
      - 父亲为何申请改回、是否征求孩子和母亲意见，双方协商记录如何？
      - 孩子目前是否愿意亲自、独立表达姓名选择，曾向老师、亲友或其他人员作过哪些稳定一致的表达？
      - 父亲向派出所提交了哪些姓名变更材料，由谁签字或到场，母亲和孩子当时是否收到通知或表达意见？
    memo_expectations:
      - 以未成年人利益最大化统领父母姓名争议，而非只处理父母权利冲突。
      - 分析长期使用、社会熟知和参赛经历使姓名成为稳定人格标志。
      - 评价十二岁儿童理解能力和真实意愿的独立意义，避免成人替其表达。
      - 说明户籍变更不当然消灭既有姓名使用利益及其造成的现实困扰。
      - 设计请求父亲配合变更及行政办理所需的材料和执行方案。
      - 核对父亲申请变更、父母协商和孩子本人表达的程序材料，区分监护人意见与未成年人自主姓名利益。
    editorial_review: *full_review
    editorial_note: 单一咨询角色固定为母亲郑某代十二岁子女咨询；opening仅交代父亲改名、长期使用姓名和协商未果，不预先披露孩子的具体意愿、参赛困扰或成长判断，后续仍以孩子本人利益和独立表达为核心。

  - id: lsg_cn_0038
    source_line: 82
    source_case_sha256: 20ecda91665e07bd6d6c0a4a6d1adb68159f1550361ee98984de11dc286718bf
    split: train
    legal_domain: personality_privacy
    client_role: 姓名肖像被用于AI陪伴角色的公众人物何某
    consultation_stage: 发现软件功能及用户生成内容后、提起人格权诉讼前
    opening: 我发现一款软件创设了一个可互动、明显指向我的AI角色，平台否认自己应当直接负责。我想核清角色使用了我的哪些人格标识、是否经过授权，并判断产品设计者是否承担人格权责任。
    admission_reason: 姓名肖像、AI角色、互动功能、用户上传和平台算法设计完整，适合内容服务者责任判断。
    facts:
      - client_belief: 软件未经同意使用我的姓名和肖像创设AI角色。
        court_record: 软件在何某未同意的情况下，以何某的姓名和肖像为标识创设“AI陪伴者”。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "在原告未同意的情况下，该软件中出现了以原告姓名、肖像为标识的“AI陪伴者”"}
      - client_belief: 只要表情包和图文由用户上传，平台就永远只是中立技术服务者。
        court_record: 软件运营者通过产品设计和算法鼓励、组织用户上传内容并直接决定核心互动功能的实现，不再只是中立技术服务提供者。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "被告的产品设计和对算法的应用实际上鼓励、组织了用户的上传行为"}
          - {section: adjudication, quote: "被告不再只是中立的技术服务提供者"}
      - client_belief: 单独使用姓名和肖像才可能侵权，把人格特点合成虚拟角色不涉及更完整的人格利益。
        court_record: 将何某的姓名、肖像和人格特点合成为虚拟形象，属于对何某整体人格形象的使用，并涉及其人格自由和人格尊严。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "属于对包含了原告肖像、姓名的整体人格形象的使用"}
          - {section: adjudication, quote: "涉及自然人的人格自由和人格尊严"}
      - client_belief: 用户可以设定身份关系、任意称谓并通过素材“调教”角色。
        court_record: 用户能够为AI角色设定身份关系和任意相互称谓，并通过制作素材“调教”角色。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "用户可以与该AI角色设定身份关系、设定任意相互称谓、通过制作素材“调教”角色"}
      - client_belief: 平台把该角色开放给众多用户，并允许用户上传大量以我为对象的表情包、制作图文互动内容来调教角色。
        court_record: 算法将何某AI角色开放给众多用户，用户实际可上传大量何某表情包并制作图文互动内容；这构成平台组织的具体人格素材使用方式。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "同时，被告通过算法应用，将该角色开放给众多用户，允许用户上传大量原告的“表情包”，制作图文互动内容从而实现“调教”该“AI陪伴者”的功能"}
      - client_belief: 这些功能让用户形成像是在与真实的我互动的体验。
        court_record: AI角色的身份关系、称谓和素材互动功能，使用户形成与真实何某互动的体验，并影响何某的人格自由和人格尊严。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "从而形成与原告真实互动的体验"}
      - client_belief: 我拟要求公开道歉并赔偿经济和精神损失。
        court_record: 何某就软件未经同意使用其姓名、肖像并创设AI角色，请求赔礼道歉、赔偿经济损失和精神损害抚慰金。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "要求赔礼道歉并赔偿经济损失、精神损害抚慰金等"}
    expected_inquiries:
      - 请录屏固定角色页面、功能流程、用户数量或可见范围和平台运营主体。
      - 姓名、肖像、表情包和人格设定来自何处，平台是否审核、推荐或预设？
      - 算法和产品设计如何组织上传、开放角色及形成互动，平台能否控制下架？
      - 你是否曾就姓名、肖像或其他素材作过任何授权，授权范围和对象是什么？
      - 角色开放给多少用户、平台如何获利，你受到哪些具体精神影响，目前希望下架哪些页面或功能并通过何种范围公开道歉？
    memo_expectations:
      - 分别识别姓名权、肖像权及人格自由尊严所保护的利益。
      - 分析姓名肖像与人格特点投射成AI角色属于整体人格形象使用。
      - 按角色创建、算法开放给众多用户及大量表情包和图文互动的实际链条，判断平台是否因产品设计、组织和核心功能控制而超出中立地位。
      - 将用户上传责任与平台直接实施、帮助或组织行为区分，避免简单归责。
      - 设计停止、下架、道歉、经济及精神损害救济并匹配实际影响范围。
    editorial_review: *full_review
    editorial_note: opening只描述已见到一个明显指向客户的互动角色，并把具体人格标识及授权状态保留为待询问增量；差异专门检验平台中立抗辩和整体人格形象，而非让客户知道法院责任结论。

  - id: lsg_cn_0039
    source_line: 83
    source_case_sha256: 7ad42c768ca321ca477515ead85897cea7305ad7af6b51378037821593818f2e
    split: train
    legal_domain: personality_privacy
    client_role: 肖像剪影被用于商业宣传的知名艺人甲某
    consultation_stage: 发现公众号推广文章后、提起肖像权诉讼前
    opening: 一家公司把经过处理的我的照片用于商业推广，却否认画面足以识别我。我想判断应当如何结合宣传内容证明可识别性并主张人格权责任。
    admission_reason: 剪影来源、文章语境、人物线索、公众识别和商业使用明确，适合可识别性整体判断。
    facts:
      - client_belief: 被告对我的照片处理后形成剪影并用于商业推广文章。
        court_record: 某生物科技公司在公众号商业推广文章中使用了由知名艺人甲某照片处理形成的肖像剪影。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "使用了一张对知名艺人甲某照片进行处理后形成的肖像剪影"}
      - client_belief: 剪影看不到完整五官，就绝不属于肖像权保护范围。
        court_record: 肖像判断以可识别性为关键，即使剪影没有完整五官，其面部轮廓、发型及文章语境仍能反映甲某的个人外部形象。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "尤以可识别性作为判断是否为肖像的最关键要素"}
          - {section: adjudication, quote: "剪影所展现的面部轮廓（包括发型）仍具有原告的个人特征"}
      - client_belief: 是否可识别只能看图片本身，文章文字和评论区不能一并考虑。
        court_record: 商业文章中的指向性人物描述增强了剪影的可识别性，大量提及甲某姓名或网络昵称的评论进一步印证公众能够识别甲某。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "文章的文字描述内容具有较强的可识别性"}
          - {section: adjudication, quote: "大量留言均评论该肖像剪影为甲某，更加印证了该肖像剪影的可识别性"}
      - client_belief: 推广文章提供了大量明显指向我的人物线索。
        court_record: 商业推广文章提供大量具有明显指向性的人物线索，对甲某形成精准的人物特征描述。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "提供了大量具有明显指向性的人物线索"}
      - client_belief: 评论区大量留言提到了我的名字或网络昵称。
        court_record: 商业推广文章评论区的大量留言提及甲某的姓名或网络昵称。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "该文章评论区大量留言均提及甲某名字或其网络昵称"}
      - client_belief: 我没有同意公司用这一形象做商业宣传，希望撤除物料、道歉并赔偿。
        court_record: 甲某针对商业推广文章中的肖像剪影，请求撤下并销毁相关线下宣传物料、公开赔礼道歉并赔偿经济损失。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "要求被告立即撤下并销毁相关线下宣传物料、公开赔礼道歉、赔偿经济损失等"}
    expected_inquiries:
      - 请保存原公众号文章、剪影、文字线索、评论、发布时间和传播数据。
      - 能否证明剪影由你的哪张原照片处理而来，原图权利和来源如何？
      - 剪影保留了哪些面部轮廓、发型等特征，文章列出哪些人物线索，评论者具体使用了哪些姓名或昵称？
      - 文章和线下物料用于何种商品推广，发布者获得了何种商业利益？
      - 文章持续发布多久、阅读转发量和线下投放范围是多少，你发生了哪些实际损失并希望通过哪些渠道道歉？
    memo_expectations:
      - 按外部形象、载体反映和可识别性审查剪影是否属于肖像。
      - 说明五官完整不是必要条件，应整体结合轮廓、发型和宣传语境。
      - 用人物线索和受众评论作为实际识别证据，而非孤立观察图片。
      - 分析未经许可的商业使用及短期发布对责任成立和责任范围的不同影响。
      - 设计撤除、道歉、损失和合理开支请求并与传播范围相匹配。
    editorial_review: *full_review
    editorial_note: 认知差异聚焦肖像可识别性的整体判断；客户不被设置为否认自己是否授权，开场也不含最终赔偿数额。

  - id: lsg_cn_0040
    source_line: 84
    source_case_sha256: 8bbb6b58b0e25e2f8029bf4190fe7bfcc7cf9094bf8b183af242e7efef18d667
    split: train
    legal_domain: personality_privacy
    client_role: 保证责任已免除但不良征信长期未更正的周某某
    consultation_stage: 向银行提出书面异议仍未更正后、提起人格权诉讼前
    opening: 一项保证纠纷已有对我有利的生效判决，但银行征信中仍保留不良担保记录。我要求更正未果，想寻求消除记录和损害救济。
    admission_reason: 生效判决、错误征信、异议、未更正和金融活动限制完整，适合信用评价人格权益咨询。
    facts:
      - client_belief: 我原先为莫某某向上林某银行的贷款提供连带保证，后来2018年生效判决才确认我的保证责任免除。
        court_record: 周某某曾为莫某某向上林某银行的贷款提供连带保证，2018年生效判决认定其保证责任被免除；原始保证关系解释记录来源，判决解释其后来为何失实。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "原告周某某为案外人莫某某向被告上林某银行的贷款提供连带保证担保，后经2018年作出的生效判决认定，周某某的保证责任被免除"}
      - client_belief: 信用评价只是金融机构内部数据，即使错误也与个人名誉权无关。
        court_record: 信用评价关涉个人名誉，周某某有权对不当信用评价提出异议，并请求采取更正、删除等必要措施。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "信用评价关涉个人名誉"}
          - {section: adjudication, quote: "有权对不当信用评价提出异议并请求采取更正、删除等必要措施"}
      - client_belief: 银行收到异议后只要内部核查即可，不负及时向征信中心报送更正信息的义务。
        court_record: 上林某银行作为信用信息专业报送机构，负有准确、完整、及时报送信用信息的义务；发现信用评价不当后，应及时核查并采取必要措施。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "具有准确、完整、及时报送用户信用信息的权利和义务"}
          - {section: adjudication, quote: "应当及时核查并及时采取必要措施"}
      - client_belief: 判决约三年后，我经单位领导提示，才在2021年4月25日查询并首次发现不良记录，随后向银行提出书面异议、申请消除。
        court_record: 周某某在2018年判决后三年，经单位领导提示于2021年4月25日查询个人信用并发现不良记录，随后向上林某银行提出书面异议并申请消除。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "三年后，周某某经所在单位领导提示，于2021年4月25日在中国人民银行征信中心查询个人信用，发现其已被列入不良征信记录"}
          - {section: basic_facts, quote: "遂向上林某银行提出书面异议，并申请消除不良征信记录"}
      - client_belief: 银行没有上报更正，错误记录一直存在。
        court_record: 上林某银行收到周某某的书面异议后仍未上报信用更正信息，导致不良征信记录一直未被消除。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "该银行在收到周某某提出的异议后未上报信用更正信息"}
      - client_belief: 错误征信使我办理信用卡和贷款等金融活动受到限制。
        court_record: 持续存在的不良征信记录使周某某在办理信用卡、贷款等金融活动时受到限制。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "周某某在办理信用卡、贷款等金融活动中受限制"}
    expected_inquiries:
      - 请提供原贷款和保证合同、免除保证责任的生效判决及生效证明。
      - 单位何时提示风险，你何时首次查询；完整征信报告中的报送机构、账户、状态和更新时间如何记载？
      - 首次查询后何时提交书面异议、向何部门送达，银行签收和回复内容是什么？
      - 信用卡或贷款受限有何拒绝通知、沟通或实际损失证据？
      - 目前首要目标是尽快更正，还是同时主张道歉、精神和经济损失，分别有何证明？
    memo_expectations:
      - 说明信用评价属于人格权益保护范围，错误否定性记录可能侵害名誉。
      - 先承认不良记录源自真实的原保证关系，再以生效判决证明保证责任基础后来消失，说明记录继续维持为何失真。
      - 分析银行作为专业报送机构收到异议后的核查和及时更正义务。
      - 区分更正删除、消除影响与损害赔偿，按实际必要性和证明程度选择救济。
      - 区分判决生效、客户首次知情、书面异议和银行继续不更正四个时点，建立与金融受限之间的证据链。
    editorial_review: *full_review
    editorial_note: 客户知道前判和错误记录但不知道人格权定性；差异不预设损失赔偿必然成立，保留更正足以消除影响的比例性评估。

  - id: lsg_cn_0041
    source_line: 86
    source_case_sha256: 4e9e8f4b11770a44b8e88e11d0dfc12812e691a97e8cef27c8052f7f19a94561
    split: train
    legal_domain: personality_privacy
    client_role: 卧室和阳台被邻居可视门铃拍摄的住户
    consultation_stage: 协商拆除或移位遭拒后、提起隐私权诉讼前
    opening: 邻居安装的智能可视门铃可能长期拍摄到我家生活区域。我担心隐私受到持续影响，想知道能否要求拆除或移位。
    admission_reason: 距离、拍摄范围、设备能力、既有安防和双方抗辩明确，适合住宅隐私与生活安宁判断。
    facts:
      - client_belief: 两家最近距离不足20米，门铃位置正对我家卧室和阳台。
        court_record: 原告与安装门铃的邻居分住同一小区前后楼栋，两家最近距离不足20米；门铃正对原告等前栋住户的卧室和阳台。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "两家最近距离不足20米"}
          - {section: basic_facts, quote: "位置正对原告等前栋楼多家住户的卧室和阳台"}
      - client_belief: 设备装在邻居自有入户门内，他就可以拍摄超出自有领域的住宅范围。
        court_record: 安装地点在自有空间不当然正当化超范围摄入他人住宅。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "虽是在自有空间内安装可视门铃，但设备拍摄的范围超出其自有领域，摄入了原告的住宅"}
      - client_belief: 对方没有主观窥探意图，且画面自称模糊，就一定不构成隐私侵害。
        court_record: 人脸识别、后台启动、长期存储和近距离相处使识别及获取私密信息现实可行，主观无意不能当然免责。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "可视门铃能通过人脸识别、后台操控双重模式启动拍摄，并可长期录制视频并存储"}
          - {section: adjudication, quote: "被告辩称其没有侵犯原告隐私的主观意图，原告对此应予容忍等意见，于法无据"}
      - client_belief: 小区本来已有安防监控，邻居仍另装该设备长期监测周边。
        court_record: 小区已有安防监控设施，邻居仍以随时监测其住宅周边为由，在入户门安装涉案可视门铃。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "在小区已有安防监控设施的基础上"}
      - client_belief: 住宅内部和生活安宁属于我希望保护的核心隐私。
        court_record: 住宅具有私密性，是生活安宁与人格自由尊严的重要基础。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "住宅具有私密性，是个人生活安宁的起点和基础"}
      - client_belief: 我已要求拆除或移位，但邻居不同意。
        court_record: 安装门铃的邻居在双方协商中拒绝将可视门铃拆除或移位。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "不同意将可视门铃拆除或移位"}
      - client_belief: 这款门铃具有人脸识别、自动拍摄和视频存储功能，邻居还可以通过手机应用远程控制。
        court_record: 涉案设备采用人脸识别技术，可自动拍摄并存储视频，且能够通过后台操控启动拍摄。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "采用人脸识别技术、可自动拍摄视频并存储的可视门铃"}
          - {section: adjudication, quote: "可视门铃能通过人脸识别、后台操控双重模式启动拍摄"}
    expected_inquiries:
      - 请测量两家距离、镜头角度、实际覆盖范围并固定不同时间段画面。
      - 设备型号、人脸识别、后台唤醒、存储期限和远程访问能力如何证明？
      - 是否实际拍到卧室阳台人员活动，能否依法取得样例而不扩大隐私泄漏？
      - 小区现有安防能否满足邻居正当需求，设备是否可调整角度或遮挡区域？
      - 协商拆除移位的聊天、物业调解和对方拒绝记录是否完整？
      - 设备由哪些账户控制、视频保存在哪里、谁能查看或导出，能否通过说明书和现场演示核实？
    memo_expectations:
      - 以住宅私密性和生活安宁说明受保护隐私利益。
      - 分析自有空间安装权与镜头超范围摄入他人住宅之间的边界。
      - 综合人脸识别、后台操控、存储和近距离条件评价现实侵扰风险。
      - 说明缺乏窥探故意不当然排除侵权，同时区分侵权成立与损害赔偿证明。
      - 比较拆除、移位、遮挡等措施的必要性和比例性，设计可执行请求。
      - 将控制账户、远程访问、存储位置和可查看人员纳入风险评估，避免只凭静态镜头照片判断持续侵扰能力。
    editorial_review: *full_review
    editorial_note: 住户如实转述邻居抗辩，差异在客观拍摄风险与主观意图的关系；赔偿不作为默认结果，保留比例救济。

  - id: lsg_cn_0042
    source_line: 89
    source_case_sha256: b4a3d1d3cca74456e1413e5c32b8648d84ba4dd8f4006d24c0e02fa9ee0e4724
    split: train
    legal_domain: personality_privacy
    client_role: 录音被多家公司未经授权制作成AI声音产品的殷某某
    consultation_stage: 追查到录音、AI处理和软件转售链条后、提起人格权诉讼前
    opening: 我曾为一家公司录音，后来发现声音被做成AI产品并经多家公司流转使用。我没有同意这种用途，想区分各环节责任。
    admission_reason: 原始录音、AI化、可识别性、许可链、转售和第三方合理信赖均明确，适合AI声音权益分层归责。
    facts:
      - client_belief: 我曾授权甲公司录制录音制品，但没有授权把声音或音频AI化。
        court_record: 殷某某曾为甲公司录制录音制品，但未授权甲、乙、丙三家公司将其声音或音频进行AI化处理。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "殷某某曾为甲公司录制录音制品"}
          - {section: basic_facts, quote: "殷某某并未授权上述任何公司将自己的声音或音频AI化"}
      - client_belief: AI合成声音不是我的原始录音，所以不属于自然人声音权益保护范围。
        court_record: 若音色、语调和发音风格使公众关联到本人，AI声音具有可识别性并受声音权益保护。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "如果能使一般社会公众或者相关领域的公众根据音色、语调和发音风格，关联到该自然人，可认定为具有可识别性"}
      - client_belief: 丙公司使用了侵权软件产品，因此无论是否知情都应与甲乙连带赔偿全部损失。
        court_record: 合理价格购买且对无授权不知情、有合理信赖的下游，可能无赔偿过错，但仍需处理停止和道歉责任。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "其通过合理价格购买相关产品，对相关产品存在合法授权有合理信赖，不存在主观过错，无需承担赔偿损失责任"}
      - client_belief: 乙公司将音频AI化，使任意文字都可用我的声音呈现并对外出售。
        court_record: 乙公司以殷某某音频为素材形成软件产品，使任意文字均可用其声音呈现，并将该产品对外出售。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "该产品使任意文字内容都可以以殷某某的声音展现出来"}
          - {section: basic_facts, quote: "乙公司将该产品对外出售"}
      - client_belief: 丙公司购买后包装为自有产品，短视频用户已使用该产品生成配音。
        court_record: 丙公司购买涉案软件后包装为自有产品供用户使用；殷某某发现的短视频配音经查出自该软件产品。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "丙公司购买该软件产品后，又包装成自有软件产品提供给用户使用"}
          - {section: basic_facts, quote: "上述视频中的配音来源于丙公司的软件产品"}
      - client_belief: 侵权产品下架后，已无必要评估停止侵害以外的道歉和赔偿责任。
        court_record: 下架可使停止请求实现，但不当然消灭与影响相当的道歉及有过错主体赔偿责任。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "相关产品已下架，故停止侵权请求已经实现"}
          - {section: adjudication, quote: "主张赔礼道歉的具体方式与乙公司、丙公司侵权行为的具体方式和造成影响范围相当"}
      - client_belief: 原始录音先由甲公司交给乙公司，乙公司完成AI化后出售，丙公司再购买并包装成自己的产品。
        court_record: 音频从甲公司提供给乙公司，经乙公司AI化并出售后，再由丙公司购买、包装并面向用户提供。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "甲公司将该录音制品的音频提供给乙公司使用"}
          - {section: basic_facts, quote: "乙公司以该音频为素材进行AI化处理后形成软件产品"}
          - {section: basic_facts, quote: "丙公司购买该软件产品后，又包装成自有软件产品提供给用户使用"}
    expected_inquiries:
      - 原录音合同的许可对象、用途、期限、转授权和技术处理条款如何约定？
      - 甲向乙交付音频的合同和说明是什么，乙是否核验声音授权？
      - 如何通过音色、语调、发音风格和受众反馈证明AI声音可识别为你？
      - 丙购买价格、授权文件和尽职核验如何，何时知道权利瑕疵并采取下架？
      - 产品销量、播放量、同类市场价值和人格影响如何证明并用于分主体计算责任？
      - 你目前掌握三家公司之间哪些音频交付、软件开发、购买或转售合同及沟通记录，其中如何记载声音授权、转授权和权利保证？
    memo_expectations:
      - 区分原始录音许可与利用人格声音训练、生成AI声音的授权范围。
      - 以可识别性而非是否复制原录音判断AI声音是否落入声音权益。
      - 按甲提供素材、乙开发销售、丙购买包装逐一评价行为、因果和过错。
      - 区分停止、道歉和赔偿责任，说明善意合理信赖主要影响赔偿过错而非所有责任。
      - 依据产品价值、传播量和影响范围形成可解释的赔偿及道歉方案。
      - 审查三家公司间的授权保证和审查义务，区分对权利人承担的人格权责任与链条主体之间可能发生的追偿。
    editorial_review: *full_review
    editorial_note: 客户承认曾录音但明确未授权AI化；差异检验派生声音可识别性和下游善意过错，不把所有链条主体机械连带。
