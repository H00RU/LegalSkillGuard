  - id: lsg_cn_0106
    source_line: 158
    source_case_sha256: 02549ac3c53614874e738b561fe4a8126437e763bf4961a58b5052e1a906525e
    split: train
    legal_domain: tort_liability
    client_role: 疫情检查时骑车摔伤的访客黄某
    consultation_stage: 受伤治疗后、向物业索赔前
    opening: 我去小区探望祖母，骑车进门时保安追赶并伸手接触我背部，随后我摔倒受伤。我认为物业行为导致损害，想评估其是否应赔偿。
    admission_reason: 防疫通知、亮码登记要求、呼喊、加速、追赶和接触完整，可评价管理行为正当性及受害人自身原因。
    facts:
      - {client_belief: "我从上海到该小区探望祖母。", court_record: "黄某由上海来到该小区探望祖母。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "黄某于2020年6月10日由上海市来到该小区探望祖母"}]}
      - {client_belief: "当时有关部门要求社区出入口验码、亮码和登记。", court_record: "天津市有关部门要求社区严格落实出入口值守、验码、亮码和登记措施。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "天津市有关部门发布紧急防控通知，要求严格落实社区出入口值班值守，加强验码、亮码、登记等疫情防控措施"}]}
      - {client_belief: "我骑共享单车进小区，保安呼喊让我停车接受检查。", court_record: "黄某骑车进入小区时，值守保安呼喊要求停车接受亮码、登记检查。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "黄某骑共享单车进入小区，物业公司值守保安当即呼喊要求其停车接受亮码、登记等疫情防控检查措施"}]}
      - {client_belief: "我回头后加速前行，保安骑车追赶并伸手接触我背部时车辆失控。", court_record: "黄某听到呼喊后回头并加速，保安追赶接触其背部时车辆失控摔倒。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "黄某听到有人呼喊后回头观看，随即加速向前骑行。值守保安即骑车追赶，伸手接触原告背部时车辆失控摔倒"}]}
      - {client_belief: "只要保安在我摔倒前追赶并接触过我，物业就必然存在侵权过错。", court_record: "物业依政策值守、验码登记并阻拦冲岗属于履职，结合全过程并不当然构成过错。", gap_type: disputed, evidence: [{section: adjudication, quote: "某物业服务有限公司依照有关政策要求派员值守、验码登记、阻拦冲岗，是履职尽责的体现，其行为没有过错"}]}
      - {client_belief: "我是访客而不是业主，所以不负配合小区依法实施应急管理措施的义务。", court_record: "进入小区人员应依法配合管理人执行政府依法实施的应急处置和管理措施。", gap_type: disputed, evidence: [{section: adjudication, quote: "对于物业服务企业或者其他管理人执行政府依法实施的应急处置措施和其他管理措施，业主应当依法予以配合"}, {section: adjudication, quote: "黄某在物业人员大声呼喊之际却加速骑行，最终导致摔伤，应自行承担相应后果"}]}
    expected_inquiries: ["当时有效的防控通知具体要求什么，物业如何公示和执行？", "入口监控能否完整呈现呼喊、加速、追赶、接触和摔倒顺序？", "保安接触的力度、目的及是否存在更温和替代措施？", "你是否听清检查要求、为何加速，现场是否有其他人员作证？", "伤情、费用及摔倒与接触之间的医学和事实因果证据如何？"]
    memo_expectations: ["确定物业执行政府应急措施的权限、范围和方式。", "完整评价访客配合义务与加速行为，不能仅截取接触瞬间。", "审查追赶接触是否超出必要限度及与摔伤因果关系。", "区分无过错履职、自身过错和可能的过失相抵。", "按证据强度评估赔偿请求与诉讼风险。"]
    editorial_review: *full_review
    editorial_note: 未把历史防疫政策外推为现行规则；案件固定在来源时点，并要求从完整行为链判断过错与因果。

  - id: lsg_cn_0107
    source_line: 159
    source_case_sha256: 37fc42cb3bdb8dadebe3121a8be1cd8156752f0500366ad23af71f4e476a40f4
    split: train
    legal_domain: tort_liability
    client_role: 羽毛球比赛中眼部受伤的宋某祯
    consultation_stage: 伤情稳定后、向击球者索赔前
    opening: 我参加业余羽毛球比赛时被对方正常杀球击中右眼，伤情较重。对方认为这是运动风险不应赔偿，我想确认自愿参赛是否就完全失去救济。
    admission_reason: 多年参赛、比赛组织、正常技术动作、严重伤情和规则遵守完整，可评价自甘风险及故意重大过失例外。
    facts:
      - {client_belief: "我和周某都是多年参加业余羽毛球比赛的爱好者。", court_record: "宋某祯、周某自2015年起自发参加羽毛球比赛。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "宋某祯、周某均为羽毛球业余爱好者，自2015年起自发参加羽毛球比赛"}]}
      - {client_belief: "我们和另外四人在露天场地进行三对三比赛。", court_record: "宋某祯、周某与案外四人在露天场地进行羽毛球3对3比赛。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "宋某祯、周某与案外四人在北京市朝阳区红领巾公园内露天场地进行羽毛球3对3比赛"}]}
      - {client_belief: "我回挑后，周某杀球进攻，我防守未果被球击中右眼。", court_record: "周某迅速杀球进攻，宋某祯直立举拍防守未果并被羽毛球击中右眼。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "周某迅速杀球进攻，宋某祯直立举拍防守未果，被羽毛球击中右眼"}]}
      - {client_belief: "治疗后我的右眼最佳矫正视力仍很低。", court_record: "宋某祯术后五周余验光显示右眼最佳矫正视力为0.05。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "术后5周余验光提示右眼最佳矫正视力为0.05"}]}
      - {client_belief: "只要运动造成严重人身损害，击球者无论动作是否正常都应赔偿。", court_record: "自愿参加有风险文体活动时，其他参加者仅在故意或重大过失造成损害时承担侵权责任。", gap_type: disputed, evidence: [{section: adjudication, quote: "只有周某对宋某祯受伤的损害后果存在故意或重大过失时，才需承担侵权损害赔偿责任"}]}
      - {client_belief: "自甘风险意味着哪怕对方故意击打或严重违反规则，我也一概不能请求赔偿。", court_record: "自甘风险不覆盖其他参加者的故意或重大过失；本案正常杀球且无明显违规才不构成重大过失。", gap_type: disputed, evidence: [{section: adjudication, quote: "周某杀球进攻的行为系该类运动的正常技术动作，周某并不存在明显违反比赛规则的情形，不应认定其存在重大过失"}]}
    expected_inquiries: ["比赛是否自愿参加，双方运动经验和当时竞赛规则如何？", "击球动作、距离、方向及是否明显违反规则，有无录像或见证人？", "对方是否具有故意伤害动机或其他重大过失迹象？", "伤情、治疗、视力和损失鉴定材料如何？", "场地组织者、设施或安全保障是否另有缺陷？"]
    memo_expectations: ["识别羽毛球对抗性活动的一般固有风险。", "适用自甘风险并保留故意、重大过失例外。", "以正常技术动作和规则遵守判断行为人注意义务。", "区分参加者责任与组织者可能的安全保障责任。", "说明损害严重程度本身不能替代过错证明。"]
    editorial_review: *full_review
    editorial_note: 差异不是简单写成“受伤即赔或永不赔”，而是要求律师查明正常风险、规则违反与故意重大过失边界。

  - id: lsg_cn_0108
    source_line: 160
    source_case_sha256: 39d816a42e14ce5e1025d1ce64d355489a81c49afeb468e61da71a1273d1766e
    split: train
    legal_domain: tort_liability
    client_role: 被高空抛下水瓶惊吓摔伤的庾某娴
    consultation_stage: 监控确认抛物来源且治疗持续后、追索剩余损失前
    opening: 我在小区散步时，一只水瓶从高楼落在身旁，我受惊摔倒并长期住院。监控已经确认是某户孩子抛下，家长只付过一部分，我想追索其余损失。
    admission_reason: 高空抛物、监控、书面确认、无行为能力人、监护人和长期伤情完整，可评价间接惊吓因果及具体侵权人责任。
    facts:
      - {client_belief: "我在自家小区散步时，三十五楼落下的矿泉水瓶掉在身旁，导致我受惊摔倒。", court_record: "黄某辉家小孩从35楼抛下水瓶，水瓶落在庾某娴身旁并导致其惊吓、摔倒。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "黄某辉家小孩在房屋阳台从35楼抛下一瓶矿泉水，水瓶掉落到庾某娴身旁，导致其惊吓、摔倒"}]}
      - {client_belief: "亲属和孩子家长一起查看监控后签了确认书，确认水瓶来源。", court_record: "双方查看监控并签订确认书，确认水瓶由黄某辉家小孩从阳台扔下。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "双方签订确认书，确认矿泉水瓶系黄某辉家小孩从阳台扔下"}]}
      - {client_belief: "孩子家长已经向我支付过一万元。", court_record: "黄某辉向庾某娴支付1万元赔偿。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "黄某辉向庾某娴支付1万元赔偿"}]}
      - {client_belief: "我住院二十二天后仍反复住院，累计超过六十天并被评定为十级伤残。", court_record: "庾某娴首次住院22天，后反复住院累计超过60天，并被鉴定为十级伤残。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "庾某娴住院治疗22天才出院，其后又因此事反复入院治疗，累计超过60天，且被鉴定为十级伤残"}]}
      - {client_belief: "水瓶没有直接砸中身体，只是让我受惊摔倒，因此高空抛物与伤害之间不可能有法律因果关系。", court_record: "水瓶落在身旁造成惊吓摔倒并受伤，监控及确认书能够支持抛物行为与损害之间的因果链。", gap_type: disputed, evidence: [{section: adjudication, quote: "庾某娴散步时被从高空抛下的水瓶惊吓摔倒受伤"}, {section: adjudication, quote: "有视频及庾某娴、黄某辉签订的确认书证明"}]}
      - {client_belief: "抛物者是没有民事行为能力的孩子，受害人就只能自行承担，家长不负责任。", court_record: "无民事行为能力人实施抛物造成损害时，其监护人依法承担相应赔偿责任。", gap_type: disputed, evidence: [{section: adjudication, quote: "双方确认抛物者为无民事行为能力人，黄某辉是其监护人，庾某娴要求黄某辉承担赔偿责任"}]}
    expected_inquiries: ["监控原始视频、确认书和抛物来源是否能够稳定保存并核验？", "孩子年龄、民事行为能力和监护关系由哪些材料证明？", "惊吓、摔倒、就医和后续反复住院之间的时间线与医学因果如何？", "已付款的性质和书面约定是否属于部分赔偿还是一次性和解？", "医疗、护理、伤残及精神损害等请求分别有何证据？"]
    memo_expectations: ["以监控和确认书锁定具体抛物人，区别于无法确定侵权人的补偿规则。", "论证惊吓摔倒这种间接作用方式仍可形成事实和法律因果。", "根据无民事行为能力及监护关系确定责任主体。", "审查后续治疗与事故关联并核算各项损失。", "明确已付款扣减和是否存在有效和解范围。"]
    editorial_review: *full_review
    editorial_note: 将“未直接击中”和“儿童抛物”保留为自然误解，同时要求医学因果与既有付款性质接受真实证据审查。
