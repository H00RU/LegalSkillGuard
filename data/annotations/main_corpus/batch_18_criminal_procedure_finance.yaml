    legal_domain: procedure_evidence
    client_role: 协助伪造民间借贷诉讼规避经适房限售的基层法律服务者杨某某
    consultation_stage: 共同虚假诉讼行为被调查后、刑事处理前
    opening: 我曾协助办理若干经济适用房交易，后来被指通过诉讼程序规避上市限制并与司法人员通谋。案件正在调查，我想判断自己在材料准备和程序推进中的刑事责任。
    admission_reason: 规避限售目的、虚构管辖连接点、法院人员参与、多份调解书与财产损失完整，可评价诉讼欺诈及司法人员职务犯罪。
    facts:
      - {client_belief: "我在协助经适房买卖过户时想规避五年限售政策。", court_record: "杨某某为规避经济适用房五年内不准上市交易政策寻找法院人员。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "为规避经济适用房5年内不准上市交易的政策规定"}]}
      - {client_belief: "我与法院副院长预谋虚构民间借贷诉讼。", court_record: "杨某某与魏某预谋以虚构民间借贷纠纷诉讼规避政策。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "二人预谋以虚构民间借贷纠纷诉讼的方式规避政策规定"}]}
      - {client_belief: "双方商定签假借款合同并虚构住址和法院管辖。", court_record: "买卖双方签订虚假借贷合同并在起诉状编造住址和管辖连接点。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "由买卖双方签订虚假民间借贷合同"}, {section: basic_facts, quote: "在起诉状中编造当事人住址在该县的虚假内容"}]}
      - {client_belief: "法院随后出具多份以房抵债调解书，导致经适房违规过户。", court_record: "魏某利用职务出具多份虚假调解书，致多套经适房违规低价过户。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "先后出具多份虚假的以房抵债民事调解书，导致多套经济适用房被违规低价过户"}]}
      - {client_belief: "买卖双方真实想交易房屋，所以借贷事实和管辖事实是否虚构不重要。", court_record: "真实交易目的不能使为规避政策而捏造的借贷、住所和诉讼程序合法化。", gap_type: disputed, evidence: [{section: basic_facts, quote: "以虚构民间借贷纠纷诉讼的方式规避政策规定"}]}
      - {client_belief: "法院人员只是按双方调解意愿出文书，不涉及职权滥用。", court_record: "司法人员利用职务共同出具虚假调解书并造成重大损失，可构成滥用职权。", gap_type: disputed, evidence: [{section: adjudication, quote: "对魏某以滥用职权罪判处有期徒刑六年"}]}
      - {client_belief: "魏某还利用职务收受他人财物，案发后退缴了赃款赃物。", court_record: "魏某除共同出具虚假文书外还收受财物，案发后退缴全部赃款赃物。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "魏某还利用职务上的便利非法收受他人财物，案发后已退缴全部赃款赃物"}]}
    expected_inquiries: ["经适房性质、购置和限售期限如何？", "虚假借贷合同、起诉状、住址与管辖由谁设计制作？", "法院人员如何受托、立案、调解和出具文书？", "违规过户数量、价格差额和公共财产损失如何计算？", "各参与人的获利、请托财物及退缴情况如何？"]
    memo_expectations: ["识别真实房屋交易背后的虚假诉讼结构。", "证明虚构债务、连接点和调解文书的故意。", "评价限售政策规避与司法秩序损害。", "区分外部参与者与司法人员职务责任。", "核算损失、受贿线索和追缴修复措施。"]
    editorial_review: *full_review
    editorial_note: 不把真实购房合意当成虚假借贷诉讼的抗辩，也不把普通政策规避与司法人员职务犯罪混为一谈。

  - id: lsg_cn_0090
    source_line: 54
    source_case_sha256: f98125dd4561355f3d130fbd7cd38f983753ba33d3575a9c8b76b91b7eeab3a3
    split: train
    legal_domain: finance_bankruptcy
    client_role: 被银行另收融资承诺费的房地产开发公司
    consultation_stage: 银行起诉追偿贷款本息后、答辩前
    opening: 银行在贷款安排之外向我公司收取了一项费用，融资后来实际实施。公司逾期后银行起诉追偿，我想审查这项收费的监管依据及能否从应还款中扣除。
    admission_reason: 承诺协议、收费条件、额度全额使用、贷款发放和逾期诉讼完整，可评价金融服务收费与变相融资成本。
    facts:
      - {client_belief: "银行与我公司签订融资承诺协议并承诺提供融资额度。", court_record: "银行与开发公司签订协议并承诺提供融资支持。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某银行与某房地产开发公司签订《融资承诺协议》"}]}
      - {client_belief: "协议要求我公司另行支付融资承诺费。", court_record: "融资承诺协议约定开发公司支付融资承诺费。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某房地产开发公司应支付融资承诺费1000万元"}]}
      - {client_belief: "银行出具融资承诺函后，我公司支付了该费用。", court_record: "银行出具承诺函，同日开发公司转账支付融资承诺费。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某银行出具《融资承诺函》"}, {section: basic_facts, quote: "某房地产开发公司向某银行转账支付融资承诺费1000万元"}]}
      - {client_belief: "公司随后分次取得了全部约定贷款。", court_record: "开发公司分三次共计借款三点五亿元。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某房地产开发公司分三次共计借款3.5亿元"}]}
      - {client_belief: "合同写明承诺费不退，银行就无需说明收费项目的监管依据和独立服务内容。", court_record: "商业银行收费项目与标准受监管规范约束，合同约定不能替代收费依据。", gap_type: disputed, evidence: [{section: adjudication, quote: "商业银行办理业务、提供服务应按照规定收取手续费，收费项目和标准由银行业监管机构、人民银行分别会同国务院价格主管部门制定"}]}
      - {client_belief: "银行提前调配贷款资金必然属于可另收费的独立服务。", court_record: "为履行贷款承诺而调配资金属于金融机构经营成本，不能当然转化为另行收费服务。", gap_type: disputed, evidence: [{section: adjudication, quote: "为依约提供贷款而调配筹集相应资金，是金融机构应承担的经营成本"}]}
      - {client_belief: "协议还写明额度未使用、部分使用或提前终止时承诺费都不退。", court_record: "融资承诺协议约定额度未使用、部分使用或协议提前终止时银行不退承诺费。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "若额度使用期内未使用或部分使用或本协议提前终止，某银行不归还已支付的承诺费"}]}
    expected_inquiries: ["融资承诺协议、贷款合同和收费凭证如何约定关联？", "收费时适用的监管项目、标准和公示材料是什么？", "银行除贷款准备外实际提供了何种独立服务？", "额度是否全部使用、费用是否计入综合融资成本？", "逾期本金利息与争议费用应如何重新核算？"]
    memo_expectations: ["确认融资承诺费法律与监管依据。", "审查收费对应的独立服务和实际履行。", "区分银行经营成本与客户有偿服务。", "将违规收费与贷款本金利息准确抵扣。", "避免以收费无效否定真实贷款清偿责任。"]
    editorial_review: *full_review
    editorial_note: 仅审查附加收费，不把收费项目无依据扩张成借款合同和本金债务全部无效。

  - id: lsg_cn_0091
    source_line: 56
    source_case_sha256: a75e1e7638ab3389dbf89406ae340b87cdd5f084057bdc533596e00c515e4e08
    split: train
    legal_domain: finance_bankruptcy
    client_role: 主张从破产开发公司取回已抵债交付房屋的集团公司
    consultation_stage: 开发公司进入破产清算后、提起取回权诉讼前
    opening: 多年前开发公司曾以房屋抵销对我们的欠款，后来权属登记一直未完成。现在开发公司破产，我们想查清执行、交付和登记障碍并主张该房屋不属于破产财产。
    admission_reason: 抵债对价、预售备案、执行裁定、实际交付、未登记原因和法律变迁完整，可评价破产取回权及旧法物权效力。
    facts:
      - {client_belief: "开发公司与我公司签订商品房买卖合同并开具全款发票、办理预售备案。", court_record: "双方签订买卖合同，开发公司开具全部房款发票并办理预售登记备案。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "开具了全部购房款发票，作了房屋预售登记备案"}]}
      - {client_belief: "法院调解确认房屋用于抵销开发公司对我公司的欠款。", court_record: "生效调解确认开发公司以出售房屋抵销欠款。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "并将房屋卖给某集团公司，作为抵销对某集团公司的欠款"}]}
      - {client_belief: "执行法院裁定房屋产权过户给我公司。", court_record: "执行裁定将案涉房屋产权过户给集团公司。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "将案涉房屋产权过户给某集团公司所有"}]}
      - {client_belief: "双方已实际交付房屋，但开发公司未取得权证导致登记未完成。", court_record: "集团公司取得钥匙门卡，未登记源于开发公司未取得权属证书。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某集团公司取得钥匙和门卡"}, {section: basic_facts, quote: "某开发公司因自身原因未取得不动产权属证书，房屋未完成所有权转移登记"}]}
      - {client_belief: "破产受理时没有产权登记，就当然只能作为普通债权申报。", court_record: "权利形成于现行实体法实施前时，应结合当时法律、制度和现实判断房屋是否属于破产财产。", gap_type: disputed, evidence: [{section: adjudication, quote: "取回权人主张作为取回权基础的民事权利形成于物权法等实体法实施之前的，应当结合法律的溯及力、我国物权制度的发展过程、行为发生时的社会现实情况等因素，进行综合判断"}]}
      - {client_belief: "未登记的不动产在任何历史法律条件下都不可能取得物权效力。", court_record: "在应适用的旧法采取登记对抗主义时，支付对价并实际占有可据以认定物权。", gap_type: disputed, evidence: [{section: adjudication, quote: "根据1995年城市房地产管理法关于不动产物权变更登记采对抗主义的规定，其已取得房屋物权"}]}
      - {client_belief: "房屋被案外人占用后，我公司两次提起排除妨害诉讼并获支持。", court_record: "集团公司曾两次起诉案外人排除妨害且均获得法院支持。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "某集团公司曾两次起诉案外人排除妨害，均获得法院支持"}]}
    expected_inquiries: ["合同、发票、抵债调解和执行裁定形成时间及效力如何？", "房屋交付、占有使用和排除妨害证据有哪些？", "未登记原因是否可归责于买受人？", "权利形成时应适用何种不动产登记规则？", "房屋是否存在第三人权利及破产管理人异议？"]
    memo_expectations: ["固定抵债对价和生效文书。", "证明实际交付持续占有与未登记原因。", "正确处理新旧实体法时间效力。", "判断房屋是否属于债务人破产财产。", "区分取回权、物权期待权和普通债权路径。"]
    editorial_review: *full_review
    editorial_note: 该结论高度依赖权利形成时间和旧法规则，避免泛化成现行法下一切交付未登记房屋均可取回。

  - id: lsg_cn_0092
    source_line: 58
    source_case_sha256: 7d5a5f17d234a20eb342d0fe49b1289462b17760a57ea5100e1dbbfec957a157
    split: train
    legal_domain: finance_bankruptcy
    client_role: 被要求在改制接收资产范围内连带还债的商贸公司
    consultation_stage: 金融资产债权人起诉要求承担改制债务后、答辩前
    opening: 我公司由原集团部分单位改制成立，改制方案记载了资产债务承接安排。债权人据此要求我们扩大承担责任，我想核查方案是否实际履行以及责任范围。
    admission_reason: 改制方案、资产负债清单、方案未完全履行、实际接收资产与已偿外债完整，可评价企业改制债务承继边界。
    facts:
      - {client_belief: "我公司由原集团五个子分公司改制设立。", court_record: "地方政府以中原集团五个子分公司改制成立商贸公司。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "以中原集团公司五个子（分）公司改制成立某商贸公司"}]}
      - {client_belief: "资产负债清单设计以外债与内部债务冲减后由我公司偿还外债。", court_record: "移交清单记载外部债务与内部债务冲减并由商贸公司负责偿还外债。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "4660余万元对外债务与原五个子（分）公司欠中原集团公司的3715万余元内部债务冲减"}]}
      - {client_belief: "原改制方案没有完全履行。", court_record: "原改制方案并未完全履行。", gap_type: undisputed, evidence: [{section: basic_facts, quote: "但原改制方案并未完全履行"}]}
