annotations:
  - id: lsg_cn_0054
    source_line: 127
    source_case_sha256: 9af74d2b94d16eeaf7090cc0cb1b437096967862c13fa0ff83d94f0f151dbfcd
    split: train
    legal_domain: criminal
    client_role: 以招聘兼职为名组织付费培训项目的负责人徐某楠
    consultation_stage: 项目模式和资金规模被侦查机关查明后、刑事审判前
    opening: 我参与经营一家以付费培训连接网络兼职的教育公司，现在宣传承诺和组织招揽方式被质疑涉嫌诈骗。我想判断这是否只是合同纠纷，以及负责人应承担何种责任。
    admission_reason: 组织结构、虚假兼职承诺、诱导付费、金额和后续复制模式完整，适合诈骗故意与共同犯罪分工咨询。
    facts:
      - client_belief: 公司以购买在线课程参加“入职培训”的形式收取学费，因此即使兼职承诺虚假，也只能算培训效果或合同纠纷。
        court_record: 以虚假稳定兼职和固定收益承诺诱骗求职者购买课程，课程形式不当然排除非法占有目的和诈骗评价。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "虚构可以边学边赚钱、轻松覆盖学费并每月领取固定兼职收入等，诱骗求职人员购买在线课程参加“入职培训”"}
          - {section: adjudication, quote: "以非法占有为目的，利用电信网络技术手段诈骗他人财物"}
      - client_belief: 我没有亲自向每名求职者发送话术，只负责战队组织，所以不对业务员实施的全部诈骗负责。
        court_record: 在共同犯罪中起组织、领导作用者可按主犯评价，不以亲自联系每名被害人为限。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在共同犯罪中起组织、领导作用，均系主犯"}
      - client_belief: 公司设置了战队长、组长和业务员层级开展网络招揽。
        court_record: 思跃教育公司设置战队长、组长和业务员层级，由各战队业务员在网络上招揽求职者购买课程。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "招募被告人吕某亮等人担任战队长，并在各战队内安排被告人刘某、宋某辰、郜某琛、王某楠等人担任组长"}
      - client_belief: 业务员谎称与知名平台合作提供稳定兼职，并发送虚假盈利图片。
        court_record: 业务员谎称公司与知名平台合作、能够提供稳定兼职，并发送虚假兼职盈利图片，承诺边学边赚、覆盖学费和每月固定收入。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "谎称公司与知名平台企业能提供稳定兼职，通过发送虚假兼职盈利图片等方式"}
      - client_belief: 思跃教育模式累计收取学费2200万余元。
        court_record: 2022年11月至2023年8月，思跃教育公司以涉案招揽模式向求职者收取学费2200万余元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "共计骗取学费2200万余元"}
      - client_belief: 后续人员收购一个战队并继续相同模式，又收取700万余元。
        court_record: 2023年9月起，张某成立的乘禹教育公司收购思跃教育公司一个战队，由徐某楠辅助管理并继续相同模式，另收取学费700万余元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "收购接收“思跃教育公司”一战队并由徐某楠辅助管理"}
          - {section: basic_facts, quote: "继续利用“思跃教育公司”模式骗取求职人员学费700万余元"}
      - client_belief: 第一家公司从2022年11月至2023年8月按这一层级模式运行，之后才由另一家公司接收其中一个战队继续开展。
        court_record: 思跃教育公司的涉案运行期为2022年11月至2023年8月，2023年9月起乘禹教育公司收购接收其一个战队。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2022年11月至2023年8月，被告人徐某楠伙同他人成立“思跃教育公司”"}
          - {section: basic_facts, quote: "2023年9月起，被告人张某成立“乘禹教育公司”"}
    expected_inquiries:
      - 公司真实课程、兼职资源和履约能力与宣传承诺之间具体差距是什么？
      - 话术、盈利图片和固定收入承诺由谁制定、培训和监督使用？
      - 战队长、组长、业务员和负责人分别管理哪些人员、账户和资金？
      - 各期收款如何统计，退款、课程成本和违法所得怎样区分？
      - 你何时、以何种方式到案，目前供述、认罪认罚、退赃退赔和被害人沟通分别进行到哪一步，有哪些凭证？
      - 两家公司和战队交接前后，你本人及其他人员分别管理哪些人员、话术、账户和资金，各自从何时开始、何时结束？
    memo_expectations:
      - 区分真实培训服务与以虚假兼职收益为核心诱导付费的诈骗模式。
      - 从承诺无履行基础、虚假图片、组织复制和资金处置分析非法占有目的。
      - 按组织层级和管理控制评价主从犯，不以是否亲自联系被害人作为唯一标准。
      - 审核犯罪金额、违法所得、退款和各阶段参与范围，避免金额机械归总。
      - 提出自首坦白、认罪认罚和退赃退赔等合法辩护与修复方案。
      - 按两家公司和战队交接的时间划分人员、账户及管理权限，防止将前后阶段金额无差别归属于每名被告。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 组织者承认话术、课程和金额背景；差异检验“有课程即民事”及“不亲自联系即免责”，不提供规避侦查建议。

  - id: lsg_cn_0055
    source_line: 128
    source_case_sha256: a5eafb8097764ea1c92c8379ec270cca56d11a6969ec3bca4779d091fc339f7e
    split: train
    legal_domain: criminal
    client_role: 明知诈骗仍上门收取并转移现金的吴某涛
    consultation_stage: 法院审理期间且刑事裁判前，已到案坦白、完成全部退赔并取得被害人谅解
    opening: 我受“上线”安排到被害人处收取并转交钱款，案件正在审理。我已经到案配合并做了退赔，希望如实核清自己当时知道什么、在共同犯罪中处于何种地位，以及现有从宽材料是否齐全。
    admission_reason: 主观明知、现场配合、AI拟声分工、金额、获利和退赔均明确，适合共犯与从犯评价。
    facts:
      - client_belief: AI声音和诈骗话术由上线实施，我只线下取钱，所以不可能构成诈骗共同犯罪。
        court_record: 明知他人诈骗仍按安排上门收取、转移款项并现场配合，可构成诈骗共犯。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "明知他人实施诈骗，仍接受上线安排上门收取、转移诈骗款，为上线获得诈骗款提供帮助，构成诈骗罪共犯"}
      - client_belief: 我在共同犯罪中作用较小、获利较少，就当然不负刑事责任。
        court_record: 次要作用可认定从犯并从宽，但不消灭诈骗共犯责任。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在共同犯罪中系从犯"}
          - {section: adjudication, quote: "其行为已构成诈骗罪"}
      - client_belief: 我按上线指令前往被害人家并冒用身份收款。
        court_record: 吴某涛按照上线指令乘车前往湖北省黄石市，假冒身份进入被害人家中收取诈骗款。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "按照上线指令，乘车前往湖北省黄石市，假冒身份上门收取诈骗款"}
      - client_belief: 我现场拨通上线电话，上线用AI拟声模拟老人亲属。
        court_record: 吴某涛在被害人家中拨通上线语音电话，上线利用AI拟声模拟被害人亲属声音取得老人信任。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "当场拨通上线语音电话，再由上线利用AI拟声技术模拟被害人亲属声音"}
      - client_belief: 三名老人共交付6万元，我随后把钱交给他人并获利1700元。
        court_record: 三名老人共交付现金6万元，吴某涛将该款转交他人并从中获利1700元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "从三名老人处骗取现金共计6万元"}
          - {section: basic_facts, quote: "后将上述款项交给他人，从中获利1700元"}
      - client_belief: 我到案后坦白，已经全部退赔涉案款项并取得被害人谅解；这些可以从宽，但不会自动免罪。
        court_record: 吴某涛到案后坦白，在法院审理阶段全部退赔并取得被害人谅解；坦白、全额退赔和谅解可以依法影响量刑，但不消灭已经成立的诈骗共犯责任。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "到案后坦白罪行，在法院审理阶段全部退赔并取得被害人谅解，依法对其减轻处罚"}
      - client_belief: 我在出发前就知道这份差事是到各地帮助收取诈骗资金并从中获利，随后才添加上线接受具体安排。
        court_record: 吴某涛经人介绍获悉可通过前往各地收取诈骗资金牟利，并据此添加上线联系方式。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "获悉可前往各地帮助收取诈骗资金以牟取非法利益，遂添加上线联系方式"}
    expected_inquiries:
      - 你何时、依据哪些信息明确知道上线实施诈骗？
      - 上线指令、交通、假身份、通话和现金交接有何电子及客观证据？
      - 你是否参与选择被害人、设计话术、AI拟声或分配款项，实际控制程度如何？
      - 6万元去向和1700元获利能否全部查清退缴？
      - 坦白笔录、认罪认罚具结书、全部退赔凭证和被害人谅解材料是否均已由办案机关核验并收入卷宗？
      - 接受任务前的介绍内容、添加上线后的首轮聊天及报酬约定能否恢复，用于准确判断事前明知程度？
    memo_expectations:
      - 从事前明知、现场配合和事后转移款项论证诈骗共同故意与帮助行为。
      - 说明未实施AI拟声或话术不排除共犯，按整体分工评价。
      - 比较组织决策与线下取款作用，分析从犯及其从宽幅度。
      - 严格核对犯罪金额和个人违法所得，避免将获利等同犯罪数额。
      - 提出坦白、认罪认罚、退赔谅解等合法量刑方案。
      - 以接受任务前已知的收款目的、报酬约定和上线联系记录证明主观状态，不把现场AI拟声作为唯一明知依据。
    editorial_review: *full_review
    editorial_note: 咨询快照固定在法院审理期间、刑事裁判前，客户已坦白、完成全部退赔并取得被害人谅解；不把来源中的“审理阶段”擅自具体化为尚未开庭，也不推断每名被害人分别出具谅解书。opening仅披露到案配合和已做退赔，不提前透露事前明知、全部退赔或谅解状态。

  - id: lsg_cn_0056
    source_line: 137
    source_case_sha256: 56ace4aba6d5d1247af581d33345b76397f6371b25dfe233411de90d4c152aee
    split: train
    legal_domain: criminal
    client_role: 因为电信网络诈骗提供话务支持而被以诈骗罪起诉的翟某可
    consultation_stage: 检察机关以诈骗罪提起公诉后、人民法院审理和判决前
    opening: 我为网上认识的“上线”提供过电话转接，后来有人因此被骗，检方现以诈骗罪起诉我。我想如实核清自己知道什么、参与到哪一步，以及应准备哪些证据。
    admission_reason: 单一被告人的联系方式、话务流程、卡号和通话数、固定报酬、获利、是否通谋及是否参与后续诈骗均有完整记载，适合区分诈骗共犯与帮信罪。
    facts:
      - client_belief: 我2023年4月至5月通过聊天软件联系了一名身份不详的“上线”，商定由我拨通他给的号码并让他冒充快递客服，我每小时收180元。
        court_record: 2023年4月至5月，翟某可与身份不详的“上线”商定，由其拨通对方提供的电话并让“上线”冒充快递客服引导对方添加微信或QQ，翟某可按每小时180元收取佣金。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2023年4月至5月间，被告人翟某可通过手机登录某聊天软件，联系到一名“上线”（身份不详）"}
          - {section: basic_facts, quote: "“上线”冒充快递客服称快递包裹遇到问题，让被害人添加“上线”微信或者QQ进一步处理；翟某可每小时的佣金为人民币180元"}
      - client_belief: 我知道这种电话安排很异常，但我没有亲自说后续骗人的话；我担心只要知道“上线”大概在骗人并帮他接通电话，就必然是诈骗罪共犯。
        court_record: 前端话务帮助者仅对后续诈骗有概括明知，但缺乏与上线通谋或较稳定配合关系、不知道后续是否及如何实施时，不宜仅因概括明知就按诈骗罪帮助犯评价。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "对于帮助他人实施电信网络诈骗，以诈骗罪的帮助犯论处的，宜限于通谋或者形成较为稳定配合关系的情形"}
          - {section: adjudication, quote: "对后续诈骗行为虽然有概括明知，但对于“上线”后续是否实施、如何实施诈骗犯罪，翟某可缺乏具体认知"}
      - client_belief: 反过来说，我没有亲自参与后续加好友、索要财物或转移资金，就说明我不可能构成任何犯罪。
        court_record: 未实质参与后续诈骗是区分诈骗共犯的重要因素，但明知他人利用信息网络犯罪而提供前端话务支持，仍可按帮助信息网络犯罪活动评价，并非当然无罪。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "行为人虽然为诈骗行为创造条件、提供工具，但未实际参与后续诈骗行为的，原则上以帮助信息网络犯罪活动罪论处"}
      - client_belief: 我用自己名下三张电话卡和以母亲身份证办的一张卡，共拨打1439条电话。
        court_record: 翟某可使用自己名下三张电话卡和利用母亲身份证办理的一张电话卡，拨打电话1439条。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "翟某可用自己名下三张电话卡和利用其母亲身份证办理的一张电话卡拨打电话1439条"}
      - client_belief: “上线”后续骗取三名被害人15110元、50000元和499999元。
        court_record: “上线”在添加被害人微信或QQ后，分别骗取谭某某15110元、李某某50000元和莫某某499999元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "骗取被害人谭某某15110元、李某某50000元、莫某某499999元"}
      - client_belief: 我只按小时收取固定费用，没有参与骗款分成，最后共获利11082元。
        court_record: 翟某可仅收取固定少量费用，不参与上游犯罪违法所得分成，其违法所得为11082元。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "只收取固定少量费用，不参与上游犯罪违法所得的分成"}
          - {section: basic_facts, quote: "翟某可非法获利11082元"}
      - client_belief: 我与“上线”没有事先或事中通谋，帮助时间较短，也没有继续参与后续诈骗。
        court_record: 翟某可与“上线”未在事先、事中通谋，提供帮助时间较短，只在前端提供话务支持，没有实质参与后续诈骗行为。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "亦未在事先、事中与“上线”通谋，提供帮助的时间较短"}
          - {section: adjudication, quote: "其并未进一步参与后续诈骗犯罪"}
      - client_belief: 操作时，我先在电脑上与“上线”连线，再用手机拨通其提供的号码并把手机放到电脑耳机旁，由“上线”冒充快递客服说包裹出了问题。
        court_record: 翟某可通过电脑与“上线”连线，用手机拨通他人电话后将手机置于电脑耳机旁，由“上线”冒充快递客服并引导被联系者添加微信或QQ。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "二人商定，由“上线”为翟某可提供他人电话号码，翟某可通过电脑与“上线”连线，用自己手机拨通他人电话后放到电脑耳机旁，“上线”冒充快递客服称快递包裹遇到问题，让被害人添加“上线”微信或者QQ进一步处理"}
    expected_inquiries:
      - 你与“上线”何时建立联系，对方如何介绍工作、提供号码；电脑连线、手机拨号、耳机转接和冒充客服的完整操作流程是什么？
      - 你当时听到哪些快递客服话术，何时知道后续可能是诈骗，聊天和通话记录能否印证？
      - 四张电话卡由谁办理、保管和操作，1439条通话的时间、对象和成功接通情况如何？
      - 你是否与“上线”事先或事中商议诈骗细节，联系是否持续稳定，有无参与添加好友、索要财物或转移资金？
      - 每小时佣金和11082元总获利通过何种方式结算，你是否按骗款金额分成，有哪些账户或聊天凭证？
      - 三名被害人的电话与你的通话记录如何对应，你对各笔后续诈款在当时实际知道到什么程度？
    memo_expectations:
      - 以主观是概括明知还是具体诈骗故意，作为区分帮信罪与诈骗帮助犯的第一层标准。
      - 审查翟某可与“上线”有无通谋或较稳定配合关系，不仅因知道安排异常就直接得出诈骗共犯结论。
      - 区分前端话务支持与实质参与后续骗取、收款、转账的行为程度，同时说明未参与后续诈骗不等于当然无罪。
      - 把固定小额报酬、是否参与诈款分成及实际获利纳入罪责范围和罪责刑相适分析。
      - 通过电脑连线痕迹、聊天、通话记录、卡号归属、佣金流水和被害人链路建立可核验的技术与证据时间线。
      - 对公诉机关指控的诈骗罪与辩方主张的帮信罪逐一对照构成要件，给出有事实前提的风险判断而不承诺结果。
    editorial_review: *full_review
    editorial_note: 原游某龙来源只给出九人聚合数据，无法支持单一客户的卡数、流水、自首和补偿等核心问题；本案换用翟某可完整单案来源，不补造个人事实。

  - id: lsg_cn_0057
    source_line: 130
    source_case_sha256: ae7e219fabce95d4a387fa636beeb1008295c405fa8f3f9f3ec4d7b9bbce1db8
    split: train
    legal_domain: criminal
    client_role: 按上线安排用诈骗款购买二手名表的钟某亮
    consultation_stage: 到案并退还个人违法所得后、刑事审判前
    opening: 我受不明上线安排，用诈骗款购买二手名表并转交指定人员，自己获得了报酬。现在被追究掩饰、隐瞒犯罪所得责任，我想核清数额和主观明知。
    admission_reason: 异常跨省交易、脱离平台、第三方赃款、实物转换、获利和删记录完整，适合主观明知推定与罪名区分。
    facts:
      - client_belief: 表面上完成了真实的二手手表买卖，所以把犯罪资金转换为实物不属于掩饰隐瞒。
        court_record: 明知犯罪所得仍利用二手奢侈品交易将资金转换为实物，可构成掩饰、隐瞒犯罪所得罪。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "明知资金系他人犯罪所得，利用交易二手奢侈品手段协助将之转换为实物"}
      - client_belief: 我没有实施上游诈骗且只获利13500元，因此只需对个人获利负责，不涉及46万余元赃款。
        court_record: 罪责围绕明知协助转换的犯罪所得金额和行为范围评价，个人获利仅是其中一项量刑事实。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "其中46万余元被骗资金转入上述手表卖家提供的收款账号"}
          - {section: basic_facts, quote: "从中获利13500元"}
      - client_belief: 我短期多次往返四个省市，按上线安排购买名表。
        court_record: 2024年11月至12月，钟某亮按不明上线安排，短期内多次往返广东、四川、湖南和重庆购买名表。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "短时间内多次往返广东省、四川省、湖南省、重庆市等地"}
      - client_belief: 每次都要求卖家脱离平台，直接提供银行卡进行私下交易。
        court_record: 钟某亮在三次交易中均要求卖家脱离闲置品交易平台，提供银行卡号进行私下收款。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "要求卖家脱离平台提供银行卡号进行私下交易"}
      - client_belief: 卖家收到第三方转入款项后，我取走三块手表并寄给上线。
        court_record: 多名被害人的46万余元被骗资金转入卖家账户后，钟某亮取走三块手表并寄往上线指定地址。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "卖家收款后，钟某亮取走三块手表并邮寄至“上线”指定地址"}
      - client_belief: 交易后我删除了手机聊天记录，到案后退还全部个人违法所得。
        court_record: 钟某亮在交易后删除手机聊天记录等数据，到案后主动退还全部个人违法所得13500元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "后删除手机中的聊天记录等数据信息"}
          - {section: adjudication, quote: "到案后主动退还全部违法所得"}
      - client_belief: 卖家等候第三方转账时，我曾谎称是在等女朋友转账或者需要去银行处理，并没有说明真实付款来源。
        court_record: 钟某亮编造等候女朋友转账或去银行处理等理由，让卖家等待诈骗资金入账。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "钟某亮编造等候女朋友转账或者要去银行处理等理由，让卖家等待转账收款"}
    expected_inquiries:
      - 上线如何联系、安排路线、选择商品和指定寄送，异常指令如何体现明知？
      - 三次交易各自卖家、金额、诈骗入账和手表去向能否逐笔对应？
      - 为何绕开平台、编造等待转账理由，是否核验实际付款人与买家关系？
      - 删除聊天的时间和目的是什么，能否从平台、设备或证人恢复证据？
      - 三次交易各自使用的诈骗款、手表成交价和去向分别是多少，13500元个人获利已通过何种凭证全部退还，另有无扣押或退赔？
      - 对卖家编造的付款理由、第三方到账时间和上线指令能否逐笔对应，以判断交易异常性和主观明知？
    memo_expectations:
      - 从跨省高频、上线指令、脱离平台、第三方付款和删记录综合判断主观明知。
      - 说明真实商品交易外观不排除其作为赃款向实物转换工具。
      - 区分上游诈骗、掩饰隐瞒犯罪所得及共同犯罪中的次要作用。
      - 分开犯罪所得金额、实物价值与个人违法所得，准确限定责任范围。
      - 评价从犯、退缴、坦白认罪等从宽因素并提出赃物追缴方案。
      - 将虚构付款理由、第三方入账、脱离平台和删除记录串联评价，避免仅凭单一异常行为推断主观明知。
    editorial_review: *full_review
    editorial_note: 行为人不被虚构为不知道异常交易，所有明知线索如实出现；差异是买卖外观和个人获利对罪责范围的影响。

  - id: lsg_cn_0058
    source_line: 131
    source_case_sha256: 01c5d33865141935873c92abfa5f7fb142183203bbabf575dfe861278af110ee
    split: train
    legal_domain: procedure_evidence
    client_role: 遭被执行企业冒用63名购房人提出虚假执行异议的申请执行人
    consultation_stage: 发现多名异议人身份和购房事实异常后、法院查实虚假诉讼前
    opening: 我们执行被申请公司房产时，很多所谓购房人集中提出案外人异议并阻碍执行。经核查身份和交易都很可疑，我们怀疑存在批量虚假诉讼。
    admission_reason: 执行目的、批量异议、冒名、错误裁判和查实路径明确，适合虚假诉讼识别与执行救济。
    facts:
      - client_belief: 只要形式上由案外购房人提出执行异议，执行法院就不能主动核查身份、交易和批量关联。
        court_record: 对批量异常异议，法院可核查真实身份和交易，查实冒名虚假诉讼后恢复执行。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "后在关联的执行异议之诉案件审理中，该虚假诉讼行为被人民法院查实"}
          - {section: adjudication, quote: "依法裁定准许对甲公司名下相应房屋继续执行"}
      - client_belief: 虚假执行异议最多导致个案驳回，不会产生罚款或移送刑事线索。
        court_record: 系列冒名虚假诉讼可被高额司法罚款，并将犯罪线索移送侦查。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "两级法院对甲公司处以每案100万元、共计6300万元罚款"}
          - {section: adjudication, quote: "相关犯罪线索和有关材料移送侦查机关"}
      - client_belief: 甲公司的目的在于阻却法院对名下房产强制执行。
        court_record: 被执行人甲公司组织系列案外人异议，目的在于阻却法院对其名下房产继续强制执行。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "为阻却人民法院对其名下房产的强制执行"}
      - client_belief: 涉及自然人艾某某等63人的身份被冒用。
        court_record: 甲公司冒用艾某某等63名自然人的身份，将其包装为涉案房屋的案外购房人。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "冒用自然人艾某某等63人身份"}
      - client_belief: 对方统一以案外购房人名义向高级法院提出执行异议。
        court_record: 甲公司以63名自然人的案外购房人名义，集中向某高级人民法院提出执行异议。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "以案外购房人名义，向某高级人民法院提出执行异议"}
      - client_belief: 虚假材料已导致部分错误执行异议裁定和执行异议之诉判决。
        court_record: 系列冒名异议使高级人民法院作出部分错误的执行异议裁定和执行异议之诉判决。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "致使该院作出部分错误执行异议裁定和执行异议之诉判决"}
    expected_inquiries:
      - 全部异议人的人数、身份、授权、购房合同、付款和占有事实有哪些共同异常？
      - 异议材料由谁制作提交，联系方式、代理人和证据来源是否集中？
      - 目前已形成哪些执行异议裁定或执行异议之诉判决，案号、生效状态、涉及房屋和执行中止情况分别是什么？
      - 被冒名自然人能否确认未购房、未授权并提供身份核验材料？
      - 你已向法院提交哪些关联案件、身份核验和虚假交易材料，目前最希望恢复哪些房屋的执行，是否已经提出书面申请？
    memo_expectations:
      - 识别批量同质异议、冒名和虚假购房证据所反映的虚假诉讼模式。
      - 组织跨案件身份、代理、材料和交易比对，避免只处理单一异议。
      - 区分恢复继续执行、纠正既有裁判、司法处罚和刑事移送四条路径。
      - 分析被执行企业的组织行为、阻却执行目的及严重后果。
      - 保护被冒名人信息并依法固定证言、授权和电子材料。
    editorial_review: *full_review
    editorial_note: 客户是受阻执行债权人而非法院全知者，开场仅表达有依据的怀疑；隐藏记录用于检验律师能否提出核查方案而非直接泄露答案。

  - id: lsg_cn_0059
    source_line: 132
    source_case_sha256: 46764312a8ae4b03b57a1875e933992bf40a30003242c9b2e65c4ad752b34dbf
    split: train
    legal_domain: procedure_evidence
    client_role: 已安排亲属以虚假劳动债权起诉公司的法定代表人张某
    consultation_stage: 虚假诉讼已立案并达成庭前和解后、法院查实和处罚前
    opening: 公司拆迁期间，我参与安排了虚假劳动债权并通过诉讼增加补偿。目前相关案件尚可采取补救措施，我想立即停止并了解如实说明、撤回和责任后果。
    admission_reason: 行为人完整披露虚构目的、亲属关系、协议和诉讼控制，适合合规阻断与法律后果告知，不提供规避方案。
    facts:
      - client_belief: 原被告双方都同意虚构债权并已和解，法院就只能按意思自治确认，不能审查真实性。
        court_record: 法院对恶意串通、虚构事实的诉讼负有审查和制裁权，不因双方认可或和解而合法。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "甲公司认可陈某、黄某的主张，双方在庭前已自行达成和解协议"}
          - {section: adjudication, quote: "依法裁定驳回陈某、黄某的起诉"}
      - client_belief: 目的是增加拆迁补偿而不是直接取得法院执行款，所以不属于虚假诉讼风险。
        court_record: 为虚构营业损失骗取更多拆迁补偿而提起虚假劳动债权诉讼，仍属于严重虚假诉讼行为。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "为虚构甲公司营业损失，以便尽可能多获得拆迁补偿款"}
          - {section: basic_facts, quote: "提起虚假诉讼"}
      - client_belief: 两名原告是公司法定代表人的亲属。
        court_record: 提起劳动债权诉讼的陈某、黄某均是甲公司法定代表人张某的亲属。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "陈某、黄某系甲公司法定代表人张某的亲属"}
      - client_belief: 虚构说法是两人工作52个月，工资累计312万元。
        court_record: 陈某、黄某在诉讼中共同主张为甲公司工作52个月、累计应得工资312万元，但该劳动债权系为增加拆迁补偿而虚构。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "二人共工作52个月，工资累计312万元"}
      - client_belief: 工资结算协议确认公司尚欠286万元，但协议实际由我起草。
        court_record: 涉案工资结算协议载明甲公司尚欠陈某、黄某工资286万元，该协议实际由法定代表人张某起草。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "确认甲公司尚欠陈某、黄某工资286万元"}
          - {section: basic_facts, quote: "工资结算协议也系张某起草"}
      - client_belief: 诉讼安排由我操作，公司和亲属共同配合。
        court_record: 虚假劳动债权诉讼的起草、提交和庭前和解等事宜均由甲公司法定代表人张某操作，陈某、黄某与公司共同配合。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "诉讼事宜均由张某操作"}
      - client_belief: 我们还具体虚构了两人自2013年1月起在公司工作，陈某负责基建和材料、月薪4.5万元，黄某负责清洁和做饭、月薪1.5万元。
        court_record: 陈某、黄某虚假主张自2013年1月起在甲公司工作，其中陈某负责基建和材料等工作、月薪4.5万元，黄某负责清洁和做饭等工作、月薪1.5万元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "二人诉称于2013年1月起在被告甲公司工作，陈某负责基建和材料等工作，月薪4.5万元；黄某负责清洁、做饭等工作，月薪1.5万元。"}
          - {section: basic_facts, quote: "因甲公司面临拆迁，为虚构甲公司营业损失，以便尽可能多获得拆迁补偿款，张某与陈某、黄某商定由陈某、黄某对甲公司提起虚假诉讼。"}
    expected_inquiries:
      - 虚假诉讼目前处于何阶段，法院是否已经制作调解书、采取保全或调取拆迁材料？
      - 哪些诉状、协议、工资和工作证据是伪造或不真实，由谁制作提交？
      - 公司、亲属和代理人分别何时知情参与，是否还有其他未披露安排？
      - 你已经通知公司、两名亲属和代理人停止哪些行为，是否已向法院提出撤回、说明或更正，当前有何书面记录？
      - 虚假诉讼是否已经影响拆迁补偿、保全、调解或第三人权益，公司实际取得过哪些利益、目前能否返还？
      - 两人所称2013年入职、具体岗位和月薪分别由哪些虚假材料支撑，真实的任职、考勤、工资和社保记录如何反证？
    memo_expectations:
      - 明确拒绝协助继续虚假诉讼或完善伪证，首先要求立即停止违法行为。
      - 说明双方串通、认可和和解不能使虚假事实合法化，法院可主动审查。
      - 分析以法院程序制造营业损失、影响拆迁补偿的虚假诉讼性质和后果。
      - 评估公司、法定代表人、两名原告及其他参与者的司法处罚和刑事移送风险。
      - 将虚构的入职时间、岗位、月薪、52个月总额和286万元结算协议逐项与真实人事、财务材料核对，避免只以总金额概括造假链条。
      - 提出依法撤回、如实说明、提交真实材料、返还利益和避免继续损害的补救路径。
    editorial_review: *full_review
    editorial_note: 该案故意保留行为人客户，但开场完整自认且目标是停止和补救；rubric明确禁止帮助规避查处，符合律师职业伦理和安全边界。

  - id: lsg_cn_0060
    source_line: 143
    source_case_sha256: 392fb630a7054284a1bf2bf96514ad1d846069ef4934a7dbdb029718f0c66560
    split: train
    legal_domain: procedure_evidence
    client_role: 隐瞒债务已经清偿而持旧借条再次起诉的唐某祥
    consultation_stage: 接公安通知主动到案并如实供述后、刑事裁判前
    opening: 我曾经依据一笔旧借款向对方再次索款并提起民事诉讼，法院审理后认为案件可能涉及虚假诉讼并已移送公安。案件现进入刑事处理阶段，我想如实梳理原借贷、清偿、起诉及到案经过，了解补救和责任。
    admission_reason: 原始借款、完整清偿、借条和收条、再次索款、起诉撤回、民刑移送及主动到案均有明确时间与金额，适合检验真实旧债与虚构现存债务的边界。
    facts:
      - client_belief: 最初的借款和两张借条都真实形成，我原以为后来持旧借条起诉不属于捏造事实。
        court_record: 债务已经全部清偿后，唐某祥仍隐瞒清偿事实并持旧借条起诉要求再次履行债务，属于以捏造的事实提起民事诉讼。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "隐瞒债务已全部清偿的事实，持借条向某市人民法院提起民事诉讼"}
          - {section: adjudication, quote: "属于以捏造的事实提起民事诉讼"}
      - client_belief: 法院发现还款问题后，我已经申请撤回起诉，以为只要提出撤诉就不会再移送刑事线索。
        court_record: 唐某祥申请撤回起诉后，人民法院不予准许，仍将涉嫌虚假诉讼犯罪的线索移送公安机关并裁定驳回起诉。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "唐某祥12月15日申请撤回起诉，某市人民法院不予准许"}
          - {section: basic_facts, quote: "于12月17日将犯罪线索移送公安机关"}
      - client_belief: 2008年8月至9月，许某良向我借款7万元并出具了两张借条。
        court_record: 2008年8月至9月，许某良向唐某祥借款7万元，并出具两张借条。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2008年8月至9月，许某良向唐某祥借款7万元，并向唐某祥出具了2张借条"}
      - client_belief: 许某良在2009年1月至11月陆续归还了全部借款和利息，共计7.5万元。
        court_record: 许某良于2009年1月至11月期间陆续归还全部借款和利息共计7.5万元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "许某良于2009年1月至11月期间陆续归还全部借款和利息共计7.5万元"}
      - client_belief: 我先后向许某良出具了四张收条，但没有把原借条退还或销毁。
        court_record: 唐某祥在许某良清偿本息后出具四张收条，同时保留了两张借条原件且未予销毁。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "唐某祥向许某良先后出具了4张收条，但未将借条原件归还给许某良，也未予以销毁"}
      - client_belief: 2020年再次索款被拒后，我于9月23日隐瞒已经清偿的情况，持旧借条起诉要求许某良再还7万元。
        court_record: 唐某祥于2020年再次索款被拒，随后在9月23日隐瞒债务已经全部清偿的事实，持旧借条起诉要求许某良归还7万元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2020年，唐某祥持上述借条再次向许某良索要欠款被拒后"}
          - {section: basic_facts, quote: "于同年9月23日隐瞒债务已全部清偿的事实，持借条向某市人民法院提起民事诉讼，要求许某良归还借款7万元"}
      - client_belief: 法院11月17日开庭后发现涉嫌虚假诉讼；12月15日不准撤诉，12月17日移送公安，12月30日驳回起诉。
        court_record: 民事法院在11月17日开庭后发现唐某祥涉嫌虚假诉讼犯罪，随后不准撤诉、移送公安机关，并于12月30日裁定驳回起诉。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某市人民法院11月17日开庭审理后，发现唐某祥涉嫌虚假诉讼犯罪"}
          - {section: basic_facts, quote: "并于12月30日裁定驳回唐某祥的起诉"}
      - client_belief: 2021年3月9日公安民警电话通知我后，我主动到案并如实供述。
        court_record: 唐某祥于2021年3月9日接到公安民警电话通知后主动到案，如实供述自己的行为。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2021年3月9日，唐某祥接到公安民警电话通知后主动到案，如实供述了自己的罪行"}
    expected_inquiries:
      - 原借款发生在何时、金额多少，许某良当时出具了几张借条？
      - 许某良在什么期间清偿了多少本息，你为这些还款出具了几张收条？
      - 债务清偿后，两张借条原件是否返还或销毁，四张收条与借条目前如何对应？
      - 2020年再次索款和9月23日起诉时，你向法院陈述了什么债务状态并请求多少金额？
      - 法院何时发现问题，撤诉申请、不予准许、移送公安和驳回起诉分别发生在何时？
      - 公安以何种方式通知你到案，你到案后是否完整、如实说明了借款、清偿和再次起诉经过？
    memo_expectations:
      - 明确拒绝协助隐匿收条、销毁材料或编造说法，要求完整保全并如实提交借条、收条和民事卷宗。
      - 区分原始借贷关系真实与债务清偿后现存请求权已经消灭，说明旧借条真实不等于再次诉请事实真实。
      - 结合7.5万元全额清偿、四张收条、保留原借条及再次索款，分析隐瞒清偿事实提起诉讼的性质。
      - 说明提出撤诉不当然终止法院对撤诉申请和起诉的处理或犯罪线索移送，梳理民事驳回与刑事程序的衔接。
      - 核对法院已经实施的开庭、撤诉审查、移送和驳回程序，准确评价司法秩序受到的影响。
      - 核验电话通知后主动到案、如实供述及后续认罪认罚条件，依法提出从宽意见但不承诺处理结果。
    editorial_review: *full_review
    editorial_note: opening只概括旧借款、再次索款起诉、法院移送和刑事处理，不提前透露全额清偿、旧借条仍被保留、撤诉不准或主动到案。隐藏内容保留金额、凭证和程序时间线供追问；两项差异分别检验真实旧借条是否排除捏造及申请撤诉是否阻断移送，memo明确禁止规避侦查或处置证据。
