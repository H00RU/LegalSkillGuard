    client_role: 边坡工程再次出现质量问题的镇政府
    consultation_stage: 取得二次缺陷鉴定且与施工方争议形成后、起诉前
    opening: 我们发包的边坡工程在施工和修复过程中多次出现险情，现需按新方案处理。双方对原设计、施工质量、风险原因及修复费用承担争议很大。
    admission_reason: 原设计缺陷、施工方知情、二次照图修复、再次缺陷和鉴定完整，发包设计过错与承包施工过错可以分配。
    facts:
      - client_belief: 工程内容约定以我们提供的设计图纸和清单为准。
        court_record: 发包人与建筑公司约定工程内容以设计图纸和清单列明项目为准。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "双方签订协议约定，工程内容以设计图纸和清单列明项目为准"}]
      - client_belief: 工程完工后遭遇大雨，挡土墙发生垮塌。
        court_record: 工程完工后因当地突降大雨，案涉挡土墙发生垮塌。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工程完工后，因当地突降大雨，案涉工程挡土墙发生垮塌"}]
      - client_belief: 第一次鉴定已经指出我们提供的设计图纸不符合技术规范。
        court_record: 鉴定显示工程水毁原因是镇政府提供的设计图纸不符合技术规范要求。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工程水毁原因是某镇人民政府提供的设计图纸不符合技术规范要求"}]
      - client_belief: 施工方随后仍按原设计修复，修复后工程又倾斜沉降。
        court_record: 建筑公司按原设计图纸修复后，工程再次出现倾斜、沉降。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建筑公司按照原设计图纸对工程进行修复。修复后，工程又出现倾斜、沉降"}]
      - client_belief: 图纸由发包方提供，只要设计存在缺陷，施工方按图施工就不可能承担任何责任。
