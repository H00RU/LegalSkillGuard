      - 双方为何约定仍按原图修复，施工方是否提出过异议或替代方案？
      - 二次倾斜沉降的范围、成因和新修复方案由哪些检测鉴定支持？
      - 新修复费用如何测算，双方各自行为对损失扩大有什么影响？
    memo_expectations:
      - 依据设计提供义务分析发包方对不合规范图纸的主要过错。
      - 依据施工专业注意义务分析承包人明知缺陷仍施工的相应过错。
      - 区分暴雨外因、设计缺陷与施工行为的因果作用。
      - 以鉴定支持新方案必要性、费用范围和过错比例，而非全有或全无归责。
      - 设计修复履行、费用分担及防止损失扩大的实施安排。
    editorial_review: *full_review
    editorial_note: 双方均掌握其亲历行为，差异刻画彼此可能主张的单方免责或全责；隐藏记录保持共同过错结构，不把来源中的具体比例当客户已知答案。
