        evidence: [{section: basic_facts, quote: "某汽车公司对不平整轨道进行调平整改、对断裂或存在质量缺陷的吊车梁进行加固是必要及合理的"}]
      - client_belief: 工程当年验收合格，施工方此后对主体结构缺陷就不再负保修义务。
        court_record: 主体结构在五十年设计使用年限内出现质量缺陷，施工单位仍应履行更换维修义务。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "案涉工程主体结构吊车梁在设计使用年限（50年）内出现质量缺陷，某建设公司应承担更换新的预制钢筋混凝土吊车梁的保修义务"}]
      - client_belief: 因施工方拒不维修，我们自行支出的全部费用都当然可以全额转嫁给施工方。
        court_record: 施工方对拖延保修造成的必要、合理保护性修复费用负责，费用范围仍须审查确定。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "某建设公司拖延履行保修义务，某汽车公司采取保护性修复措施，产生的修复费用中合理费用为127万余元，该笔费用应由某建设公司承担"}]
      - client_belief: 施工方拖延后我们自行维修加固，并在诉讼中主张一百七十五万元修复费用。
        court_record: 汽车公司自行维修加固后请求施工方赔偿修复费用一百七十五万元。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某汽车公司遂自行维修加固，后起诉请求某建设公司履行保修义务，并赔偿其自行修复所产生的费用共计175万元"}]
    expected_inquiries:
      - 请提供合同、设计文件、竣工验收和质量保修约定，主体结构设计年限如何记载？
      - 裂缝何时发现、影响何种作业安全，是否及时通知施工方并给予维修机会？
      - 裂缝成因、原施工质量和后续使用维护是否已有鉴定或检测？
