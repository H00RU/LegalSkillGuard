      - 结合鉴定证明裂缝属于主体结构质量缺陷及更换方案必要性。
      - 审查施工方收到通知后拖延履责的经过。
      - 仅支持必要合理的保护性修复费用，核减无因果关系或过度修复部分。
      - 设计继续维修、费用赔偿及安全风险控制的请求和证据方案。
    editorial_review: *full_review
    editorial_note: 客户知道交付、裂缝和自修事实；隐藏差异不预设全部费用，而要求区分长周期主体保修与合理费用因果边界。

  - id: lsg_cn_0100
