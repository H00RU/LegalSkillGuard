annotations:
  - id: lsg_cn_0093
    source_line: 144
    source_case_sha256: 1a3c0537c77a27e3f39bd5f5e776cf7ef33806a0b54764849628108dffd53d35
    split: train
    legal_domain: real_estate_construction
    client_role: 借用建设公司资质实际组织施工的葛某
    consultation_stage: 工程价款被拖欠后、提起诉讼前
    opening: 我借用一家建设公司的名义承接项目，发包方从洽商开始就一直直接和我对接。现在工程款被拖欠，我担心合同无效后自己不能直接主张价款。
    admission_reason: 发包人明知借资质、履约保证金、实际施工和价款转付链条完整，合同效力与折价补偿存在自然认知差异。
    facts:
      - client_belief: 我以某建设公司名义与房地产公司签了施工合同。
        court_record: 葛某以某建设公司名义与某房地产公司签订建设工程施工合同。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "葛某以某建设公司名义与某房地产公司签订建设工程施工合同"}]
      - client_belief: 履约保证金是我自己向房地产公司交的，共二百万元。
        court_record: 施工合同签订过程中，葛某向某房地产公司支付200万元履约保证金。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "施工合同签订过程中，葛某向某房地产公司支付200万元履约保证金"}]
      - client_belief: 发包方始终直接和我洽商，清楚我是借用资质的实际施工人。
        court_record: 某房地产公司直接与葛某洽商并明确知道葛某借用某建设公司资质订立合同。
        gap_type: undisputed
        evidence: [{section: adjudication, quote: "某房地产公司收取葛某履约保证金，直接与葛某洽商，明确知道葛某借用某建设公司资质订立合同"}]
      - client_belief: 施工班组、材料款和人工工资都是我组织或支付的。
        court_record: 合同签订后葛某组织施工班组、支付材料款及人工工资。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "合同签订后葛某组织施工班组、支付材料款及人工工资"}]
      - client_belief: 发包方明知并实际履行过，施工合同和借资质约定应当都有效。
        court_record: 建设施工合同及资质借用合同因违反法律强制性规定均属无效。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "当事人签订的建设工程施工合同及资质借用合同违反法律强制性规定应属无效"}]
      - client_belief: 如果合同无效，我可能只能让名义上的建设公司收款，自己无权向发包方请求任何补偿。
        court_record: 发包人明知资质借用并结合实际施工、既往付款情况时，实际施工人可以请求发包人支付折价补偿款。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "根据某房地产公司向某建设公司、葛某支付价款情况，某建设公司、葛某实际施工情况，最终判决：某房地产公司向葛某支付折价补偿款"}]
      - client_belief: 发包方曾把工程款付给名义建设公司，由其扣除管理费后再转给我。
        court_record: 名义建设公司收到发包方工程价款后扣除管理费并支付给葛某。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建设公司在收到某房地产公司支付的工程价款后扣除管理费支付给葛某"}]
    expected_inquiries:
      - 合同洽商、签署和履约过程中，发包方分别与谁联系，哪些记录能证明其知道借资质事实？
      - 履约保证金、材料款和人工工资分别由谁支付，请提供流水、票据和班组资料。
      - 已完成工程的范围、质量验收和结算资料如何，发包方已支付多少价款？
      - 建设公司收款后如何扣除管理费并转付，双方内部协议具体约定了什么？
      - 尚欠款项如何计算，是否还存在质量、工期或其他抵扣争议？
    memo_expectations:
      - 分别判断施工合同与资质借用合同效力，不能以发包方明知替代强制性规范审查。
      - 以直接洽商、保证金和实际组织施工证明发包方明知及葛某实际施工人地位。
      - 区分有效合同工程价款请求与无效合同下参照履行价值计算的折价补偿。
      - 核对已付款、管理费、欠款和工程质量，防止重复或超额计算。
      - 说明名义承包人参加争议处理的必要性及三方内部追偿风险。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 客户如实知道借资质和自己的履约行为；差异集中于发包人明知是否使合同有效、合同无效是否当然阻断实际施工人的折价补偿请求。

  - id: lsg_cn_0094
    source_line: 145
    source_case_sha256: 26b2098c0e45d238ca374557cb39c608e7e2651d0f3fa85f9f0227c2bcb15468
    split: train
    legal_domain: real_estate_construction
    client_role: 被园林分包单位拖欠工资的农民工何某
    consultation_stage: 持有工资欠条且催款未果后、起诉前
    opening: 我们在一个园林项目施工后被欠工资，项目已经投入使用。分包方与总包方相互推诿，我想查清实际招用、结算和工资责任还能向谁主张。
    admission_reason: 总分包关系、直接招用、欠条、未结算和总包先行清偿责任均有明确来源，责任主体误解自然。
    facts:
      - client_belief: 某建设公司是项目总承包单位，招用我们的工程公司是园林工程分包单位。
        court_record: 某建设公司系项目施工总承包单位，某工程公司系园林工程分包单位。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建设公司系某工程项目的施工总承包单位，某工程公司系该工程项目中园林工程的分包单位"}]
      - client_belief: 项目已经竣工验收并投入使用，但总包和分包一直没有结算。
        court_record: 工程项目已经竣工验收并投入使用，总包与分包一直未进行结算。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "该工程项目已竣工验收并投入使用，某建设公司与某工程公司一直未进行结算"}]
      - client_belief: 我们是由分包工程公司直接招进工地干活的。
        court_record: 某工程公司招用何某等人在工地施工。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某工程公司招用何某等人在工地施工"}]
      - client_belief: 工资欠条载明还欠我们十三万余元。
        court_record: 工资欠条显示某工程公司尚欠何某等人工资13万余元。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工资欠条显示某工程公司尚欠何某等人工资13万余元"}]
      - client_belief: 总包没有直接招用我们，而且还没和分包结算，所以对欠薪完全没有责任。
        court_record: 分包单位拖欠农民工工资时，施工总承包单位负有先行清偿责任，清偿后可以追偿。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "分包单位拖欠农民工工资的，由施工总承包单位先行清偿，再依法追偿"}]
      - client_belief: 有分包公司出具的欠条就只能告分包公司，不能把总包列入同一请求。
        court_record: 工资欠条所涉请求没有其他争议时，分包单位负直接责任，总承包单位仍应先行清偿。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "某工程公司对农民工工资支付负直接责任，某建设公司应对何某等人的工资先行清偿，清偿后可依法追偿"}]
    expected_inquiries:
      - 谁招用、安排工作和考勤，工种、施工期间及每人的工资标准分别是什么？
      - 请提供工资欠条原件、工资表、考勤、转账和催款记录。
      - 总包与分包的身份及园林工程分包关系可由哪些合同、现场标识或管理资料证明？
      - 欠条所列工资是否存在已支付、抵扣或与工程款混同的其他争议？
      - 项目竣工投入使用时间及向总包、分包催告的经过如何？
    memo_expectations:
      - 区分分包单位直接工资支付责任与总承包单位法定先行清偿责任。
      - 证明劳动给付、招用关系及欠薪数额，核查欠条真实性和对应人员范围。
      - 说明总分包尚未结算不当然对抗农民工工资请求。
      - 设计共同列明责任主体的请求并避免把工资争议误写为工程款结算争议。
      - 提示总承包单位清偿后的追偿关系不应转嫁给劳动者。
    editorial_review: *full_review
    editorial_note: 客户能够回答招用、施工和欠条事实；差异只落在总包是否因未直接招用、未结算而免责，未要求工人推测企业内部结算。

  - id: lsg_cn_0095
    source_line: 146
    source_case_sha256: a9c20d3a926d3e82f073970289b515b6a08d946f87f621c13befc6c3467175eb
    split: train
    legal_domain: real_estate_construction
    client_role: 固定总价合同中途解除后的承包建设集团
    consultation_stage: 第三人续建完成且双方结算争议形成后、申请鉴定前
    opening: 一份固定总价施工合同履行中途解除，双方对已完成工程和后续接续施工的价款分配争执不下。我想确定合理的结算方法。
    admission_reason: 固定总价、部分履行、第三人续建、质量合格和比例法鉴定完整，存在“固定总价不可拆分”的自然误解。
    facts:
      - client_belief: 合同约定由我们承建项目，固定总价为八千九百万元。
        court_record: 建设集团与置业公司约定项目施工合同价格为固定总价8900万元。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "合同价格为固定总价8900万元"}]
      - client_belief: 我们完成大部分施工任务后，双方解除了合同。
        court_record: 某建设集团公司完成大部分施工任务后，双方解除合同。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建设集团公司完成大部分施工任务后，双方解除合同"}]
      - client_belief: 剩余工程后来由第三人施工完成。
        court_record: 合同解除后其余工程由第三人施工完成。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "后来，其余工程由第三人施工完成"}]
      - client_belief: 我们已经施工的部分质量合格。
        court_record: 某建设集团公司已施工部分质量合格。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建设集团公司已施工部分质量合格"}]
      - client_belief: 固定总价合同只能在全部完工时按总价结算，中途解除后没有可采用的客观拆分方法。
        court_record: 部分施工且无约定、协商不成时，可以鉴定已完工部分与全部工程造价并以比例折算固定总价。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "分别计算出已完工部分的工程价款为8100余万元，全部工程价款为9700余万元，两者相除得出比例系数83.5%，再用合同约定的固定总价8900万元乘以该比例，确定承包人已完工部分工程价款"}]
      - client_belief: 只要申请鉴定，就应直接按鉴定机构算出的已完工市场造价结算，不必再受合同固定总价约束。
        court_record: 鉴定结果用于计算已完工造价占全部造价的比例，结算基数仍为当事人约定的固定总价。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "再用合同约定的固定总价8900万元乘以该比例，确定承包人已完工部分工程价款"}]
    expected_inquiries:
      - 合同固定总价的范围、图纸、清单以及中途解除时的施工界面如何约定和固定？
      - 已完工部分的质量验收、签证、工程量和现场记录是否完整？
      - 第三人续建的范围与原承包范围能否一一对应，是否发生设计变更？
      - 双方是否另行约定中途解除结算方法，历次结算意见分别是什么？
      - 已付款、代付款、扣款及利息起算依据如何？
    memo_expectations:
      - 识别固定总价风险分配与合同中途解除后部分结算的冲突。
      - 先查约定和协商，缺乏约定时再论证比例法及鉴定必要性。
      - 以同一计价口径确定已完工与全部工程造价比例，避免口径不一致。
      - 将比例作用于合同固定总价而非机械采用已完工市场造价。
      - 核对施工界面、质量、已付款和第三人续建范围，防止重复计算。
    editorial_review: *full_review
    editorial_note: 两个差异分别检验“固定总价不能拆分”和“鉴定价直接替代合同价”，其余施工范围、解除和质量均保持客户亲历事实。

  - id: lsg_cn_0096
    source_line: 147
    source_case_sha256: 341b6287a763fe5aeae2868af8ced4917229a0eb649150c76cc4286f7b025cd1
    split: train
    legal_domain: real_estate_construction
    client_role: 完工后长期等不到政府投资项目审计的建筑公司
    consultation_stage: 已提交审计资料且催款无果后、起诉前
    opening: 我们承建的桥梁已经验收，合同却约定结算以国家审计结果为准。资料交了很久仍没有审计结论，乡政府据此拒付剩余工程款，我想知道能否不再等下去。
    admission_reason: 审计条款、增量审批停滞、竣工验收、送审和司法鉴定路径明确，审计是否构成无限期付款前提有自然差异。
    facts:
      - client_belief: 合同约定工程量变更须报交通运输委审批，竣工价款以国家审计结果为准。
        court_record: 合同约定变更工程量须报交通运输委审查批准，竣工结算价款以国家审计结果为准。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "变更增减工程量需按管理程序报经交通运输委审查批准，结算时可以作为调整依据"}, {section: basic_facts, quote: "工程竣工结算价款以国家审计机关的审计结果为准"}]
      - client_belief: 施工中发生多项增量工程，但交通运输委长期没有审查批准。
        court_record: 施工过程中发生多项增量工程，某交通运输委对变更工程量长期未审查批准。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "施工过程中发生多项增量工程，某交通运输委对变更工程量长期未审查批准"}]
      - client_belief: 桥梁工程已经在二〇二二年三月通过竣工验收。
        court_record: 2022年3月桥梁工程通过竣工验收。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "2022年3月，该工程通过竣工验收"}]
      - client_belief: 我们随后提交资料请求审计并催付余款，但审计结果无正当理由长期未出。
        court_record: 建筑公司提交资料请求审计和付款后，审计结果无正当理由长期未作出。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "某建筑公司向某乡政府提交资料请求审计并请求支付剩余工程款，但审计结果无正当理由长期未作出"}]
      - client_belief: 既然约定以审计结果为准，只要审计机关不出结果，乡政府就可以一直不支付。
        court_record: 审计和变更审批无正当理由未在合理期限完成时，不能机械等待并无限期阻却已验收工程的付款。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "如果继续机械地等待审计结果出具，明显不利于维护中小企业合法权益"}]
      - client_belief: 没有国家审计结论，法院也不可能采用其他方式确定工程价款。
        court_record: 审计结果长期未出时，承包人可以申请司法鉴定确定工程价款。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "某建筑公司申请对工程价款进行司法鉴定，人民法院依法予以准许"}]
      - client_belief: 工程在二〇二〇年五月开工，之后才发生多项增量工程。
        court_record: 桥梁工程于二〇二〇年五月开工，施工中发生多项增量工程。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工程2020年5月开工，施工过程中发生多项增量工程"}]
    expected_inquiries:
      - 请提供施工合同中审计、变更审批、付款和期限条款的完整文本。
      - 增量工程由谁指令、是否实际完成，签证、影像和工程量资料有哪些？
      - 竣工验收文件、移交使用情况和质量争议如何？
      - 送审资料何时、向谁提交，材料是否齐全，催审催款及回复记录是什么？
      - 已付款和剩余价款如何计算，拟申请鉴定的范围是否包含争议增量？
    memo_expectations:
      - 解释审计结算条款不等于赋予发包人无限期拖延付款权。
      - 结合竣工验收、完整送审和无正当理由延误判断合理期限是否届满。
      - 区分合同内工程、已审批变更与争议增量的证明路径。
      - 论证司法鉴定的必要性、范围和计价资料基础。
      - 梳理工程款、利息、责任主体及政府投资项目程序风险。
    editorial_review: *full_review
    editorial_note: opening只披露验收与久审不决；隐藏事实保留变更审批、送审和替代计价路径，未把法院判决金额写入咨询时点。

  - id: lsg_cn_0097
    source_line: 148
    source_case_sha256: bdd8dae9cc02710b15df2567ec4d0a96020a68a340069f89224041566be023a4
    split: train
    legal_domain: real_estate_construction
    client_role: 工程中途停建后已退场的科技公司
    consultation_stage: 退场多年且追索工程款未果后、起诉前
    opening: 我们承建的工程未能整体完工，发包方以未竣工验收为由拒绝返还质量保证金。双方对已施工部分的结算、质量和返还期限有争议。
    admission_reason: 保证金比例、约定返还节点、非承包人原因停工、退场和已完工程质量完整，竣工节点无法发生时的期限认知自然。
    facts:
      - client_belief: 合同约定质量保证金为结算金额的百分之五。
        court_record: 专业工程施工合同约定质量保证金为结算金额的5%。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "合同约定质量保证金为结算金额的5%"}]
      - client_belief: 原约定是竣工验收合格满一年后十五个工作日内返还。
        court_record: 合同约定质量保证金自竣工验收合格之日起满1年后15个工作日内返还。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "自竣工验收合格之日起满1年后15个工作日内返还"}]
      - client_belief: 工程在二〇一六年中途停建，我们随后退场。
        court_record: 工程于2016年中途停建，某科技公司退场。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "该工程于2016年中途停建，某科技公司退场"}]
      - client_belief: 我们已经施工的部分质量是合格的。
        court_record: 某科技公司已施工部分质量合格。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "已施工部分质量合格"}]
      - client_belief: 只要整个工程没有竣工验收，合同约定的保证金返还期限就永远不会开始。
        court_record: 非因承包人原因停工且复工不可预见时，保证金返还期限应从承包人退场之日起算，不得无限期扣留。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "质量保证金应自承包人退场之日起算1年后返还，不应无限期扣留"}]
      - client_belief: 中途停工意味着已完工部分不再有质量保证责任，因此保证金应在退场时立即全额返还。
        court_record: 已完工部分质量合格并不消灭法定保修责任，返还仍应经过以退场为起点的约定期间。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "在已完工工程质量合格的情况下，质量保证金应自承包人退场之日起算1年后返还"}]
    expected_inquiries:
      - 合同关于保证金比例、缺陷责任、竣工验收和返还期限如何完整约定？
      - 停工是谁决定、原因是什么，是否能证明并非承包人原因？
      - 实际退场和施工界面固定在何时，有无交接、验收或质量确认文件？
      - 退场后是否出现质量缺陷、维修通知或发包方代修支出？
      - 结算金额、已付款、保证金余额和历次催款如何对应？
    memo_expectations:
      - 说明整体竣工节点客观无法发生时返还条款的合理替代起算点。
      - 证明停工非因承包人原因、退场时间和已完部分质量合格。
      - 区分保证金返还与承包人对已完部分继续承担的法定保修责任。
      - 按已完工程结算金额核对保证金基数及已扣款。
      - 评估返还请求、逾期利息和可能质量抗辩的证据风险。
    editorial_review: *full_review
    editorial_note: 客户的两个相反极端认识均有现实性：发包方主张永不届期，承包方可能主张立即返还；记录保留退场起算且保修责任不消失的中间规则。

