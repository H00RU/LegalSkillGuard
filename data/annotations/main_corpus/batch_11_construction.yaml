        gap_type: disputed
        evidence: [{section: adjudication, quote: "某建筑公司明知原设计图纸存在设计缺陷，仍按照原设计图纸进行修复，亦应承担相应责任"}]
      - client_belief: 修复后再次出问题，施工方就应承担全部新方案费用，发包方原设计错误已因第一次修复而消失。
        court_record: 再次缺陷由发包方不合规范的原设计和施工方明知仍施工共同造成，应按双方过错分担修复费用。
        gap_type: disputed
        evidence: [{section: adjudication, quote: "案涉工程修复后仍存在质量缺陷由两方面原因造成：一是某镇人民政府提供的设计图纸不符合技术规范要求，应承担主要责任；二是某建筑公司明知原设计图纸存在设计缺陷，仍按照原设计图纸进行修复，亦应承担相应责任"}]
    expected_inquiries:
      - 原设计由谁编制、审查和提供，施工方何时知道其不符合规范？
