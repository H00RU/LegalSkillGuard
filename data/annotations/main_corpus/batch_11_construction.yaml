    admission_reason: 设计年限、交付时间、主体结构缺陷、保护性修复和鉴定意见完整，可区分一般保修期与合理使用年限。
    facts:
      - client_belief: 施工合同约定车间工程质量应符合国家或行业检验评定标准。
