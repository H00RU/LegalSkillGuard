        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工程设计使用年限为50年，质量保修期自工程验收合格之日起算"}]
      - client_belief: 交付使用十年后，主体结构吊车梁开裂并影响作业安全。
        court_record: 工程竣工交付使用10年后，主体结构吊车梁出现裂缝并影响作业安全。
        gap_type: undisputed
        evidence: [{section: basic_facts, quote: "工程竣工交付使用10年后，主体结构吊车梁出现裂缝，影响作业安全"}]
      - client_belief: 施工方拖延保修后，我们自行调平轨道并加固缺陷吊车梁。
