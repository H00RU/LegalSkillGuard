    split: train
    legal_domain: environment_resources
    client_role: 投加COD去除剂干扰自动监测被查的污水处理公司负责人
    consultation_stage: 行政执法发现监测干扰行为后、刑事审判前
    opening: 作为重点排污单位，我们为降低自动监测值使用了一种所谓治理产品，但污染物并未真正被去除。公司和相关负责人正面临刑事调查，我想了解责任边界。
    admission_reason: 既往处罚、规避目的、投加次数、监测机理和主管人员实施完整。
    facts:
      - client_belief: 公司此前因COD等指标超标已先后三次受到行政处罚。
        court_record: 2019年3月至2020年5月，环保公司因废水COD等指标超标先后三次受到行政处罚。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "先后三次被行政处罚"}
      - client_belief: 已经受过行政处罚，同类排放和监测行为之后就不能再进入刑事评价。
        court_record: 既往行政处罚不排除后续独立、情节恶劣的干扰监测排污行为构成犯罪。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "为逃避监管、规避处罚而采用隐蔽手段干扰自动监测结果"}
          - {section: adjudication, quote: "构成污染环境罪"}
      - client_belief: 产品叫“COD去除剂”，投加到处理末端就可视为正常治污，不属于干扰监测。
        court_record: 该物质不真正去除COD，只干扰测定使监测值低于实际，属于隐蔽规避监管。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "并不能真正去除废水中的COD物质，只是干扰COD测定过程，造成监测值比实际偏低"}
      - client_belief: 2020年12月至2021年1月，公司先后七次购买该产品。
        court_record: 2020年12月至2021年1月，环保公司先后七次购买“COD去除剂”水剂和粉剂。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2020年12月至2021年1月"}
          - {section: basic_facts, quote: "先后七次购买“COD去除剂”水剂、粉剂"}
      - client_belief: 我作为污水处理负责人，曾亲自投加或指使员工投加。
        court_record: 夏某频是环保公司生产经营负责人并直接负责污水处理，其亲自投加或指使员工将“COD去除剂”投加至污水处理末端。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "夏某频系该公司生产经营负责人，直接负责污水处理工作"}
          - {section: basic_facts, quote: "由夏某频亲自或指使其他员工投加至污水处理末端"}
      - client_belief: 干扰后排放的废水仍含有污染物化学需氧量。
        court_record: 环保公司投加“COD去除剂”仅压低监测数值，实际仍排放含化学需氧量污染物的废水并造成严重环境污染。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "排放含有污染物化学需氧量的废水，严重污染环境"}
      - client_belief: 公司本身是重点排污单位，主营污水处理及相关技术咨询，对自动监测和真实治理义务应当有专业认识。
        court_record: 环保公司属于湖州市重点排污单位，经营范围包括污水处理及相关技术咨询。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "被告单位长兴某环保科技有限公司（以下简称环保公司）系浙江省湖州市重点排污单位，经营范围包括污水处理及相关技术咨询"}
    expected_inquiries:
      - 三次行政处罚与本次七次投加在时间、行为和排放批次上如何区分？
      - 产品采购、成分、说明和投加指令能否证明购买目的及主观明知？
      - 自动监测、人工比对和实际COD数据如何证明干扰及超标排放？
      - 公司决策层、负责人和具体员工分别知情参与到何种程度？
      - 是否已停止使用、真实治理超标、修复环境并建立监测合规制度？
      - 作为重点排污单位，公司适用的自动监测、异常报告和质量控制制度是什么，实际由谁负责落实？
    memo_expectations:
      - 区分真正污染治理与仅干扰测定数值的技术行为。
      - 以既往超标处罚、逃避监管目的和隐蔽投加证明主观故意及恶劣情节。
      - 说明既往处罚不当然阻却对后续独立犯罪行为的追究。
      - 分别分析单位犯罪与直接负责主管人员的实施和指挥责任。
      - 提出真实达标改造、监测校准、整改和认罪认罚措施。
      - 结合重点排污单位身份和专业经营范围评价其自动监测、异常报告及真实治理义务，不能把产品名称当作专业注意义务的替代。
    editorial_review: *full_review
    editorial_note: 负责人承认投加和产品真实机理，避免虚构“完全不知道”；差异聚焦行政刑事关系和去除剂名称是否能掩盖监测干扰。

  - id: lsg_cn_0053
    source_line: 124
    source_case_sha256: d2c35a04316343a58520fb08ef4d42107c49703d06c2ce22f85fd09d086e9f13
    split: train
    legal_domain: environment_resources
    client_role: 保护区内采矿权被提前关闭且补偿申请未答复的建材公司
    consultation_stage: 三次补偿申请均未获答复后、提起行政诉讼前
    opening: 公司矿区因文物保护政策被政府关闭并注销采矿权，我们多次申请行政补偿没有得到处理。现在准备起诉履职并争取合理补偿。
    admission_reason: 合法许可证、保护区退出、提前关闭、三次申请和行政首次判断权完整。
    facts:
      - client_belief: 采矿许可证有效期原为2015年7月1日至2020年7月1日。
        court_record: 建材公司的砖瓦用粘土矿采矿许可证有效期为2015年7月1日至2020年7月1日。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "有效期为2015年7月1日至2020年7月1日"}
      - client_belief: 矿区位于黑水国遗址保护区，政府依据分类处置意见决定关闭注销。
        court_record: 涉案矿区位于黑水国遗址保护区；甘州区政府依据保护地矿业权分类处置意见，于2018年9月30日决定关闭矿区并注销采矿权。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "矿区位于黑水国遗址保护区范围内"}
          - {section: basic_facts, quote: "对建材公司砖瓦用粘土矿进行关闭，并注销其采矿权"}
      - client_belief: 许可证后来已经自然到期，所以政府无需再答复此前提前退出是否应补偿。
        court_record: 对依政策提前退出的方式及是否补偿，甘州区政府仍应在期限内调查并作出书面认定。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "未在规定的时限内对建材公司矿业权的退出方式及是否给予行政补偿作出明确认定"}
      - client_belief: 政府长期不答复后，法院可以不经行政调查裁量，直接判给我们主张的具体补偿金额。
        court_record: 补偿方式和数额需行政机关先调查判断，法院应尊重首次判断权，不宜径行判具体给付。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "该项工作必须在张掖市甘州区人民政府的主导下，在调查的基础上进行最终的认定或裁量"}
          - {section: adjudication, quote: "不宜径行判决张掖市甘州区人民政府履行具体的给付义务"}
      - client_belief: 我们在2021年10月至12月先后三次递交书面补偿申请。
        court_record: 建材公司于2021年10月10日、11月18日和12月18日三次向甘州区政府递交书面矿业权退出补偿申请。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2021年10月10日、11月18日、12月18日，建材公司先后三次向张掖市甘州区人民政府递交书面矿业权退出的行政补偿申请"}
      - client_belief: 三次申请均没有收到政府答复。
        court_record: 甘州区政府收到建材公司三次书面矿业权退出补偿申请后，均未作出答复。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "均未获答复"}
    expected_inquiries:
      - 请提供采矿许可证、矿业权取得投入、剩余储量和经营资料。
      - 关闭注销决定、公告、政策文件和实际关闭时间如何，是否告知补偿安排？
      - 三次申请内容、附件和送达凭证能否证明政府已收件？
      - 退出属于何种政策分类，是否有可比矿业权补偿标准或评估？
      - 你当前最优先希望政府书面认定退出和补偿问题，还是同时要求支付某一金额；三次申请中分别写了哪些请求和计算依据？
    memo_expectations:
      - 区分采矿权合法存续、保护区政策退出与许可证后来自然到期。
      - 认定政府对书面补偿申请负有及时调查和明确答复职责。
      - 说明法院尊重行政首次判断权，通常先判履职而非直接确定补偿数额。
      - 梳理矿业权投入、剩余期限、关闭原因和退出分类，为行政裁量提供证据。
      - 设计履职判决后的行政处理、异议及后续救济路径。
    editorial_review: *full_review
    editorial_note: 企业不被承诺一定获得具体补偿；差异准确区分行政机关答复义务与法院直接给付权限，符合行政补偿程序。
