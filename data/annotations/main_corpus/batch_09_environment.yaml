annotations:
  - id: lsg_cn_0049
    source_line: 118
    source_case_sha256: d69d8b7aa1f8c9e78d31ca8e6b24d122417d08f142061832985f98b29015ddd9
    split: train
    legal_domain: environment_resources
    client_role: 接受调查的环境检测公司总经理及实际经营者罗某慧
    consultation_stage: 接到公安机关通知并接受调查后、刑事审判前
    opening: 我是一家环境检测公司的总经理和实际经营者。公司部分报告涉嫌数据造假，我已按公安通知接受调查，想如实梳理单位、我和各部门人员的行为边界。
    admission_reason: 单一实际经营者角色、部门分工、三类造假方式、报告和客户范围及到案经过均有来源支持，可逐人区分主管与直接责任。
    facts:
      - client_belief: 公司在2019年12月取得检验检测机构资质，我是总经理、实际经营者并负责全面管理。
        court_record: 检测公司于2019年12月取得检验检测机构资质；罗某慧为总经理和实际经营者，负责公司全面管理。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "于2019年12月取得《检验检测机构资质认定证书》"}
          - {section: basic_facts, quote: "罗某慧系该公司总经理、实际经营者，负责公司全面管理工作"}
      - client_belief: 具体采样、分析和报告编制分别由相应部门主管负责，我主要负责全面管理，因此我认为自己不会被评价为公司直接负责的主管人员。
        court_record: 罗某慧作为总经理、实际经营者负责全面管理，并默许、放任各业务部门弄虚作假，可被评价为单位犯罪中直接负责的主管人员。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "罗某慧系该公司总经理、实际经营者，负责公司全面管理工作"}
          - {section: basic_facts, quote: "罗某慧、吴某平默许、放任各业务部门弄虚作假"}
          - {section: adjudication, quote: "罗某慧等2人作为检测公司直接负责的主管人员"}
      - client_belief: 公司曾不开展采样分析就直接出数据，也有不实或选择性记录原始数据、纸质与电子记录不一致的情况。
        court_record: 2020年至2021年8月，检测公司采取未采样分析即出具数据、不真实或选择性记录原始数据、纸质与电子记录不一致等方式伪造或篡改监测数据。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "采取未开展采样分析直接出具监测数据、故意不真实记录或选择性记录原始数据、纸质原始记录与电子储存记录不一致等多种伪造或篡改监测数据的手段"}
      - client_belief: 公司的事由公司统一承担，五名人员即使岗位不同，个人责任也只能按同一标准处理。
        court_record: 责任评价区分直接负责的主管人员与具体采样、检测、报告业务的直接责任人员，不能因单位犯罪而抹平个人岗位和行为差异。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "罗某慧等2人作为检测公司直接负责的主管人员，被告人罗某鹏等3人作为检测公司出具环境检测报告的直接责任人员"}
      - client_belief: 经核验有80份环境检测报告存在弄虚作假，涉及45家排污单位。
        court_record: 经核验，检测公司出具的80份环境检测报告存在弄虚作假，涉及45家排污单位且涉案金额巨大。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "检测公司出具的80份环境检测报告存在弄虚作假，涉及45家排污单位，涉案金额巨大"}
      - client_belief: 吴某平负责行政、财务和销售，罗某鹏负责实验室数据分析，郑某钊负责采样取数，练某春负责编写报告。
        court_record: 吴某平管理行政、财务和市场销售，罗某鹏、郑某钊、练某春分别负责实验室分析、现场采样取数和报告编制。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "吴某平系该公司法定代表人及行政副总，负责公司行政、财务以及市场部销售业务"}
          - {section: basic_facts, quote: "罗某鹏系该公司实验室主管，负责实验室原始数据检测分析；被告人郑某钊系该公司采样部主管，负责现场采样及数据提取；被告人练某春系该公司质量部主管，负责编写出具检测报告"}
      - client_belief: 我和吴某平、郑某钊、练某春接到公安机关电话后主动前往接受调查。
        court_record: 罗某慧、吴某平、郑某钊和练某春接到公安机关电话通知后主动接受调查。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "罗某慧、吴某平、郑某钊、练某春接到公安机关电话通知后主动接受调查"}
      - client_belief: 公司在2020年至2021年8月间为了获取更多客户和利润，在检测业务中采用了这些虚假方式。
        court_record: 检测公司于2020年至2021年8月为获取更多客户和利润，在环境检测业务中弄虚作假。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2020年至2021年8月，为获取更多客户和利润，检测公司在开展环境检测业务过程中弄虚作假"}
    expected_inquiries:
      - 公司以获取更多客户和利润为经营目标时，谁决定或默许采用虚假检测方式；全面管理、财务销售、采样、实验分析和报告编制的签批链条如何？
      - 不采样直接出数据、选择性记录和纸电不一致分别发生在哪些报告，由谁提出或放任？
      - 公司质量控制、原始数据留存和报告复核规则如何，哪些控制在实际中失效？
      - 80份报告、45家排污单位和涉案金额如何逐项对应，有无正常报告被错计？
      - 我与其他人员各自何时知道造假、能否制止、实际参与和获利情况如何？
      - 电话通知、主动到案、供述、认罪认罚、退缴和整改材料分别处于何种状态？
    memo_expectations:
      - 先核对单位是否故意以多种方式伪造或篡改监测数据，再评价单位刑事责任。
      - 将公司的获客获利动机与每个人的知情、决定、默许和具体业务行为分开证明，依据管理权限和分工区分直接负责的主管人员与其他直接责任人员。
      - 结合报告数量、客户范围、涉案金额和持续时间审查情节，并逐份排除正常检测业务。
      - 对每人的决策、知情、实施、制止能力和获利分别建表，不用单位总体行为代替个人证明。
      - 独立核验电话通知后主动接受调查、如实供述和认罪认罚等条件，不把集体情节自动套用到每个人。
      - 提出停止问题报告使用、通知委托方复检、保全原始数据和改造质控机制的合法补救方案。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 换用来源对单一客户罗某慧的职务、管理权限和主动到案均有明确记载；不再用公司及六人的聚合数据冒充某一负责人的个人事实。

  - id: lsg_cn_0050
    source_line: 112
    source_case_sha256: dce6eab5b384811c01656a89a374325efaecbe417a9ab07a562e63d1e62cfd61
    split: train
    legal_domain: environment_resources
    client_role: 因养殖粪水污染饮用水被追责的合作社法定代表人张某伦
    consultation_stage: 排污和损失调查完成后、刑事审判前
    opening: 养殖场未经有效处理排放粪污，最终影响地下水和饮用水。我参与过排放安排，现在合作社和个人都面临刑事责任，需要判断各自作用和损害范围。
    admission_reason: 单位排污、负责人安排、迁移路径、饮用水后果和损失完整，适合单位与主管人员责任。
    facts:
      - client_belief: 养殖废水不是工业危险废物，通过地下溶洞渗流就不会构成污染环境犯罪。
        court_record: 未经处理严重超标的养殖粪水经地下水污染饮用水并造成严重后果，仍可构成污染环境罪。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "多次直接向自然界排放未经处理的生猪养殖粪水等有害物质"}
          - {section: adjudication, quote: "构成污染环境罪"}
      - client_belief: 排放由员工具体操作，我作为法定代表人只是许可安排，不属于直接负责的主管人员。
        court_record: 许可、安排并参与实施违法排污的法定代表人可认定为直接负责主管人员。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "在法定代表人张某伦的许可和安排下"}
          - {section: adjudication, quote: "张某伦系实施污染环境行为直接负责的主管人员，其参与实施违法排污"}
      - client_belief: 2020年8月至2022年3月污染处理设施没有有效运行。
        court_record: 2020年8月至2022年3月，养殖合作社在生猪养殖期间未有效运行污染处理设施。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2020年8月至2022年3月"}
          - {section: basic_facts, quote: "未有效运行污染处理设施"}
      - client_belief: 合作社私挖储存池、私设管道，多次排放严重超标粪水。
        court_record: 合作社通过私挖粪污储存池、私设管道，多次直接排放未经处理且严重超标的养殖粪水。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "通过私挖粪污储存池、私设管道的方式"}
          - {section: basic_facts, quote: "多次直接排放未经处理且严重超标的养殖粪水"}
      - client_belief: 粪水通过溶洞、渗坑进入地下水，三次污染饮用水源。
        court_record: 养殖粪水经喀斯特地形中的溶洞、渗坑流入地下水系，并三次污染饮用水水源。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "通过溶洞、渗坑，流入地下水系，三次污染饮用水水源"}
      - client_belief: 污染导致集中取水中断数月，造成公私财产损失160万余元。
        court_record: 涉案污染导致乡镇集中式饮用水水源取水中断数月，造成公私财产损失160万余元。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "造成乡镇集中式饮用水水源取水中断数月"}
          - {section: basic_facts, quote: "造成公私财产损失160万余元"}
      - client_belief: 水源中断后，水务公司为恢复供水重新安装水泵、敷设输水管道，这些应急项目可能构成损失的一部分。
        court_record: 某水务公司为恢复取水采取应急措施，包括重新安装水泵和敷设输水管道。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "为恢复取水，某水务公司采取应急取水措施，重新安装水泵、敷设输水管道等"}
    expected_inquiries:
      - 设施运行日志、排放口、管道和储存池由谁设计决定并实际操作？
      - 污水检测的采样、超标指标和排放次数如何证明，样品与场所能否对应？
      - 地下水迁移和三次饮用水污染之间有何监测、专家和排他性因果证据？
      - 160万余元损失包含哪些应急工程和财产项目，计算是否可核验？
      - 合作社及个人是否停止排污、修复、赔偿并具备认罪认罚或合规整改条件？
      - 应急水泵和输水管道支出是否为恢复供水所必要，合同、发票、验收和使用期限能否逐项核实？
    memo_expectations:
      - 说明污染环境罪不以工业危险废物为限，应评价有害物质、排放方式和严重后果。
      - 建立排污、喀斯特地下水迁移、饮用水中断和损失的因果证据链。
      - 分别分析合作社单位责任与法定代表人许可安排、参与实施的个人责任。
      - 核验损失范围和情节严重标准，避免把所有治理费用未经审查计入。
      - 提出停止排污、修复、赔偿、整改和认罪认罚的合规处置方案。
      - 对应急取水、水泵和输水管道支出分别审查必要性、因果关系和凭证，形成可复核的财产损失范围。
    editorial_review: *full_review
    editorial_note: 负责人主动披露许可安排而非机械否认；差异是养殖粪水和主管人员身份的法律评价，关键因果仍要求律师核验。

  - id: lsg_cn_0051
    source_line: 115
    source_case_sha256: 23aaf5338cbc30d8e55b45ff53bcde21b1d119affa7b2a8444971cc180583d3e
    split: train
    legal_domain: environment_resources
    client_role: 发现新物种水韭面临邻近施工威胁的农业农村局
    consultation_stage: 禁止令申请已提交且法院完成实勘、约谈和专家咨询后、裁定作出前
    opening: 我们已经就新发现的水韭面临施工影响提交生态环境禁止令申请，法院正在审查。施工地点离其生长地很近，我们想把现实风险、紧迫性和请求范围说明准确。
    admission_reason: 保护价值、种群脆弱性、施工距离、具体风险和预防请求完整，适合预防性环境司法。
    facts:
      - client_belief: 新物种刚被发现，尚未单独列入名录，所以没有可保护的法定生态利益。
        court_record: 我国水韭属所有种均为国家一级重点保护植物，新物种具有重要科研和多样性价值。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "水韭属（所有种）均被列为国家Ⅰ级重点保护植物"}
          - {section: adjudication, quote: "具有重要的科学研究和物种多样性保护价值"}
      - client_belief: 只有生态损害已经实际发生并可量化，法院才能制止施工，单纯重大风险不足。
        court_record: 对现实、紧迫且可能造成难以弥补后果的重大风险，可采取预防性禁止措施。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "已经对长兴水韭物种生存造成现实而紧迫的重大风险，不及时制止将对生物多样性造成难以弥补的后果"}
      - client_belief: 合作社在生长地仅十余米处实施景观提升工程。
        court_record: 某村合作社正在距离长兴水韭生长地仅十余米处实施景观提升工程。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "正在距离长兴水韭生长地仅十余米处实施景观提升工程"}
      - client_belief: 现场人员流动大，并有淤泥堆积和大量扬尘。
        court_record: 长兴水韭生长地附近人员流动大，现场存在淤泥堆积和大量施工扬尘。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "附近人员流动大、淤泥堆积、存在大量扬尘"}
      - client_belief: 专家和现场勘查显示种群极小、生境极为脆弱。
        court_record: 法院在实地勘察、约谈双方并咨询专家后，确认长兴水韭现存种群极小、生境极为脆弱。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "经实地勘察、约谈当事人以及咨询专家"}
          - {section: adjudication, quote: "现存种群极小、生境极为脆弱"}
      - client_belief: 经法院约谈后，我们与合作社已形成生态保护项目意向；临时禁止应具体针对施工扬尘、人员踩踏等破坏生境行为，而不是无限期停止所有活动。
        court_record: 农业农村局与合作社已形成长兴水韭生态保护项目意向；在项目启动前，可以具体禁止施工扬尘、人员踩踏等足以破坏其生存环境的行为。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "人民法院结合当事人达成长兴水韭生态保护项目意向的情况"}
          - {section: adjudication, quote: "包括但不限于周边施工向长兴水韭生存环境扬尘、人员行走踩踏长兴水韭等"}
      - client_belief: 该植物于2023年首次发现，之后被确认是全球未报道的新物种，并在专业期刊正式发表。
        court_record: 长兴水韭于2023年首次发现，确认为新物种后于2024年4月在植物多样性保护领域主流期刊发布。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "2023年，一种水韭植物在长兴县域某村被首次发现，后被确定为全球从未报道过的新物种，定名为长兴水韭"}
          - {section: basic_facts, quote: "于2024年4月在植物多样性保护研究领域主流期刊正式发布"}
    expected_inquiries:
      - 新物种鉴定、发表、保护名录归属和现存种群调查材料是否完整？
      - 施工主体、范围、期限、审批和距生境位置如何精确测绘？
      - 扬尘、垃圾、淤泥和踩踏对水韭的现实风险有何专家意见？
      - 不立即制止可能造成何种难以弥补后果，紧迫性如何证明？
      - 你们已经申请禁止哪些具体施工或人员活动、希望持续到何时，合作社对保护项目意向和临时整改范围作了什么回应？
      - 新物种鉴定和正式发表的时间、专家团队及原始调查材料，能否与现场种群和保护名录归属相互印证？
    memo_expectations:
      - 论证长兴水韭的重点保护属性、科研及生物多样性价值。
      - 以极小种群、脆弱生境和邻近施工证明现实紧迫重大风险。
      - 说明环境预防原则允许在不可逆损害发生前采取禁止措施。
      - 将禁止行为具体化并设置与保护项目衔接的期限，避免过度限制。
      - 组织实勘、测绘、专家意见和施工资料，形成可执行监督方案。
      - 将新物种发现、鉴定发表与水韭属法定保护地位分别证明，避免以“新发现”直接替代保护属性和科学价值论证。
    editorial_review: *full_review
    editorial_note: 咨询快照固定在禁止令申请后、裁定前；opening只披露新物种、邻近施工和法院正在审查，不提前给出极小种群、实勘约谈、专家咨询或保护项目意向。禁止令发出、签约启动保护项目、调解和验收均未写入可见或隐藏事实；差异准确检验保护归属和预防性禁止令门槛。

