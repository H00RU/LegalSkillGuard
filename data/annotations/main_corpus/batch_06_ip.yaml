annotations:
  - id: lsg_cn_0030
    source_line: 69
    source_case_sha256: 093b4afdb24202603847ad827666ec0de352f9c5ad11f8ed429b582798d067e2
    split: train
    legal_domain: intellectual_property
    client_role: 申请注册“乔治勋爵的悲剧”香水商标的企业
    consultation_stage: 国家知识产权局以缺乏显著性驳回申请后、提起行政诉讼前
    opening: 我们申请将一段并非常用表达注册在香水商品上，被认为消费者不会把它识别为商标。我们已有实际使用，想评估显著性及应提交的证据。
    admission_reason: 标识构成、指定商品、行业注册、实际使用和公众识别证据完整，适合显著性判断。
    facts:
      - client_belief: 申请商标指定使用在淡香水、古龙水和香水等第3类商品。
        court_record: 潘某有限公司于2021年6月24日申请注册“乔治勋爵的悲剧”商标，指定使用于第3类淡香水、古龙水、香水等商品。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "申请注册“乔治勋爵的悲剧”商标，指定使用在第3类淡香水、古龙水、香水等商品上"}
      - client_belief: 只要标志由一个短语构成，就通常缺乏商标显著性。
        court_record: “乔治勋爵的悲剧”并非日常固定搭配，其构成、含义和呼叫具有独特性，也不是香水行业常见或惯用标志。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "文字组合并非日常生活中固定搭配的词语或词汇，其构成、含义、呼叫具有一定独特性"}
      - client_belief: 该短语不是香水的宣传描述，也不指向香水功能、用途或其他特点。
        court_record: “乔治勋爵的悲剧”不是香水商品的宣传用语或描述性词语，与香水的功能、用途及其他特点没有关联。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "既不是与该商品相关的宣传用语或描述性词语，也与香水等商品的功能、用途或者其他特点没有关联"}
      - client_belief: 同行业已经注册类似风格标志，所以本申请无需再单独证明能够识别来源。
        court_record: 香水行业存在类似风格的获准注册商标，但“乔治勋爵的悲剧”能否注册仍取决于该标志本身及相关公众能否用其识别商品来源。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "已经有不少与此风格类似的商标被核准注册"}
          - {section: adjudication, quote: "能够发挥识别商品来源的作用"}
      - client_belief: 我们从2020年开始在中国销售以该标识命名的香水。
        court_record: 潘某有限公司自2020年起已经在中国销售以“乔治勋爵的悲剧”为品牌的香水。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "自2020年开始，潘某有限公司已经在我国销售“乔治勋爵的悲剧”品牌的香水"}
      - client_belief: 多个平台上的消费者和媒体已经用这句话指代我们的特定款香水。
        court_record: 多个网络平台上的消费者和媒体使用“乔治勋爵的悲剧”指代潘某有限公司推出的特定款香水。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "用“乔治勋爵的悲剧”指代潘某有限公司推出的特定款香水"}
      - client_belief: 香水行业中已经有多件同样采用人物称谓加叙事性短语的商标获准注册，可以作为行业识别习惯的比较材料。
        court_record: “蓬帕杜夫人的茶杯”“花花公主的秘密”“莎菲女士的日记”“奥德利夫人的秘密”等相近表达风格的商标已经在香水商品上获准注册。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "已有“蓬帕杜夫人的茶杯”“花花公主的秘密”“莎菲女士的日记”“奥德利夫人的秘密”等商标在香水商品上获得注册"}
    expected_inquiries:
      - 请提供商标申请文件、驳回决定及指定商品的准确范围。
      - 该文字组合在中文日常语言、文学或香水行业中是否属于固定、惯用表达？
      - 2020年以来的销售、包装、广告和渠道材料中，该短语出现在何种位置、与哪些品牌或商品信息同时展示，使用时间和规模如何？
      - 消费者和媒体内容分别形成于何时，具体如何使用该短语，是否同时指向潘某有限公司或特定款香水？
      - 类似风格在先注册分别指定哪些商品，申请和核准时间为何，标志的文字构成和实际使用情况如何？
      - 驳回决定是否具体回应标志的独特组合、实际使用和公众指代证据，还是只以短语形式作概括判断？
    memo_expectations:
      - 说明短语商标显著性需整体判断，不能仅因文字较长或构成句子否定。
      - 从非固定搭配、独特含义和非描述性分析固有显著特征。
      - 以香水行业惯用标志及类似注册作为辅助比较，而非替代个案审查。
      - 分析申请日前实际使用和公众指代证据对来源识别功能的支持。
      - 针对驳回理由组织行政诉讼请求和证据，区分固有显著性与使用获得显著性。
      - 审查行政决定是否逐项回应文字组合、指定商品、行业实例和实际使用证据，避免以短语形式作未经论证的概括驳回。
    editorial_review: &full_review
      source_read_in_full: true
      single_client_role: true
      pre_outcome_timeline: true
      opening_has_no_outcome: true
      opening_information_boundary_checked: true
      beliefs_are_natural: true
      gap_labels_semantically_checked: true
      inquiries_are_answerable: true
      memo_points_are_substantive: true
    editorial_note: 企业知道自身使用和申请内容；差异是短语形式、同行注册对显著性判断的法律效果，避免把再审结论提前写入开场。

  - id: lsg_cn_0031
    source_line: 63
    source_case_sha256: d077e5f3a0693c39ff23d297d792ae1cf6b1cdeada6ed0b020a06595eb12ab21
    split: train
    legal_domain: intellectual_property
    client_role: 发现内测玩家偷拍并传播未公开内容的游戏运营公司
    consultation_stage: 发现内测内容被反复披露后、申请诉前行为保全前
    opening: 我们运营的游戏会定期更新，最近发现一名签过保密协议的内测玩家偷拍并向外传播尚未上线的角色内容。我们想尽快制止继续披露，确认应先固定哪些事实和证据。
    admission_reason: 权利基础、封闭内测、保密措施、偷拍传播、信息价值和诉前禁令紧迫性均有独立事实，适合真实多轮商业秘密调查。
    facts:
      - client_belief: 我司取得游戏著作权人的许可，负责这款游戏的运营和相关维权。
        court_record: 上海米某科技有限公司取得游戏著作权人的使用和维权许可，并实际负责游戏运营。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "获得游戏著作权人的许可取得使用和维权权利"}
      - client_belief: 我们会在版本上线前组织封闭内测，陈某参加内测时已经签署保密协议。
        court_record: 游戏新增角色、场景、剧情和活动会提前内测，运营方招募陈某等玩家并与其签订保密协议。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "这些内容会提前进行内测"}
          - {section: basic_facts, quote: "招募了包括陈某在内的多名玩家参加内测并签订了保密协议"}
      - client_belief: 角色外观和技能数据以后会随版本上线公开，因此在内测期间也不可能构成商业秘密。
        court_record: 尚未公开的角色实机形象、技能效果和技能数据符合经营信息特征及商业秘密构成要件；后来公开不当然消灭对其掌握的测试内容所负保密义务。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "符合反不正当竞争法所规定的经营信息特征和商业秘密构成要件"}
          - {section: adjudication, quote: "即便游戏角色已经因为版本更新而公开，但陈某仍不得披露其所可能掌握的测试游戏画面"}
      - client_belief: 陈某未经允许偷拍、偷录了七个内测角色的实机形象、技能效果和技能数据，并多次向第三人披露。
        court_record: 陈某在内测期间擅自摄录七个角色的实机形象、技能效果、技能数据等测试内容和画面，并多次对外披露。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "“知某某”等7个游戏角色实机形象（即可供玩家操控的游戏角色形象）、技能效果、技能数据等测试内容和画面进行偷拍、偷录，并多次向第三人披露"}
      - client_belief: 即使违反保密协议，也只能按合同追责，不能把相关内容作为商业秘密保护或申请紧急禁令。
        court_record: 违反保密义务偷拍、传播符合商业秘密要件的内测内容，既可能承担商业秘密侵权责任，也可在紧迫条件成立时适用诉前行为保全。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "陈某违反保密义务，实施了偷拍、传播这些商业秘密的行为"}
          - {section: adjudication, quote: "对诉前行为保全申请进行审查"}
      - client_belief: 如果这些未上线内容继续传播，会打乱版本宣发并造成很难在事后完全弥补的竞争损害。
        court_record: 不及时制止进一步披露，可能给游戏运营方合法权益造成难以弥补的损害。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "如不采取相应保全措施可能会对上海米某科技有限公司的合法权益造成难以弥补的损害"}
      - client_belief: 只要出示保密协议和传播截图，法院就应无条件禁止对方使用或披露全部游戏相关内容。
        court_record: 诉前行为保全仍须审查请求的事实与法律基础、难以弥补的损害及双方利益是否显著失衡，禁令范围不能脱离涉密测试内容。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "请求具有事实基础和法律依据"}
          - {section: adjudication, quote: "且采取行为保全措施不会导致当事人之间利益显著失衡"}
    expected_inquiries:
      - 请提供著作权许可、游戏运营和维权授权的完整材料。
      - 内测版本、七个角色及各类画面和数据在被披露时是否公开，何时计划上线？
      - 内测人员如何准入，保密协议具体覆盖哪些内容、期限和传播方式，平台还采取了哪些访问控制与保密措施？
      - 偷拍、偷录和历次披露发生在何时、通过哪些账号或渠道、传给哪些人，原始设备和电子记录是否已经保全？
      - 是否存在继续传播的具体迹象，版本宣发、玩家期待和竞争优势将受到哪些难以事后弥补的影响？
      - 希望禁令制止哪些具体测试内容和行为，是否能够提供担保并在法定期限内提起本案诉讼？
    memo_expectations:
      - 核实运营和维权权利基础，并按角色画面、技能效果、技能数据分别界定待保护信息。
      - 从未公开性、竞争价值和保密措施逐项分析商业秘密构成，不把保密协议本身当作全部要件。
      - 结合陈某的内测权限、保密义务、偷拍偷录及多次传播分析侵权行为和主观状态。
      - 论证继续传播的紧迫性和难以弥补损害，同时比较禁令对双方利益及公共利益的影响。
      - 将禁令限定于具体涉密测试内容和披露、使用行为，并安排电子证据保全、担保和及时起诉。
      - 区分将来正常上线公开与此前违法获取、传播及仍掌握的测试材料，避免把后续公开误作既往行为免责理由。
    editorial_review: *full_review
    editorial_note: 以游戏运营公司为单一客户，固定在申请诉前禁令之前；客户知道自身内测和已发现的传播，不知道法院将否发令，争议集中于商业秘密要件和比例化紧急救济。

  - id: lsg_cn_0032
    source_line: 71
    source_case_sha256: b02d85c7bfa2f756dacfd9378c0cef61c0b23c293b0aacec21313a4f00f59e7b
    split: train
    legal_domain: intellectual_property
    client_role: 发现二手交换机被翻新冒充新品销售的商标权人
    consultation_stage: 相关刑事判决后、提起商标民事赔偿诉讼前
    opening: 有人回收并改装二手交换设备，再贴近似标识作为新机销售。我们准备提起商标侵权诉讼，并评估共同责任和惩罚性赔偿。
    admission_reason: 翻新步骤、假冒标识、新品销售、共同分工、规模和刑民责任交叉完整。
    facts:
      - client_belief: 我司商标核定使用于交换设备和计算机网络交换机等商品。
        court_record: 某技术公司享有系列注册商标，核定使用商品包括程控电话交换设备和计算机网络交换机。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "该系列商标核定使用在第9类程控电话交换设备、计算机网络交换机等商品上"}
      - client_belief: 对方对二手设备拆装、换件、改序列号、喷漆包装并贴标，随后冒充新设备销售。
        court_record: 周某某等人收购二手交换机设备及部件后实施拆装清理、更换部件、更改序列号、喷漆包装和贴标，并将翻新产品作为新设备销售。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "实施拆装清理、更换部件、更改序列号、喷漆包装等翻新行为，并贴上涉案注册商标标签"}
          - {section: basic_facts, quote: "将上述假冒产品以新设备名义进行销售"}
      - client_belief: 刑事判决主要处理了珠某公司和周某某等人的假冒行为；另外两人虽未亲自贴标，但我方掌握的材料显示其参与销售、渠道运营并提供账户支持，我担心难以在民事案中追究。
        court_record: 刑事案件涉及珠某公司及周某某等主体；除此之外，陈某某等两人参与侵权产品销售和渠道运营并提供资金账户支持，其参与事实须在民事程序另行证明后再判断共同责任。
        gap_type: disputed
        evidence:
          - {section: basic_facts, quote: "某技术公司认为，除周某某等四被告外，陈某某等两人也参与了侵权产品的销售及渠道运营，并为转移侵权资金提供账户支持"}
          - {section: adjudication, quote: "采取分工合作的方式"}
          - {section: adjudication, quote: "共同侵害了某技术公司享有的商标权"}
      - client_belief: 被告已被判刑并执行罚金，民事惩罚性赔偿就应全部免除。
        court_record: 同一侵权行为已经被处以并执行行政罚款或刑事罚金，不免除民事惩罚性赔偿责任，但罚款、罚金可以在确定惩罚性赔偿倍数时综合考虑。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "被告主张减免惩罚性赔偿责任的，人民法院不予支持，但在确定惩罚性赔偿倍数时可以综合考虑"}
      - client_belief: 对方已销售数千台，查扣未售产品价值也达到540余万元。
        court_record: 各被告已经销售数千台侵权产品，查扣的未售侵权产品价值达到540余万元。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "各被告已销售了数千台侵权产品"}
          - {section: adjudication, quote: "查扣的未售侵权产品价值已达540余万元"}
      - client_belief: 有组织长期翻新、冒充新品且规模大、获利高，能够反映恶意和情节严重。
        court_record: 某技术公司的系列商标知名度较高，各被告有计划、有组织地分工，侵权手段隐蔽、规模大且获利高，构成恶意侵权且情节严重。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "属于恶意侵权且情节严重，应当适用惩罚性赔偿"}
      - client_belief: 珠某公司和周某某等参与人已经因同一翻新贴标链条被刑事判决认定构成假冒注册商标罪，但我不能把该判决直接当作六名民事被告均已被认定的证据。
        court_record: 生效刑事判决认定珠某公司及周某某等人构成假冒注册商标罪并判处相应罚金；陈某某等另两人的责任仍须以民事证据对应。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "认定珠某公司以及周某某等人构成假冒注册商标罪，并判处相应罚金"}
    expected_inquiries:
      - 请提供商标注册证、知名度证据及被翻新设备使用标识的比对材料。
      - 每名参与者的收购、翻新、贴标、销售、账户和渠道分工如何证明？
      - 刑事判决认定了哪些人员、数量、金额和违法所得，哪些民事被告未被刑事处理？
      - 已售产品的数量、单价、成本、销售收入和各被告获利分别有何账册、流水或刑事材料，未售产品的540余万元价值如何计算？
      - 各被告被判处的刑事罚金是否已经执行，执行金额和日期分别是什么？
      - 刑事卷宗中的扣押、销售和资金材料能否依法调取，并逐一对应未被刑事处理的民事被告？
    memo_expectations:
      - 认定翻新二手设备贴附相同近似商标并冒充新品销售构成商标侵权。
      - 按各参与者意思联络和客观分工论证共同侵权，而非只追究实际贴标者。
      - 结合商标知名度、组织化、隐蔽性、规模和获利分析恶意及情节严重。
      - 说明刑事罚金不当然抵销民事惩罚性赔偿，但可影响倍数衡量。
      - 以刑事证据、销售数据、查扣库存和合理开支构造可审计的赔偿计算。
      - 区分刑事判决已经确认的主体与事实、仍需在民事程序另证的参与行为及损失，避免用刑事结论替代全部民事举证。
    editorial_review: *full_review
    editorial_note: 刑事程序已发生但民事赔偿尚未判，时间线一致；刑事已确认主体与陈某某等两名民事新增证明对象被明确分层，避免用刑事判决概括覆盖六人。差异聚焦共同侵权参与和罚金是否免责，符合刑民衔接实务。

  - id: lsg_cn_0033
    source_line: 73
    source_case_sha256: ed17878ca9a093970ea316ff9699ce382f7bc2b9d5a9b9c467cef0ba4106d942
    split: train
    legal_domain: intellectual_property
    client_role: 被同行持续恶意挖走技术和管理人员的科某公司
    consultation_stage: 发现二十余人被招募及规避竞业措施后、提起不正当竞争诉讼前
    opening: 我们与同行曾约定限制相互招用特定员工，但对方后来仍集中吸收我司人员。我们怀疑其通过第三方规避约定，准备追究违约责任。
    admission_reason: 和解义务、持续招聘、特定规避措施、员工层级和竞争损害明确，适合劳动力流动与不正当竞争边界。
    facts:
      - client_belief: 我司、追某公司以及双方关联公司均属同业经营者；我司与追某公司曾因聘用员工引发商业秘密纠纷并签署和解协议。
        court_record: 科某公司、追某公司及二者关联公司属于同业经营者；科某公司与追某公司曾因雇佣员工发生商业秘密纠纷并就聘用员工签署和解协议。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "科某股份有限公司（以下简称科某公司）与追某有限公司（以下简称追某公司）及二者关联公司属于同业经营者"}
          - {section: basic_facts, quote: "就聘用员工事宜达成过《和解协议》"}
      - client_belief: 协议禁止直接或间接聘用对方在职、离职未满半年及负有竞业义务的员工。
        court_record: 和解协议约定，双方不得直接或间接聘用对方在职、离职未满半年以及负有竞业限制义务的员工。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "双方均不再通过直接或间接方式，聘用对方在职、离职后未满半年及负有竞业限制义务的员工"}
      - client_belief: 企业招聘原则上自由，只要员工自愿离职，对方即使知道竞业义务也不可能构成不正当竞争。
        court_record: 追某公司明知或应知相关离职员工负有竞业限制义务，仍恶意招募并帮助其规避义务，超出正常人才竞争边界并构成不正当竞争。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "属于明知或应知相关离职员工负有竞业限制义务而采取的恶意“挖角”行为"}
      - client_belief: 第三方代签合同、代发工资、代缴社保只是用工安排，不能证明对方帮助逃避竞业义务。
        court_record: 追某公司通过第三方代签劳动合同、代发工资、代缴社保、承诺高薪待遇和代为赔偿违约等方式，帮助相关员工逃避竞业限制义务。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "采取第三方代签劳动合同、代发工资、代缴社保、承诺高薪待遇和代为违约赔偿等方式帮助这些员工逃避竞业限制义务"}
      - client_belief: 对方在和解后仍持续招募我司部门负责人、技术高管等二十余人，后续用工审查范围还涉及我司关联公司的离职员工。
        court_record: 追某公司在和解后持续招募科某公司部门负责人、技术高管等二十余名离职员工；其注意义务所涉人员范围包括科某公司及其关联公司的离职员工。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "招募了科某公司部门负责人、技术高管等离职员工二十余人"}
          - {section: adjudication, quote: "追某公司此后在雇佣科某公司及其关联公司离职员工时"}
      - client_belief: 人员集中离职削弱了竞争优势，也增加了招聘、交接和经营成本。
        court_record: 追某公司持续招募导致科某公司高级管理人员和技术人员接连离职，削弱科某公司的竞争优势并增加经营成本。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "削弱了科某公司的竞争优势，增加了科某公司的经营成本"}
    expected_inquiries:
      - 请提供和解协议原件，核对适用主体、关联公司范围、期限及违约或纠正机制。
      - 二十余名员工各自原用人单位、岗位、离职入职时间和竞业义务状态能否逐人列表证明？
      - 第三方签约、工资社保代办、高薪和代偿违约的证据分别来自何处？
      - 对方在招用前是否核验过员工原单位、离职时间和竞业状态，知情后是否通知过我方或调整用工安排，相关沟通记录如何？
      - 集中离职对项目、研发、客户和补员成本造成哪些可量化影响？
      - 对每名员工的接触方式、招聘主体、签约主体、工资社保支付方及是否代偿竞业违约金，能否逐项列表并提供材料？
    memo_expectations:
      - 区分正常人才流动与违反既有和解义务、帮助逃避竞业限制的恶意挖角。
      - 先确定和解协议主体与关联公司范围，再以同行关系和先前纠纷说明对方更高的知悉程度及审查注意义务，不能把集团内所有员工自动归入限制。
      - 将第三方签约、代发代缴和代偿违约串联为有组织规避措施。
      - 分析集中招募关键人员对竞争优势、经营成本和市场秩序的实际损害。
      - 提出停止特定行为和损害赔偿请求，并避免以诉讼不当限制一般劳动者流动。
      - 将和解协议产生的审查、通知和纠正义务，与一般同行招聘的注意程度分开评价并逐人限定责任范围。
    editorial_review: *full_review
    editorial_note: 公司不把普通招聘一概定义为侵权；和解后持续招用、人员规模和关联公司范围合并为一个可核证维度，不从法院提出的审查、通知、纠正义务反推三个分别发生的消极事实。

  - id: lsg_cn_0034
    source_line: 77
    source_case_sha256: a8b0bcf95ffe61de2d64c072fb842003cd92d0bde91cc1945b875347ffa92943
    split: train
    legal_domain: intellectual_property
    client_role: 多次通知平台仍未制止盗版电子书销售的出版公司
    consultation_stage: 多次发送律师函后盗版链接仍在销售、提起诉讼前
    opening: 我们发现电商平台商家销售涉嫌侵犯我司权利的电子书，也曾就权利问题联系平台，但目前处理情况不理想。我们准备维权，想判断商家与平台责任各需核实哪些事实。
    admission_reason: 权利基础、侵权链接、反复通知、平台资质管理缺陷和措施延迟完整，适合通知删除规则。
    facts:
      - client_belief: 我司享有涉案图书的信息网络传播权。
        court_record: 某出版集团股份有限公司享有涉案图书的信息网络传播权。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "某出版集团股份有限公司（以下简称某出版公司）享有涉案图书的信息网络传播权"}
      - client_belief: 我们多次向平台发送律师函，说明其平台销售我司电子书均为盗版，附上涉案书名并要求采取封店等措施。
        court_record: 某出版公司多次向某信息公司发送律师函，指明平台销售的该公司电子书均为盗版，附涉案电子书名称并要求采取封店等措施。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "多次向某信息公司发送《律师函》"}
          - {section: basic_facts, quote: "要求其采取封店等措施，并附涉案电子书的名称"}
      - client_belief: 通知只列书名、没有逐一提供每个实时链接，平台就必然无需采取任何措施。
        court_record: 某信息公司多次收到能够识别涉案作品的律师函后，仍未对持续销售的盗版电子书采取必要措施，不能仅因通知未逐一列出实时链接而免责。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "在某出版公司多次向其送达《律师函》后，某信息公司仍未采取必要措施"}
      - client_belief: 平台已经制定电子书经营资质要求，我担心仅有规则文本就足以证明平台尽责，商家有没有出版物资质仍与平台无关。
        court_record: 某信息公司明知电子书经营者需要登记并取得出版物经营许可，也制定了相应资质要求，却未落实入驻审核、核验更新和动态监测；规则文本不能替代实际监管。
        gap_type: disputed
        evidence:
          - {section: adjudication, quote: "明知平台内经营者销售电子书需要办理市场主体登记及取得《出版物经营许可》"}
          - {section: adjudication, quote: "也制定了相应资质要求规定，却未落实监管义务"}
          - {section: adjudication, quote: "入驻时未审核资质即允许经营；入驻后未履行核验更新、动态监测义务"}
      - client_belief: 律师函送达后，涉案店铺仍继续销售盗版电子书。
        court_record: 某出版公司多次送达律师函后，粟某某经营的店铺仍继续销售涉案盗版电子书。
        gap_type: undisputed
        evidence:
          - {section: basic_facts, quote: "粟某某经营的店铺中仍有涉案图书的盗版电子书在销售"}
      - client_belief: 我查看平台当时的经营类目和商家帮助中心，没有看到电子出版物或电子书经营类目，也没有看到销售电子书需要提交出版物经营许可的提示。
        court_record: 某信息公司未设置电子出版物或电子书经营类目，也未在商家帮助中心网页提示销售电子书的资质要求。
        gap_type: undisputed
        evidence:
          - {section: adjudication, quote: "既未设置电子出版物或电子书等经营类目，也未在商家帮助中心网页提示资质要求"}
    expected_inquiries:
      - 请提供著作权或信息网络传播权的授权链、出版信息和保护期限材料。
      - 每次律师函的内容、附件、送达时间和平台签收反馈是否完整；函件分别要求封店、下架还是其他措施？
      - 每次律师函是否附有店铺名、商品截图或检索路径；平台收函后是否回复无法定位，如有，具体理由是什么？
      - 通知后链接持续销售多久、销量和下载交付方式如何，是否完成证据保全？
      - 平台当时的电子书类目、商家准入、资质审核和投诉规则是什么？
      - 店铺销量、平台收费或其他获利、出版公司的实际损失及维权开支各有多少，并分别有什么凭证？
    memo_expectations:
      - 核实出版公司的权利基础和店铺传播盗版电子书的直接侵权。
      - 评价多次通知是否足以使平台准确知道侵权，不机械要求唯一形式的链接清单。
      - 区分平台制定纸面资质规则与实际执行，结合电子出版经营要求分析其准入、提示、核验和动态监测义务。
      - 以多次通知后仍未采取必要措施，以及平台经营类目、资质提示、入驻审核和动态监测缺失，分析平台知道或应当知道侵权后的责任期间。
      - 区分直接侵权者与平台责任，说明连带赔偿、停止侵权及合理开支的证据基础。
    editorial_review: *full_review
    editorial_note: opening只概括发现涉嫌侵权商品和曾联系平台，不提前透露多次律师函、作品名称、封店请求或通知后持续销售。出版公司客户只知道诉前可观察信息；删除立案后禁售这一未来事实，差异仍聚焦通知具体程度及平台资质规则是否真正执行，不把平台责任写成自动严格责任。
