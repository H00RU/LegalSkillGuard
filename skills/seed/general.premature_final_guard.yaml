schema_version: 1
skill_id: general.premature_final_guard
name: Premature Final Guard
version: 1.0.0
level: strategic
domain: general
status: active
description: 关键事实仍未知时阻止确定性结束，转向最高信息增益事实。
preconditions:
  - field: candidate_action.action_type
    op: eq
    value: final
  - field: state.high_critical_unknown_count
    op: gt
    value: 0
reads: [facts.status, facts.criticality, candidate_action]
operation:
  type: replace_type_and_target
  new_action_type: clarify
  target_type: fact
  target_selector: highest_information_gain_unresolved_fact
expected_effects: [reduce_premature_final, increase_critical_fact_coverage]
validators: [target_exists, question_not_repeated]
failure_modes: [endless_questioning, client_cannot_answer]
guardrails:
  max_activations_per_session: 2
  disable_if:
    - field: state.all_remaining_facts_not_available
      op: truthy
      value: true
provenance: {source: manual_seed}

