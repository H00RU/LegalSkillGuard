schema_version: 1
skill_id: general.dialogue_budget_guard
name: Dialogue Budget Guard
version: 1.0.0
level: strategic
domain: general
status: active
description: 达到咨询轮次预算且仍不足时，停止追问并明确保留结论。
preconditions:
  - field: state.turn
    op: gte
    value: 6
  - field: candidate_action.action_type
    op: in
    value: [ask, clarify, verify]
reads: [turn, max_turns, candidate_action]
operation:
  type: force_abstain
  reason: dialogue_budget_exhausted
expected_effects: [bound_dialogue_cost]
validators: [no_hidden_fields]
failure_modes: [premature_budget_stop]
guardrails: {max_activations_per_session: 1}
provenance: {source: manual_seed}

