schema_version: 1
skill_id: general.persona_adaptation
name: Persona Adaptation
version: 1.0.0
level: atomic
domain: general
status: active
description: 对非合作或寡言客户保持单一、具体、非指责性问题。
preconditions:
  - field: state.persona
    op: in
    value: [P_WS, P_CS, P_CD]
  - field: candidate_action.action_type
    op: in
    value: [ask, clarify, verify]
reads: [persona, candidate_action]
operation:
  type: add_constraint
  constraint: single_specific_nonjudgmental_question
expected_effects: [improve_persona_robustness]
validators: [no_hidden_fields]
failure_modes: [overly_terse_question]
guardrails: {max_activations_per_session: 6}
provenance: {source: manual_seed}

