schema_version: 1
skill_id: general.conflict_clarification
name: Conflict Clarification
version: 1.0.0
level: strategic
domain: general
status: active
description: 存在可见陈述冲突时，优先澄清冲突而不是继续作结论。
preconditions:
  - field: state.unresolved_conflict_count
    op: gt
    value: 0
reads: [unresolved_conflicts, candidate_action]
operation:
  type: replace_type_and_target
  new_action_type: clarify
  target_type: fact
  target_selector: first_unresolved_conflict
expected_effects: [resolve_visible_conflict]
validators: [target_exists, question_not_repeated]
failure_modes: [client_repeats_same_claim]
guardrails: {max_activations_per_session: 2}
provenance: {source: manual_seed}

