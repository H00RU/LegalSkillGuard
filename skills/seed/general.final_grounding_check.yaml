schema_version: 1
skill_id: general.final_grounding_check
name: Final Grounding Check
version: 1.0.0
level: atomic
domain: general
status: active
description: 没有任何可佐证事实时，将最终结论改为保留意见。
preconditions:
  - field: candidate_action.action_type
    op: eq
    value: final
  - field: state.corroborated_count
    op: eq
    value: 0
reads: [facts.status, candidate_action]
operation:
  type: force_abstain
  reason: no_corroborated_fact
expected_effects: [reduce_unsupported_claim]
validators: [no_hidden_fields]
failure_modes: [overconservative_abstention]
guardrails: {max_activations_per_session: 1}
provenance: {source: manual_seed}

