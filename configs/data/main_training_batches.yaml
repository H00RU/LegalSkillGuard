schema_version: 3
design: balanced_sequential_skill_accumulation_blocks
status: frozen_for_128_case_direct_skill_accumulation
random_seed: 20260827
training_cases: 128
training_batches: 8
cases_per_batch: 16
skill_accumulation:
  mode: group_evidence_global_playbook_evolution
  first_source_batch: training_batch_01
  final_source_batch: training_batch_07
  effect_assessment: descriptive_prequential_exact_parent_increment_or_library_identity
  maintenance_interval_blocks: 2
  final_batch_generates_skills: false
design_notes:
  - 八批均为等预算顺序经验块，不是按难度从低到高安排的课程学习。
  - 128案全部属于训练流程且每案只归属一个经验块；不保留固定开发验收集，也不为单个候选占用K=4轨迹臂。
  - 每批K=4均使用同一个批首技能库且不预生成封闭调查计划；四条从首轮起使用独立采样流，不混入空技能臂。每个归因健康案件都压缩成一张完整K组证据卡；有差异时保留组内相对优劣，无差异时如实标记tie而不因收益打平丢弃案件或伪造正对照。
  - 教师每批以两个互不重叠的map调用覆盖至多16张归因健康证据卡，再以一个reduce调用合并成功/失败机制并对同一份跨法域playbook执行有界局部编辑；含系统fallback或其他不可归因干预的K组在奖励和教师结果产生前整组隔离并显式记账。候选只通过结构、来源、泄漏、法律安全和提示容量硬门，在本批结束时直接进入下一批工作库。
  - 下一未见批用精确父库配对描述上一批playbook版本增量，但单块结果不拒收、不回滚。来源资格不冒充效果证明，下一块结果也不冒充单条规则永久效应。
  - 第一至第七批均可创建或更新playbook；第八批观察第七批新增版本（若存在），候选预算固定为0，随后冻结完整累计工作库。第八批的终端开发结果不作结果驱动剪枝。
  - 每批16案覆盖13至14个法域、至少15个最高法来源页，同一来源页每批最多2案；各批事实量和新旧来源比例近似均衡。
  - 128案训练、后一块自然使用与块级prequential观察统一使用合作型P_WD；客户如实回答已匹配事实，使训练差异归因于律师策略和技能文档。四人格只用于技能库冻结后的官方外测及预声明种子稳健性分析。
  - 新playbook版本从下一批开始直接进入逐轮律师完整动作决策；来源批只提供学习证据，不把同批轨迹冒充技能效果证明。在线事实槽不是封闭问题图谱，律师可用new_visible_gap自行提出技能支持的新事实维度；K=4从首轮起使用独立策略随机流。
  - 单一playbook跨法域记录目标排序、有效问法、低收益回避和停止条件；它是方法文档而非待完成清单，不增加固定问题配额，也不能替代律师根据当前案件状态自主决策。
