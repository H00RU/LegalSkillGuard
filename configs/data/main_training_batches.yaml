schema_version: 2
design: balanced_sequential_embedded_skill_blocks
status: frozen_for_128_case_embedded_design
random_seed: 20260827
training_cases: 128
training_batches: 8
cases_per_batch: 16
candidate_validation:
  mode: embedded_next_training_block
  cluster_unit: case_id
  shared_control_per_case: true
  first_source_batch: training_batch_01
  last_validation_batch: training_batch_08
  final_batch_candidate_policy: no_candidate_generation
design_notes:
  - 八批均为等预算顺序经验块，不是按难度从低到高安排的课程学习。
  - 128案全部属于训练流程且每案只归属一个经验块；不再保留固定18案开发验收集。
  - 第二至第八批的正常K=4轨迹内嵌新候选或上一块仍待累计的候选：领域候选只进入同领域案件，通用候选按冻结顺序分摊其余案件；被分配案件保留共享对照，空余轨迹继续探索，不另跑验收对话，教师不可见该批隐藏事实。
  - 第八批强制处理全部剩余候选并冻结主技能库；不再调用教师产生无法前瞻验证的新候选。
  - 每批16案覆盖13至14个法域、至少15个最高法来源页，同一来源页每批最多2案；各批事实量和新旧来源比例近似均衡。
  - 每案采用一个预声明人格，每批四人格各4案。人格是环境压力条件，不把同案四人格交叉当作新增训练样本。
  - 候选从下一批开始作为固定会话文档真实暴露；安全正向但暴露覆盖不足者至多累计3个连续未见块，保留的技能从决策后的下一批起进入正式累积库。
