schema_version: 3
design: balanced_sequential_skill_accumulation_blocks
status: frozen_for_128_case_direct_skill_accumulation
random_seed: 20260827
training_cases: 128
training_batches: 8
cases_per_batch: 16
skill_accumulation:
  mode: source_grounded_direct_admission
  first_source_batch: training_batch_01
  final_source_batch: training_batch_08
  effect_assessment: prequential_library_level_shadow
  maintenance_interval_blocks: 2
  final_batch_generates_skills: true
design_notes:
  - 八批均为等预算顺序经验块，不是按难度从低到高安排的课程学习。
  - 128案全部属于训练流程且每案只归属一个经验块；不保留固定开发验收集，也不为单个候选占用K=4轨迹臂。
  - 每批K=4均在同一个批首技能库下独立探索；教师从完整组内差异中提出0至3个通用或领域技能。
  - 候选只要通过结构、来源、泄漏、法律安全、去重和提示容量硬门，就在本批结束时直接加入工作库，从下一批起对所有适用轨迹生效。
  - 每两批输出一次库级维护报告；效果通过下一批固定prequential空库影子和最终外测在库级评估，不以单个候选的一次小样本收益决定是否入库。
  - 第八批仍可使用最后16案生成技能，随后冻结完整工作库并仅在官方外测检验整体效果。
  - 每批16案覆盖13至14个法域、至少15个最高法来源页，同一来源页每批最多2案；各批事实量和新旧来源比例近似均衡。
  - 128案训练、后一块自然使用与块级prequential观察统一使用合作型P_WD；客户如实回答已匹配事实，使训练差异归因于律师策略和技能文档。四人格只用于技能库冻结后的官方外测及预声明种子稳健性分析。
  - 新技能从下一批开始作为固定会话文档真实暴露；来源批只提供学习证据，不把同批轨迹冒充技能效果证明。
