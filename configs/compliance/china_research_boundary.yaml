  - title: "全国人大常委会法工委：个人信息保护法解读"
    url: "https://www.npc.gov.cn/npc/c2/c30834/202108/t20210831_313317.html"
  - title: "律师事务所管理办法"
    url: "https://new.moj.gov.cn/policyManager/attach/downloadFile?realfilename=4de06d6a51b84e679eae20e14b92fd62-2021-12-31.pdf"
