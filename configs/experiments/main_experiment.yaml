seed_sensitivity:
  status: secondary_after_primary_external_test
  affects_candidate_selection: false
  affects_primary_inference: false
  primary_seed_reused: 42
  additional_dialogue_seeds: [43, 44]
  # Stable systematic sample: every fifth public CN record from the frozen order.
  # It spans 5--15 facts and 3--10 disputed facts without consulting outcomes.
  external_case_ids:
    - case_cn_0001
    - case_cn_0006
    - case_cn_0011
    - case_cn_0016
    - case_cn_0021
    - case_cn_0026
  personas: [P_WD, P_WS, P_CS, P_CD]
  report_role: secondary_sampling_robustness_only

reward:
  elicitation_weight: 0.45
  resolution_weight: 0.45
  fidelity_weight: 0.10
  extra_turn_penalty: 0.02
  repeated_question_penalty: 0.05
  premature_final_cap: 0.35
  unsupported_claim_cap: 0.25
  zero_inquiry_cap: 0.25
  hidden_field_leak_reward: 0.0

skill_evolution:
  skill_schema_version: 2
  skill_delivery_mode: fixed_session_prompt_memory
  source_split: train
  teacher_role: skill_teacher
  initial_library: skills/bootstrap
  candidate_workspace: runs/<run-id>/skills/candidates
  active_library: runs/<run-id>/skills/versions/current
  group_advantage_epsilon: 1.0e-8
  skip_low_variance_groups: true
  allow_noop: true

skill_admission:
  mode: source_grounded_direct_admission
  source_split: train
  require_no_leakage: true
  require_no_hard_safety_violation: true
  require_source_grounding: true
  reject_exact_semantic_duplicates: true
  enforce_prompt_capacity: true
  per_candidate_outcome_gate: false
  effect_assessment: downstream_library_level_only
  maintenance_interval_blocks: 2

execution:
  evolution_rounds: 8
  # 每批最多向教师提交三个彼此不同的证据机制；存在相应证据时至少覆盖一个
  # general和一个domain-specific簇。0至3是学习产量范围，不是每批强制配额。
  teacher_evidence_group_budget_per_candidate: 15
  teacher_call_budget_per_round: 3
  maximum_teacher_groups_per_case: 2
  maximum_new_skills_per_block: 3
  # This is an engineering ceiling for bounded same-model structure repair, not an
  # effect-size parameter derived from one historical trajectory. Generation stops
  # immediately on the first contract-valid action, so a healthy step uses one call.
  policy_repair_attempts: 5
  # 每次编辑仍由同一冻结模型提交完整计划对象；已经通过通用安全门的目标作为不可变状态保留，
  # 只允许模型删除、拆分或去法律化被拒目标，防止修一个坏目标时丢掉无关的合格调查维度。
  # 五轮是同一冻结模型的有限结构编辑上限而非按单个历史失败调出的效果参数；首个合格计划
  # 立即停止，达到上限仍不合格则关闭轨迹，禁止伪造或确定性替换。
  consultation_planning_attempts: 5
  client_selection_attempts: 3
  memo_generation_attempts: 3
  semantic_judgment_attempts: 2
  # Resource-bounded schema decomposition only: it never changes which frozen
  # memo spans are judged or how their classifications are merged.
  codex_timeout_seconds: 600
  codex_retries: 0
  # The hard ledger is independent of per-round scheduling and cumulative across
  # diagnostic/formal runs; it is never silently reset.  Preflight must show that
  # its live remainder covers at most three calls in each unfinished source block.
  # Existing project-wide reservations: 200. A fresh 8-block run needs at most
  # 8×3 teacher calls plus one explicit preflight call, so 225 is the smallest
  # hard limit that preserves the declared three-cluster design without fallback.
  teacher_total_invocation_budget: 225
  judge_timeout_seconds: 900
  judge_retries: 0
  # A40实测的16K上下文并发容量约9.4；16路会造成Qwen策略采样退化。
  # 8路只约束服务调度，不改变实验矩阵、随机种子或轨迹内容定义。
  rollout_workers: 8
  judge_workers: 8
  resume_completed_units: true
  fail_closed_on_incomplete_matrix: true

# This is a descriptive productivity/futility diagnostic, not a health gate or a
# target effect size. Requiring at least two independent failed checks prevents one
# weak statistic from creating a noisy alert. A weak but protocol-valid initial
# policy must still reach semantic scoring and the contrastive teacher; otherwise
# the method would be unable to learn from the failure mode it is meant to improve.
training_batch_productivity_review:
  status: frozen_predeclared_productivity_diagnostic
  expected_cases: 16
  expected_trajectories: 64
  minimum_cases_with_new_hidden_fact: 8
  minimum_trajectory_question_rate: 0.50
  minimum_trajectory_new_hidden_fact_rate: 0.20
  minimum_new_hidden_fact_per_question: 0.05
  review_if_failed_checks_at_least: 2
  action: record_diagnostic_and_continue_to_teacher_evidence

# GRPO-style relative evidence is valid only inside a complete model-attributable
# K group. A deterministic safety fallback is neither a reward-worthy bad policy
# action nor a system-wide corruption: before any semantic reward is observed, its
# complete group is quarantined from candidate attribution. The full 64-trajectory
# matrix is still scored and checkpointed for audit. Any non-local contract defect
# remains globally blocking, and more than 25% group attrition stops the batch.
training_group_attribution:
  status: frozen_pre_reward_complete_group_quarantine
  expected_groups: 16
  group_size: 4
  minimum_scoreable_groups: 12
  minimum_scoreable_group_fraction: 0.75
  action: exclude_complete_attribution_group_or_stop_before_semantic_scoring

evaluation:
  official_metrics: [fact_coverage, inquiry, elicitation, fact_resolution, issue_resolution, resolution, fidelity]
  # The main claim concerns deterministic consultation efficiency, not judge
  # prose preference.  Session ratios are paired within case/persona and
  # uncertainty is clustered by legal case. Fact coverage and Resolution remain
  # companion endpoints so a one-question early stop cannot masquerade as success.
  behavior_metrics: [question_turns, distinct_targets, answered_question_turns, information_bearing_turns, unique_disclosed_facts, unique_disclosed_facts_per_question, identified_evidence_gaps, f_or_g_signal_turns]
  safety_metrics: [premature_final_rate, unsupported_claim_rate, belief_as_fact_rate, repeated_question_rate, critical_fact_recall]
  operational_metrics: [policy_repair_rate, policy_fallback_rate, client_repair_rate, client_fallback_rate, memo_retry, memo_guardrail_intervention, memo_fallback]
  judge_diagnostics: [rubric_repair_rate, fact_repair_rate, grounding_repair_rate, rubric_normalization_rate, fact_normalization_rate, grounding_normalization_rate]
  primary_endpoint: unique_disclosed_facts_per_question
  secondary_endpoints: [unique_disclosed_facts, fact_coverage, resolution, elicitation, fidelity, critical_fact_recall]
  aggregate: paired_case_persona_mean
  multiplicity: benjamini_hochberg_secondary
  report_effect_size: true
  report_paired_95ci: true
  bootstrap_samples: 10000
  confidence_level: 0.95
  randomization_samples: 20000

freeze_order:
  - training_corpus_hash
  - prompts_and_model_revisions
  - active_skill_library_hash
  - external_evaluation
