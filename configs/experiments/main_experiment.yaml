comparison_arms:
  - arm_id: control_no_library
    active_skills: false
    inference_role: primary_control
    intervention: no_learned_experience
    description: 冻结Qwen3-8B、状态管理开启、技能库不介入。
  - arm_id: ungated_source_grounded_skills
    active_skills: true
    inference_role: explanatory_prospective_gate_ablation
    intervention: source_grounded_candidates_without_outcome_gate_under_frozen_prompt_capacity
    description: >-
      不采用下一未见块的真实使用收益与安全门禁；候选按来源批次及来源报告中的预定顺序，在与主系统
      相同的冻结提示容量内作不看效果的first-fit，不截断文档。仅作机制消融，并完整报告容量未纳入项。
  - arm_id: legal_skill_guard
    active_skills: true
    inference_role: primary_treatment
    intervention: accepted_prompt_skill_memory
    description: 相同冻结Qwen3-8B和状态管理，仅增加经前瞻门禁验收的结构化技能文档。

trajectory_sampling:
  # K=4 structured counterfactual rollout group. A shared, visible Qwen planner
  # writes the case agenda once; the four training arms form two target-matched
  # pairs. Pair members share the first target and policy random stream. At turn
  # two one member remains autonomous while the other receives a still-unasked
  # highest-ranked remaining client-answerable visible-plan target (falling back
  # to an evidence gap only when no client target remains); all later turns are autonomous. This exposes
  # both premature-stop/continue and target-choice forks without reading outcomes.
  # The same frozen lawyer formulates every question. Hidden case labels,
  # the semantic judge and the skill teacher never select these targets. Paired
  # candidate evaluation is embedded in the K matrix but does not receive forced
  # target allocation: its control/treatment use one shared, unconstrained policy
  # stream so the fixed skill-document bundle is the only policy-input intervention. External evaluation
  # also does not receive the training exploration intervention.
  group_size: 4
  counterfactual_initial_target_allocation: true
  counterfactual_initial_target_replicates: 2
  counterfactual_followup_target_allocation: true
  training_group_seeds: [42]
  # DLawBench defines four case-style cells per case and runs each once. The main
  # paired matrices therefore use one frozen dialogue seed; personas remain stress
  # conditions and uncertainty is clustered by legal case.
  external_evaluation_seeds: [42]
  # Presentation shuffling was empirically unable to produce policy forks and is
  # disabled so the source of every training contrast remains explicit.
  shuffle_equal_criticality_fact_presentation: false

# Development curves are measured prequentially on a fixed, outcome-blind
# half-block sample.  The current accepted library is already evaluated by the
# ordinary K=4 matrix; only a matching empty-library shadow is added after the
# library becomes non-empty.  These shadows never enter TF-GRPO grouping,
# candidate nomination, prospective acceptance, or the official external test.
learning_curve:
  mode: prequential_fixed_shadow
  status: frozen_before_next_formal_run
  cases_per_block: 8
  bootstrap_samples: 10000
  bootstrap_seed: 20260907
  empty_library_identity_shortcut: true
