schema_version: 1
experiment_id: legal_skill_evolve_main
status: direct_skill_accumulation_gpu_requalification_required
preparation_note: >-
  128案训练语料冻结为8批×16案；官方DLawBench中文30案只在最终技能库冻结后外测。
  固定revision的Qwen3-8B在每批批首同一技能库下完成K=4独立多轮咨询；gpt-oss-20b只承担
  客户闭集事实路由与离线语义评分；gpt-5.6-luna只从健康、同案、同提示库的高低收益轨迹差异中
  生成每批0至3个结构化技能。通用和领域证据分通道选取，领域技能不要求改善无关法域。
  候选通过格式、真实轨迹来源、隐藏信息隔离、法律安全、去重和提示容量硬门后，在本批结束时直接
  写入工作技能库，从下一批起按general+当前法域固定注入规划与逐轮决策；系统不执行技能触发器、
  目标替换或动作改写。K=4不再拆成候选有/无技能臂，也不做逐候选小样本准入检验。
  固定prequential空库影子逐批测量整个当前库的事实获取和提问效率，每两批输出库级维护报告；
  最终外测和消融负责证明整体技能库的效用。硬门只保护数据、权限和法律安全；弱律师的泛化提问、
  多问、重复等行为保留为可评分学习信号。历史调试run全部隔离，不进入训练或论文统计。
# Randomness for bootstrap/sign-flip algorithms only; this is not a dialogue matrix.
statistical_seed: 42
# This is a circuit breaker for a malformed/non-terminating policy, not a target
# dialogue length.  The lawyer policy, informed by prompt-delivered skills, chooses when to finish;
# the ceiling is hidden from their online input and any hit invalidates the rollout.
emergency_turn_ceiling: 24
# Frozen external-evaluation stress matrix. Training persona assignments are
# controlled separately and fail-closed by main_training_batches.yaml.
personas: [P_WD, P_WS, P_CS, P_CD]

data:
  training_cases: data/training/legal_skill_guard_dlawbench_style_cn.jsonl
  provenance: data/training/legal_skill_guard_dlawbench_style_cn.provenance.jsonl
  training_batches: configs/data/main_training_batches.yaml
  training_split: train
  external_evaluation: third_party/DLawBench/data/case_backgrounds/cases_cn.jsonl
  external_evaluation_status: held_out_frozen_test_not_used_for_debugging

comparison_arms:
  - arm_id: control_no_library
    active_skills: false
    inference_role: primary_control
    intervention: no_learned_experience
    description: 冻结Qwen3-8B、状态管理开启、技能库不介入。
  - arm_id: legal_skill_evolve
    active_skills: true
    inference_role: primary_treatment
    intervention: source_grounded_evolved_prompt_skill_memory
    description: 相同冻结Qwen3-8B和状态管理，仅增加训练轨迹演化所得的结构化技能文档。

trajectory_sampling:
  # K=4 follows the ordinary GRPO sampling boundary: every current-library member
  # independently samples the complete Qwen consultation policy, including its
  # visible-input-only investigation plan and subsequent actions. No program-selected
  # target is injected. This preserves real within-group exploration instead of
  # collapsing four samples into candidate-specific control/treatment cells.
  group_size: 4
  training_group_seeds: [42]
  # DLawBench defines four case-style cells per case and runs each once. The main
  # paired matrices therefore use one frozen dialogue seed. Training uses the
  # cooperative persona; personas remain external stress conditions and
  # uncertainty is clustered by legal case.
  external_evaluation_seeds: [42]
  # Presentation shuffling remains off: diversity comes from ordinary independent
  # model sampling, not programmatic list permutations.
  shuffle_equal_criticality_fact_presentation: false

# Development curves are measured prequentially on a fixed, outcome-blind,
# cooperative-persona half-block sample. The current working library is already evaluated by the
# ordinary K=4 matrix; only a matching empty-library shadow is added after the
# library becomes non-empty.  These shadows never enter TF-GRPO grouping,
# candidate nomination, skill admission, or the official external test.
learning_curve:
  mode: prequential_fixed_shadow
  status: frozen_before_next_formal_run
  cases_per_block: 8
  bootstrap_samples: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260907
