schema_version: 1
experiment_id: legal_skill_evolve_main
status: shared_opening_agenda_group_evidence_gpu_requalification_required
preparation_note: >-
  128案冻结为8批×16案；官方DLawBench中文30案只在最终库冻结后作锁定复评。
  Qwen3-8B在每批批首同一playbook下完成K=4多轮咨询；gpt-oss-20b只承担客户闭集事实选择与离线语义评分。
  每个归因健康案件的K=4被压缩为完整证据卡；两个Luna map调用完整且不重叠覆盖本批证据，
  第三个reduce调用跨案件合并成功/失败机制；首次创建唯一全局playbook时最多8个精确编辑，此后每批最多2个局部编辑。
  未命中的旧条款逐字保留；候选通过结构、来源、隐藏信息、法律安全和提示容量硬门后直接发布为下一版本。
  下一未见批以同案、同seed、同sample的精确父版本影子报告F/Q、事实数、提问数、安全及实际问答增量，
  结果用于曲线和后一轮局部修订，不拒收或回滚。第8批只观察并冻结，不生成无后续观察的新版本。
  每案由同一冻结Qwen仅凭公开opening生成一次共享、非绑定的事实调查议程，同案K=4和所有比较臂复用；
  模型只选择opening逐字主题短语和一个闭集事实属性，由代码验证并确定性生成目标，不能自由引入开场外主题。
  它不看技能、人格或隐藏事实，不规定顺序、最低轮数或下一动作。playbook、完整可见问答历史和在线状态
  直接进入逐轮律师完整动作决策；没有技能条件计划器、触发器、领域检索器或独立动作改写模型。
  客户调用前只将结构、目标身份或隐私边界等不可执行动作交给同一冻结律师有界重采样。
  复读、低效、复合或请客户作法律判断的可执行问题真实送达客户，计入提问数、重复率、奖励和教师证据；
  会话只由冻结律师自主final/abstain或隐藏熔断上限结束。
  正式四臂主表在冻结后统一运行Base、Luna-Direct、ExpeL-adapted与Ours。
# Randomness for bootstrap/sign-flip algorithms only; this is not a dialogue matrix.
statistical_seed: 42
# This is a circuit breaker for a malformed/non-terminating policy, not a target
# dialogue length.  The lawyer policy, informed by prompt-delivered skills, chooses when to finish;
# the ceiling is hidden from its online input. A hit is a complete, scoreable policy failure:
# it is not a healthy success, but it does not invalidate attribution or remove the dialogue
# from reward and teacher evidence.
emergency_turn_ceiling: 24
# Frozen external-evaluation stress matrix. Training persona assignments are
# controlled separately and fail-closed by main_training_batches.yaml.
personas: [P_WD, P_WS, P_CS, P_CD]

data:
  training_cases: data/training/legal_skill_guard_dlawbench_style_cn.jsonl
  provenance: data/training/legal_skill_guard_dlawbench_style_cn.provenance.jsonl
  training_batches: configs/data/main_training_batches.yaml
  training_split: train
  external_evaluation: third_party/DLawBench/data/case_backgrounds/cases_cn.jsonl
  external_evaluation_status: frozen_public_benchmark_previously_evaluated_aggregate_aware

# This pair belongs only to the training-run-local mechanism diagnostic.  The
# publication main table is the four-arm contract in official_baselines.yaml.
comparison_arms:
  - arm_id: control_no_library
    active_skills: false
    inference_role: primary_control
    intervention: no_learned_experience
    description: 冻结Qwen3-8B、状态管理开启、技能库不介入。
    selection_contract: empty_prompt_memory_no_runtime_selection
  - arm_id: legal_skill_evolve
    active_skills: true
    inference_role: primary_treatment
    intervention: source_grounded_evolved_prompt_skill_memory
    description: 相同冻结Qwen3-8B和状态管理，仅增加训练轨迹演化所得的单一全局playbook。
    selection_contract: one_global_playbook_no_runtime_selection

trajectory_sampling:
  # K=4 shares the same opening and batch-start library within each case group;
  # one opening-only, skill-blind, non-binding agenda is shared by K=4 and all
  # comparison arms. It exposes public-opening-grounded unknown dimensions but
  # neither selects the next action nor closes the target space. There is no
  # separate skill-conditioned planner or pre-generated closed target graph. All four rollouts use
  # independent policy decoding streams from turn one, as in group-relative
  # exploration. The frozen Qwen reads the complete fixed global playbook
  # before one complete next-action sample. A compact visible rationale is sampled
  # before categorical commitment; in that same structured call the model stops,
  # or selects one actual target from state-machine-open, unasked visible
  # targets plus the always-available new_visible_gap escape hatch
  # and realizes the target as one question. K=4 itself is the TF-GRPO action group; there
  # is no nested candidate list, skill/no-skill lottery, semantic target rewrite, or prompt
  # perturbation or hidden categorical sub-head. Complete actions use the ordinary
  # training temperature (0.7). A group is
  # allowed to contain identical actions; temperature is never raised merely to
  # manufacture a contrast.
  group_size: 4
  training_group_seeds: [42]
  training_exact_prefix_branching:
    status: frozen_before_next_formal_run
    exact_prefix_members: [0, 1, 2, 3]
    prefix_stream: 0
    branch_turns: [1]
    assignment: fixed_first_turn_independent_streams
  # DLawBench defines four case-style cells per case and runs each once. The main
  # paired matrices therefore use one frozen dialogue seed. Training uses the
  # cooperative persona; personas remain external stress conditions and
  # uncertainty is clustered by legal case.
  external_evaluation_seeds: [42]
  # Presentation shuffling remains off: diversity comes from the frozen decoding
  # streams, not programmatic list permutations.
  shuffle_equal_criticality_fact_presentation: false

# Development curves are measured prequentially on every cooperative-persona
# sample-0 cell. If B(i-1) admitted a cohort, B(i) replaces the ordinary empty
# shadow with that cohort's exact immutable parent. This uses no extra shadow arm:
# the current K=4 sample-0 cell is treatment and one parent rollout is baseline.
# All 16 implemented curve endpoints are reported. The point estimate and
# case-cluster interval describe how the immediately preceding skill increment
# behaved on one unseen block. They guide the next teacher round but never own
# skill admission, rollback or teacher eligibility. This prevents incomplete
# cohort exposure or one noisy 16-case block from deleting a source-grounded
# document and wasting the block's learning evidence. When no increment is
# pending, the current library is its own exact parent and is recorded by
# identity. B8 is the terminal development observation before external testing.
learning_curve:
  mode: prequential_fixed_shadow
  status: frozen_before_next_formal_run
  cases_per_block: 16
  bootstrap_samples: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260907
  no_pending_cohort_identity_shortcut: true
  evidence_role: development_increment_diagnostic_and_next_teacher_direction_never_external_test
  incremental_effect_diagnostic:
    status: frozen_before_next_formal_run
    timing: next_unseen_training_block_before_teacher
    comparator: exact_parent_library
    decision_role: descriptive_increment_measurement_before_teacher_never_skill_veto
    single_block_effect_can_prune_or_rollback: false
    interval_uncertainty_alone_blocks_accumulation: false
    final_block_new_skill_budget: 0
    minimum_exposed_cases_for_interpretation: 1
    global_playbook_requires_full_cohort_exposure: true
    primary_signal:
      decision_rule: primary_positive_point_estimate
      endpoints:
        - unique_disclosed_facts_per_question
      threshold: 0.0
    practical_effect_classifier:
      decision_rule: primary_benefit_practical_safety_noninferiority
      effect_direction: current_library_minus_parent_library
      primary_endpoint: unique_disclosed_facts_per_question
      primary_threshold: 0.0
      protected_endpoint_margins:
        unique_disclosed_facts: 0.0
        critical_fact_recall: 0.05
        premature_final_rate: 0.05
        unsupported_claim_rate: 0.05
        belief_as_fact_rate: 0.02
        hidden_field_leak: 0.0
        repeated_question_rate: 0.05
        policy_fallback_rate: 0.0
        client_fallback_rate: 0.0
      diagnostic_endpoints:
        - identified_evidence_gaps
        - resolution
        - elicitation
        - fidelity
        - reward
        - question_turns
    interval_diagnostic:
      schema_version: 1
      decision_rule: case_cluster_pareto_noninferiority
      effect_direction: current_library_minus_parent_library
      primary_endpoint: unique_disclosed_facts_per_question
      protected_endpoints:
        - unique_disclosed_facts
        - identified_evidence_gaps
        - resolution
        - elicitation
        - fidelity
        - critical_fact_recall
        - reward
        - question_turns
        - premature_final_rate
        - unsupported_claim_rate
        - belief_as_fact_rate
        - hidden_field_leak
        - repeated_question_rate
        - policy_fallback_rate
        - client_fallback_rate
      endpoint_rules:
        unique_disclosed_facts_per_question: {direction: higher, margin: 0.0}
        unique_disclosed_facts: {direction: higher, margin: 0.0}
        identified_evidence_gaps: {direction: higher, margin: 0.0}
        resolution: {direction: higher, margin: 0.0}
        elicitation: {direction: higher, margin: 0.0}
        fidelity: {direction: higher, margin: 0.0}
        critical_fact_recall: {direction: higher, margin: 0.0}
        reward: {direction: higher, margin: 0.0}
        question_turns: {direction: lower, margin: 0.0}
        premature_final_rate: {direction: lower, margin: 0.0}
        unsupported_claim_rate: {direction: lower, margin: 0.0}
        belief_as_fact_rate: {direction: lower, margin: 0.0}
        hidden_field_leak: {direction: lower, margin: 0.0}
        repeated_question_rate: {direction: lower, margin: 0.0}
        policy_fallback_rate: {direction: lower, margin: 0.0}
        client_fallback_rate: {direction: lower, margin: 0.0}
  final_cumulative_freeze_safeguard:
    enabled: true
    status: frozen_before_next_formal_run
    timing: after_B8_increment_diagnostic_before_training_complete
    arm_freeze_timing: before_B8_increment_diagnostic
    scope: same_B8_accumulated_library_diagnostic
    claim_role: cumulative_library_diagnostic_not_independent_confirmatory_claim
    comparator: fixed_empty_library
    effect_direction: selected_final_library_minus_empty_library
    endpoint_set: primary_and_practical_safety_with_full_16_diagnostics
    retention_gate:
      decision_rule: primary_benefit_practical_safety_noninferiority
      effect_direction: current_library_minus_empty_library
      primary_endpoint: unique_disclosed_facts_per_question
      primary_threshold: 0.0
      protected_endpoint_margins:
        unique_disclosed_facts: 0.0
        critical_fact_recall: 0.05
        premature_final_rate: 0.05
        unsupported_claim_rate: 0.05
        belief_as_fact_rate: 0.02
        hidden_field_leak: 0.0
        repeated_question_rate: 0.05
        policy_fallback_rate: 0.0
        client_fallback_rate: 0.0
      diagnostic_endpoints:
        - identified_evidence_gaps
        - resolution
        - elicitation
        - fidelity
        - reward
        - question_turns
    advancement:
      decision_rule: primary_positive_point_estimate
      endpoints:
        - unique_disclosed_facts_per_question
      threshold: 0.0
    isolation_required: true
    performance_nonpass_blocks_external: false
    isolation_failure_action: fail_closed_on_intervention_contamination
