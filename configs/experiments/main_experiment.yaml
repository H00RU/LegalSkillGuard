schema_version: 1
experiment_id: legal_skill_guard_main
status: prompt_memory_protocol_gpu_requalification_required
preparation_note: >-
  128案训练语料、8批×16案、官方30案污染隔离和852项事实CPU审计均已冻结。
  正式在线骨干是固定revision的Qwen3-8B；gpt-oss-20b以权限隔离接口承担客户闭集事实路由与
  离线结构化语义评估，gpt-5.6-luna
  只在跨案件因果证据簇合格后生成候选技能，并受共享硬账本约束。训练从空技能库开始，八批各16案；
  每批每案采用一个预声明且批内均衡的人格、K=4共享可见调查计划；没有待检候选时组成两个相同首问配对，
  有待检候选时只在预先适用的案件子集内保留共享对照与候选干预；领域候选不占无关领域的轨迹臂，
  通用候选稳定分摊未见案件，其余位置继续正常探索。证据跨批累积；
  候选通过来源证据绑定后，以固定的会话级结构化技能文档从首个律师决策起注入后续连续未见训练块，
  律师模型自主运用，系统不依据模型作答执行技能规则或改写动作；不另跑候选验收对话。
  单块内安全正向但暴露覆盖不足者至多累计3块，负向、安全回归或到期仍不足者回滚。
  技能库变化后的累计检查点及官方外测使用完整四人格矩阵检验稳健性，官方
  DLawBench中文30案只在技能库冻结后外测。四人格是披露压力条件而非独立样本扩增，24轮只是异常
  熔断。完整轨迹矩阵仍必须生成；若确定性policy/memo安全fallback接管了模型行为，则在任何奖励
  或候选结果可见之前排除其完整K=4归因组并报告损耗，剩余完整组不足预声明门槛时失败关闭。
  隐藏泄露、身份或哈希漂移等系统缺陷始终整批失败，不能通过组排除放行。
  新正式run启动前只重做绑定当前实现和模型revision的客户模拟器、本地语义裁判与端点资格；
  退役的64条首轮、20条完整对话、128案调查计划及其语义审计入口已从现行代码和配置删除，
  真实planner-policy-client链由正式第一批的集成健康门验证。
  受控分叉只出现在训练轨迹；官方外测不接受该训练干预。历史调试run及其轨迹、评分、候选和提示输出全部隔离，不进入训练或论文统计。
  当前轨迹协议16在协议15的事实类型谱系上，进一步记录固定技能文档暴露及其哈希，并禁止旧运行时技能执行器；
  F（新事实）、G（识别外部证据缺口）和安全停止是三个互不冒充的候选证据族。该状态只表示静态
  数据、批次和前瞻候选生命周期已冻结并绑定schema-2批次计划，当前Qwen实模资格仍须在全新run中重做。当前仍无协议16正式技能、提升曲线或
  官方30案外测结果；这些只能由通过新资格后的完整运行产生。
# Randomness for bootstrap/sign-flip algorithms only; this is not a dialogue matrix.
statistical_seed: 42
# This is a circuit breaker for a malformed/non-terminating policy, not a target
# dialogue length.  The lawyer policy, informed by prompt-delivered skills, chooses when to finish;
# the ceiling is hidden from their online input and any hit invalidates the rollout.
emergency_turn_ceiling: 24
personas: [P_WD, P_WS, P_CS, P_CD]

