<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Current LegalSkillEvolve protocol</title>
  <desc id="desc">Three-panel diagram showing a skill-blind investigation planner, policy-only skill delivery with a shared stop gate, source-witness-based skill accumulation, and prequential and frozen external evaluation.</desc>
  <defs>
    <style>
      .panel { fill:#ffffff; stroke:#a9b7c6; stroke-width:3; }
      .blue { fill:#eef5fb; stroke:#2f6fa3; stroke-width:3; }
      .teal { fill:#edf8f6; stroke:#20867f; stroke-width:3; }
      .violet { fill:#f7f2fa; stroke:#7a5a9e; stroke-width:3; }
      .amber { fill:#fff8e8; stroke:#b27a12; stroke-width:3; }
      .title { font:700 38px 'DejaVu Sans',Arial,sans-serif; fill:#203247; }
      .letter { font:700 42px 'DejaVu Sans',Arial,sans-serif; }
      .boxhead { font:700 28px 'DejaVu Sans',Arial,sans-serif; fill:#203247; text-anchor:middle; }
      .body { font:400 23px 'DejaVu Sans',Arial,sans-serif; fill:#33475c; text-anchor:middle; }
      .small { font:400 20px 'DejaVu Sans',Arial,sans-serif; fill:#687b8e; text-anchor:middle; }
      .note { font:400 21px 'DejaVu Sans',Arial,sans-serif; fill:#40566d; }
      .arrow { fill:none; stroke:#607589; stroke-width:4; marker-end:url(#arrow); }
      .tealarrow { fill:none; stroke:#20867f; stroke-width:4; marker-end:url(#arrowteal); }
      .violetarrow { fill:none; stroke:#7a5a9e; stroke-width:4; marker-end:url(#arrowviolet); }
      .dash { stroke-dasharray:11 9; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#607589"/></marker>
    <marker id="arrowteal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#20867f"/></marker>
    <marker id="arrowviolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7a5a9e"/></marker>
  </defs>

  <rect class="panel" x="25" y="25" width="1750" height="515" rx="24"/>
  <text class="letter" x="55" y="80" fill="#2f6fa3">a</text>
  <text class="title" x="115" y="80">One consultation with a frozen language model</text>
  <text class="note" x="115" y="116">The opening-based planner is skill-blind; fixed execution cards enter policy decisions only</text>

  <rect class="blue" x="55" y="155" width="235" height="145" rx="16"/>
  <text class="boxhead" x="173" y="204">Public opening</text>
  <text class="body" x="173" y="245">Visible case input</text>
  <text class="body" x="173" y="278">No hidden labels</text>

  <rect class="blue" x="350" y="145" width="315" height="165" rx="16"/>
  <text class="boxhead" x="508" y="192">Investigation plan</text>
  <text class="body" x="508" y="234">Opening only</text>
  <text class="body" x="508" y="267">Skill- and arm-blind agenda</text>
  <text class="small" x="508" y="297">shared in paired evaluation</text>

  <rect class="blue" x="745" y="135" width="370" height="185" rx="16"/>
  <text class="boxhead" x="930" y="184">Lawyer policy</text>
  <text class="body" x="930" y="227">Ask · clarify · verify · stop</text>
  <text class="body" x="930" y="266">Visible dialogue + state</text>
  <text class="body" x="930" y="300">Fixed execution-card bundle</text>

  <rect class="violet" x="1240" y="135" width="480" height="185" rx="16"/>
  <text class="boxhead" x="1480" y="184">Finite-belief client</text>
  <text class="body" x="1480" y="227">Closed-set fact routing</text>
  <text class="body" x="1480" y="266">Persona disclosure rules</text>
  <text class="body" x="1480" y="300">Deterministic response rendering</text>

  <path class="arrow" d="M290 227 H350"/>
  <path class="arrow" d="M665 227 H745"/>
  <path class="arrow" d="M1115 208 H1240"/>
  <text class="small" x="1175" y="190">question</text>
  <path class="violetarrow" d="M1240 272 H1115"/>
  <text class="small" x="1175" y="300">response</text>

  <rect class="teal" x="55" y="365" width="405" height="130" rx="16"/>
  <text class="boxhead" x="258" y="410">Frozen case-level route</text>
  <text class="body" x="258" y="450">Public opening + frozen skill catalogue</text>
  <text class="small" x="258" y="482">current external implementation</text>
  <path class="tealarrow" d="M173 300 V350 H258 V365"/>

  <rect class="teal" x="520" y="365" width="420" height="130" rx="16"/>
  <text class="boxhead" x="730" y="410">Fixed session bundle</text>
  <text class="body" x="730" y="450">General + at most one routed domain</text>
  <text class="small" x="730" y="482">same documents on every policy turn</text>
  <path class="tealarrow" d="M460 430 H520"/>
  <path class="tealarrow" d="M730 365 V337 H930 V320"/>

  <rect class="amber" x="1000" y="365" width="315" height="130" rx="16"/>
  <text class="boxhead" x="1158" y="410">Shared safeguards</text>
  <text class="body" x="1158" y="450">Structure repair + StopGate</text>
  <text class="small" x="1158" y="482">redirects are logged</text>
  <path class="arrow" d="M1010 320 V365"/>

  <rect class="blue" x="1375" y="365" width="345" height="130" rx="16"/>
  <text class="boxhead" x="1548" y="410">Memo + audit trail</text>
  <text class="body" x="1548" y="450">Visible record only</text>
  <text class="small" x="1548" y="482">dialogue, events and interventions</text>
  <path class="arrow" d="M1315 430 H1375"/>
  <path class="violetarrow" d="M1480 320 V350 H1548 V365"/>

  <rect class="panel" x="25" y="570" width="1750" height="570" rx="24"/>
  <text class="letter" x="55" y="625" fill="#20867f">b</text>
  <text class="title" x="115" y="625">Learning source-bound execution cards from training experience</text>
  <text class="note" x="115" y="662">Contrasts are observational mechanism hypotheses; source witnesses remain separate from deployed prose</text>

  <rect class="blue" x="55" y="710" width="285" height="155" rx="16"/>
  <text class="boxhead" x="198" y="756">Experience block</text>
  <text class="body" x="198" y="798">16 new cases</text>
  <text class="body" x="198" y="833">4 full trajectories / case</text>

  <rect class="violet" x="395" y="710" width="300" height="155" rx="16"/>
  <text class="boxhead" x="545" y="756">Offline scoring</text>
  <text class="body" x="545" y="798">Events F, G and Q</text>
  <text class="body" x="545" y="833">Quality + bounded reward</text>

  <rect class="teal" x="750" y="710" width="330" height="155" rx="16"/>
  <text class="boxhead" x="915" y="756">Contrast bank</text>
  <text class="body" x="915" y="798">Fact · gap · stopping criteria</text>
  <text class="body" x="915" y="833">Cumulative source witnesses</text>

  <rect class="teal" x="1135" y="710" width="585" height="155" rx="16"/>
  <text class="boxhead" x="1428" y="756">Evidence clusters and teacher</text>
  <text class="body" x="1428" y="798">General: ≥2 domains · domain: scoped support</text>
  <text class="body" x="1428" y="833">0–6 attempts / block; stop after 3 unique candidates</text>

  <path class="tealarrow" d="M340 788 H395"/>
  <path class="tealarrow" d="M695 788 H750"/>
  <path class="tealarrow" d="M1080 788 H1135"/>

  <rect class="teal" x="1180" y="935" width="540" height="150" rx="16"/>
  <text class="boxhead" x="1450" y="980">Teacher-generated skill</text>
  <text class="body" x="1450" y="1022">Scope · cues · procedure · question guidance</text>
  <text class="body" x="1450" y="1057">Expected effects · contraindications · limits</text>
  <path class="tealarrow" d="M1428 865 V935"/>

  <rect class="amber" x="590" y="935" width="520" height="150" rx="16"/>
  <text class="boxhead" x="850" y="980">Finite admission checks</text>
  <text class="body" x="850" y="1022">Structure · source witness · hidden-field isolation</text>
  <text class="body" x="850" y="1057">Limited safety phrases · deduplication · capacity</text>
  <path class="tealarrow" d="M1180 1010 H1110"/>

  <rect class="teal" x="55" y="935" width="465" height="150" rx="16"/>
  <text class="boxhead" x="288" y="980">Working library L_b</text>
  <text class="body" x="288" y="1022">Append admitted documents</text>
  <text class="body" x="288" y="1057">Immutable block version</text>
  <path class="tealarrow" d="M590 1010 H520"/>
  <path class="tealarrow dash" d="M288 935 V900 H35 V430 H55"/>

  <rect class="panel" x="25" y="1170" width="1750" height="300" rx="24"/>
  <text class="letter" x="55" y="1225" fill="#b27a12">c</text>
  <text class="title" x="115" y="1225">Evaluate the accumulated library without retroactive candidate selection</text>

  <rect class="amber" x="70" y="1280" width="500" height="135" rx="16"/>
  <text class="boxhead" x="320" y="1325">Prequential diagnostic</text>
  <text class="body" x="320" y="1365">8 fixed sample-0 pairs / block</text>
  <text class="small" x="320" y="1398">eight points evaluate L0 … L7</text>

  <rect class="amber" x="650" y="1280" width="430" height="135" rx="16"/>
  <text class="boxhead" x="865" y="1325">Library inspection</text>
  <text class="body" x="865" y="1365">After blocks 2, 4, 6 and 8</text>
  <text class="small" x="865" y="1398">report only; no automatic editing</text>

  <rect class="amber" x="1160" y="1280" width="560" height="135" rx="16"/>
  <text class="boxhead" x="1440" y="1325">Frozen L8 external evaluation</text>
  <text class="body" x="1440" y="1365">30 cases × 4 personas × frozen methods</text>
  <text class="small" x="1440" y="1398">case-level paired inference</text>

  <!-- Explicit arrowheads are included because some office PNG exporters omit SVG markers. -->
  <g fill="#607589">
    <path d="M350 227 l-15 -9 v18 z"/>
    <path d="M745 227 l-15 -9 v18 z"/>
    <path d="M1240 208 l-15 -9 v18 z"/>
    <path d="M1010 365 l-9 -15 h18 z"/>
    <path d="M1375 430 l-15 -9 v18 z"/>
  </g>
  <g fill="#7a5a9e">
    <path d="M1115 272 l15 -9 v18 z"/>
    <path d="M1548 365 l-9 -15 h18 z"/>
  </g>
  <g fill="#20867f">
    <path d="M258 365 l-9 -15 h18 z"/>
    <path d="M520 430 l-15 -9 v18 z"/>
    <path d="M930 320 l-9 15 h18 z"/>
    <path d="M395 788 l-15 -9 v18 z"/>
    <path d="M750 788 l-15 -9 v18 z"/>
    <path d="M1135 788 l-15 -9 v18 z"/>
    <path d="M1428 935 l-9 -15 h18 z"/>
    <path d="M1110 1010 l15 -9 v18 z"/>
    <path d="M520 1010 l15 -9 v18 z"/>
    <path d="M55 430 l-15 -9 v18 z"/>
  </g>
</svg>
