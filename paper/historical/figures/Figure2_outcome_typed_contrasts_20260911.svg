<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1173" viewBox="0 0 1600 1173">
  <rect width="1600" height="1173" fill="#ffffff"/>
  <style>
    .panel { fill:#fbfdff; stroke:#a8bfd4; stroke-width:2; }
    .box-blue { fill:#f1f7fc; stroke:#2878b8; stroke-width:2; }
    .box-teal { fill:#eef9f7; stroke:#1a8a86; stroke-width:2; }
    .box-purple { fill:#f7f2fb; stroke:#7d55b3; stroke-width:2; }
    .box-gold { fill:#fff9ec; stroke:#c98616; stroke-width:2; }
    .title { font-family:'Liberation Sans',Arial,sans-serif; font-size:28px; font-weight:700; fill:#20364d; }
    .subtitle { font-family:'Liberation Sans',Arial,sans-serif; font-size:21px; font-weight:700; fill:#20364d; }
    .body { font-family:'Liberation Sans',Arial,sans-serif; font-size:18px; fill:#30485e; }
    .small { font-family:'Liberation Sans',Arial,sans-serif; font-size:15px; fill:#667c90; }
    .label { font-family:'Liberation Sans',Arial,sans-serif; font-size:24px; font-weight:700; fill:#2878b8; }
    .arrow { stroke:#2c7b8a; stroke-width:2.4; fill:none; }
    .dash { stroke:#2c7b8a; stroke-width:2.2; stroke-dasharray:8 7; fill:none; }
  </style>

  <!-- Panel a -->
  <rect class="panel" x="35" y="30" rx="18" ry="18" width="1530" height="500"/>
  <text class="label" x="60" y="72">a</text>
  <text class="title" x="105" y="72">Independent complete trajectories under one block-start library</text>

  <rect class="box-blue" x="75" y="130" rx="14" ry="14" width="265" height="300"/>
  <text class="subtitle" x="207" y="185" text-anchor="middle">Shared conditions</text>
  <text class="body" x="207" y="226" text-anchor="middle">Same public opening</text>
  <text class="body" x="207" y="257" text-anchor="middle">Cooperative persona</text>
  <text class="body" x="207" y="288" text-anchor="middle">Same policy bundle L(b−1)</text>
  <text class="small" x="207" y="338" text-anchor="middle">Planner reads opening only</text>
  <text class="small" x="207" y="365" text-anchor="middle">Policy receives fixed bundle</text>
  <text class="small" x="207" y="405" text-anchor="middle">Four sampling streams</text>

  <!-- Four trajectory rows -->
  <g>
    <text class="subtitle" x="375" y="154">τ1</text>
    <rect class="box-blue" x="420" y="120" rx="11" ry="11" width="190" height="55"/>
    <text class="subtitle" x="515" y="155" text-anchor="middle">Plan</text>
    <rect class="box-teal" x="690" y="120" rx="11" ry="11" width="500" height="55"/>
    <text class="subtitle" x="940" y="155" text-anchor="middle">Policy questions + client responses</text>
    <rect class="box-blue" x="1270" y="120" rx="11" ry="11" width="180" height="55"/>
    <text class="subtitle" x="1360" y="155" text-anchor="middle">Memo · r,F,G,Q</text>

    <text class="subtitle" x="375" y="241">τ2</text>
    <rect class="box-teal" x="420" y="207" rx="11" ry="11" width="190" height="55"/>
    <text class="subtitle" x="515" y="242" text-anchor="middle">Plan</text>
    <rect class="box-blue" x="690" y="207" rx="11" ry="11" width="500" height="55"/>
    <text class="subtitle" x="940" y="242" text-anchor="middle">Policy questions + client responses</text>
    <rect class="box-teal" x="1270" y="207" rx="11" ry="11" width="180" height="55"/>
    <text class="subtitle" x="1360" y="242" text-anchor="middle">Memo · r,F,G,Q</text>

    <text class="subtitle" x="375" y="328">τ3</text>
    <rect class="box-blue" x="420" y="294" rx="11" ry="11" width="190" height="55"/>
    <text class="subtitle" x="515" y="329" text-anchor="middle">Plan</text>
    <rect class="box-teal" x="690" y="294" rx="11" ry="11" width="500" height="55"/>
    <text class="subtitle" x="940" y="329" text-anchor="middle">Policy questions + client responses</text>
    <rect class="box-blue" x="1270" y="294" rx="11" ry="11" width="180" height="55"/>
    <text class="subtitle" x="1360" y="329" text-anchor="middle">Memo · r,F,G,Q</text>

    <text class="subtitle" x="375" y="415">τ4</text>
    <rect class="box-teal" x="420" y="381" rx="11" ry="11" width="190" height="55"/>
    <text class="subtitle" x="515" y="416" text-anchor="middle">Plan</text>
    <rect class="box-blue" x="690" y="381" rx="11" ry="11" width="500" height="55"/>
    <text class="subtitle" x="940" y="416" text-anchor="middle">Policy questions + client responses</text>
    <rect class="box-teal" x="1270" y="381" rx="11" ry="11" width="180" height="55"/>
    <text class="subtitle" x="1360" y="416" text-anchor="middle">Memo · r,F,G,Q</text>
  </g>

  <!-- arrows panel a -->
  <g class="arrow">
    <path d="M340 275 H385"/><path d="M378 268 L390 275 L378 282 Z" fill="#2c7b8a"/>
    <path d="M610 147 H675"/><path d="M668 140 L680 147 L668 154 Z" fill="#2c7b8a"/>
    <path d="M610 234 H675"/><path d="M668 227 L680 234 L668 241 Z" fill="#2c7b8a"/>
    <path d="M610 321 H675"/><path d="M668 314 L680 321 L668 328 Z" fill="#2c7b8a"/>
    <path d="M610 408 H675"/><path d="M668 401 L680 408 L668 415 Z" fill="#2c7b8a"/>
    <path d="M1190 147 H1255"/><path d="M1248 140 L1260 147 L1248 154 Z" fill="#2c7b8a"/>
    <path d="M1190 234 H1255"/><path d="M1248 227 L1260 234 L1248 241 Z" fill="#2c7b8a"/>
    <path d="M1190 321 H1255"/><path d="M1248 314 L1260 321 L1248 328 Z" fill="#2c7b8a"/>
    <path d="M1190 408 H1255"/><path d="M1248 401 L1260 408 L1248 415 Z" fill="#2c7b8a"/>
  </g>
  <text class="small" x="820" y="485" text-anchor="middle">Plans and visible states may differ; source contrasts support hypotheses, not counterfactual effects.</text>

  <!-- Panel b -->
  <rect class="panel" x="35" y="555" rx="18" ry="18" width="1530" height="340"/>
  <text class="label" x="60" y="597">b</text>
  <text class="title" x="105" y="597">Three outcome-typed contrast criteria</text>
  <text class="small" x="800" y="638" text-anchor="middle">Every selected pair also requires a positive reward gap and a learnable action difference.</text>

  <rect class="box-teal" x="80" y="680" rx="14" ry="14" width="430" height="155"/>
  <text class="subtitle" x="295" y="726" text-anchor="middle">Fact elicitation</text>
  <text class="body" x="295" y="770" text-anchor="middle">ΔF &gt; 0; or equal positive F,</text>
  <text class="body" x="295" y="803" text-anchor="middle">different fact sets and fewer Q</text>

  <rect class="box-purple" x="585" y="680" rx="14" ry="14" width="430" height="155"/>
  <text class="subtitle" x="800" y="726" text-anchor="middle">Evidence-gap recognition</text>
  <text class="body" x="800" y="770" text-anchor="middle">ΔG &gt; 0 and ΔF ≥ 0</text>
  <text class="body" x="800" y="803" text-anchor="middle">Correct external information needs</text>

  <rect class="box-gold" x="1090" y="680" rx="14" ry="14" width="430" height="155"/>
  <text class="subtitle" x="1305" y="726" text-anchor="middle">Efficient stopping</text>
  <text class="body" x="1305" y="770" text-anchor="middle">Identical fact and gap sets</text>
  <text class="body" x="1305" y="803" text-anchor="middle">Fewer questions</text>

  <!-- Panel c -->
  <rect class="panel" x="35" y="920" rx="18" ry="18" width="1530" height="220"/>
  <text class="label" x="60" y="963">c</text>
  <text class="title" x="105" y="963">Separate source witnesses from deployable advice</text>

  <rect class="box-purple" x="80" y="1000" rx="13" ry="13" width="350" height="90"/>
  <text class="subtitle" x="255" y="1038" text-anchor="middle">System-owned source witness</text>
  <text class="small" x="255" y="1068" text-anchor="middle">Trajectory IDs · states · hashes · outcomes</text>

  <rect class="box-teal" x="610" y="1000" rx="13" ry="13" width="360" height="90"/>
  <text class="subtitle" x="790" y="1038" text-anchor="middle">Procedural skill hypothesis</text>
  <text class="small" x="790" y="1068" text-anchor="middle">Advice contains no source identifiers</text>

  <rect class="box-gold" x="1150" y="1000" rx="13" ry="13" width="370" height="90"/>
  <text class="subtitle" x="1335" y="1038" text-anchor="middle">Finite static gates → L_b</text>
  <text class="small" x="1335" y="1068" text-anchor="middle">No legal-validation or per-skill effect test</text>

  <g class="arrow">
    <path d="M430 1045 H590"/><path d="M583 1038 L595 1045 L583 1052 Z" fill="#2c7b8a"/>
    <path d="M970 1045 H1130"/><path d="M1123 1038 L1135 1045 L1123 1052 Z" fill="#2c7b8a"/>
  </g>
</svg>
