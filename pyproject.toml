[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-skill-evolve"
version = "0.2.0"
description = "Source-grounded skill evolution for legal document inference and evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "tiktoken>=0.9,<1",
  "scikit-learn==1.7.2",
  "lightgbm==4.6.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff==0.16.1"]

[project.scripts]
legal-skill = "legal_skill_guard.cli:main"

[tool.setuptools.packages.find]
include = ["legal_skill_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legal_skill_guard/_vendor"]

[tool.setuptools.package-data]
legal_skill_guard = ["_vendor/*.txt", "_vendor/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
