[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-skill-guard"
version = "0.1.0"
description = "Verifier-gated self-evolving skills for multi-turn legal consultation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research code; upstream datasets retain their own licenses" }
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
inference = [
  "modelscope==1.38.1",
  "transformers==4.56.2",
  "vllm==0.10.2",
]

[tool.setuptools.packages.find]
include = ["legal_skill_guard*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that read prepared public datasets or upstream checkouts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
